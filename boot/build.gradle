plugins { id 'com.android.application' }
android {
  namespace 'ar.com.rango5gps.drivelabauto.boot'
  compileSdk 35
  defaultConfig {
    applicationId 'ar.com.rango5gps.drivelabauto.boot'
    minSdk 30
    targetSdk 32
    // First *permanently signed* LAB build. Version increments for every OTA.
    versionCode 15
    versionName '0.1.14'
  }
  signingConfigs {
    release {
      if (System.getenv('RECEIVER_KEYSTORE')) {
        storeFile file(System.getenv('RECEIVER_KEYSTORE'))
        storePassword System.getenv('RECEIVER_STORE_PASSWORD')
        keyAlias System.getenv('RECEIVER_KEY_ALIAS')
        keyPassword System.getenv('RECEIVER_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    // QA/LAB is a separate installable APK. Never replace an existing
    // stable, differently signed Boot on the owner's Jetour head unit.
    // Independent package, tasks and private data. No vehicle controls
    // or OEM changes are enabled implicitly.
    debug {
      applicationIdSuffix '.lab'
      versionNameSuffix '-lab-20261120'
      manifestPlaceholders.bridgeLabel = 'DriveLab Bridge LAB'
    }
    release {
      signingConfig signingConfigs.release
      minifyEnabled false
      manifestPlaceholders.bridgeLabel = 'DriveLab Bridge'
    }
    // Same isolated package as debug LAB, but a PERMANENT release keystore.
    // Subsequent LAB over-the-air installs must use this exact certificate.
    lab {
      initWith release
      applicationIdSuffix '.lab'
      versionNameSuffix '-lab.11'
      manifestPlaceholders.bridgeLabel = 'DriveLab Bridge LAB'
      matchingFallbacks = ['release']
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation project(':common')
  implementation 'com.google.zxing:core:3.5.4'
  implementation 'androidx.core:core:1.13.1'
}
gradle.taskGraph.whenReady { graph ->
  if ((graph.hasTask(':boot:assembleRelease') || graph.hasTask(':boot:assembleLab')) && !System.getenv('RECEIVER_KEYSTORE')) {
    throw new GradleException('Missing RECEIVER_KEYSTORE for signed DriveLab Boot')
  }
}
