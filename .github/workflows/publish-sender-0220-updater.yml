name: Signed Sender 0.2.20 - updater manifest repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-sender-0220-updater.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  sender-updater:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SENDER_STORE_PASSWORD: ${{ secrets.SENDER_STORE_PASSWORD }}
      SENDER_KEY_ALIAS: ${{ secrets.SENDER_KEY_ALIAS }}
      SENDER_KEY_PASSWORD: ${{ secrets.SENDER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore existing Sender signing identity
        env:
          SENDER_KEYSTORE_B64: ${{ secrets.SENDER_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
          test -n "$SENDER_KEYSTORE_B64" && test -n "$SENDER_STORE_PASSWORD"
          test -n "$SENDER_KEY_ALIAS" && test -n "$SENDER_KEY_PASSWORD"
          printf %s "$SENDER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sender.p12"
          chmod 600 "$RUNNER_TEMP/sender.p12"
          echo "SENDER_KEYSTORE=$RUNNER_TEMP/sender.p12" >> "$GITHUB_ENV"
      - name: Validate both URL paths and sign Sender update only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = bruceferra/drivelab-auto-standalone
          # Existing v0.2.20 is a historical RECEIVER release. Reuse its
          # tag only by ADDING a uniquely named Sender APK asset; never
          # overwrite or modify its Receiver APK/metadata.
          test "$(gh release view v0.2.20 --json tagName --jq .tagName)" = v0.2.20
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.14
          ! gh release view v0.2.20 --json assets --jq '.assets[].name' | grep -Fxq 'DriveLab-Auto-Sender-v0.2.20.apk'
          mkdir -p /tmp/sender-old /tmp/updater-test output
          gh release download sender-v0.2.19 --pattern 'DriveLab-Auto-Sender-v0.2.19.apk' --dir /tmp/sender-old
          javac -encoding UTF-8 -d /tmp/updater-test \
            common/src/main/java/ar/com/rango5gps/drivelabauto/common/UpdaterManifestUrlPolicy.java \
            common/tests/UpdaterManifestUrlPolicyTest.java \
            sender/tests/SenderBluetoothPickerSourceContractTest.java \
            sender/tests/SenderAudioBootstrapSourceContractTest.java
          java -cp /tmp/updater-test ar.com.rango5gps.drivelabauto.common.UpdaterManifestUrlPolicyTest
          java -cp /tmp/updater-test ar.com.rango5gps.drivelabauto.sender.SenderBluetoothPickerSourceContractTest
          java -cp /tmp/updater-test ar.com.rango5gps.drivelabauto.sender.SenderAudioBootstrapSourceContractTest
          gradle --no-daemon :sender:assembleRelease
          apk=sender/build/outputs/apk/release/sender-release.apk
          test -s "$apk"
          sig="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$sig" verify --print-certs "$apk"
          old=/tmp/sender-old/DriveLab-Auto-Sender-v0.2.19.apk
          "$sig" verify --print-certs "$old"
          oldcert=$("$sig" verify --print-certs "$old" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          newcert=$("$sig" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$oldcert" && test "$oldcert" = "$newcert"
          badge=$("$aapt" dump badging "$apk" | head -1)
          echo "$badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.sender'"
          echo "$badge" | grep -F "versionCode='21'"
          echo "$badge" | grep -F "versionName='0.2.20'"
          cp "$apk" output/DriveLab-Auto-Sender-v0.2.20.apk
          export SENDER_SHA=$(sha256sum output/DriveLab-Auto-Sender-v0.2.20.apk | awk '{print $1}')
          python3 - <<'PY'
          import json,os
          sha=os.environ['SENDER_SHA']
          assert len(sha)==64
          obj={'packageName':'ar.com.rango5gps.drivelabauto.sender',
               'versionName':'0.2.20','versionCode':21,
               'sha256':sha,
               'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.2.20/DriveLab-Auto-Sender-v0.2.20.apk'}
          with open('output/sender.json','w') as f: json.dump(obj,f,indent=2)
          PY
          # The deployed manifest's EXACT URL is accepted both by old
          # Sender 0.2.19 and new Sender 0.2.20.
          python3 - <<'PY'
          import json
          m=json.load(open('output/sender.json'))
          ver=m['versionName']
          expected=f'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v{ver}/DriveLab-Auto-Sender-v{ver}.apk'
          assert m['apkUrl']==expected and m['versionCode']==21
          PY
          sha256sum output/DriveLab-Auto-Sender-v0.2.20.apk > output/sender.sha256
      - name: Add Sender APK to historical v0.2.20 and update latest OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.14
          ! gh release view v0.2.20 --json assets --jq '.assets[].name' | grep -Fxq 'DriveLab-Auto-Sender-v0.2.20.apk'
          gh release upload v0.2.20 output/DriveLab-Auto-Sender-v0.2.20.apk
          mkdir -p verify
          gh release download v0.2.20 --pattern 'DriveLab-Auto-Sender-v0.2.20.apk' --dir verify
          cmp output/DriveLab-Auto-Sender-v0.2.20.apk verify/DriveLab-Auto-Sender-v0.2.20.apk
          # The sole Sender manifest on latest is advanced. Receiver 0.3.14
          # and its receiver.json / APK are UNCHANGED.
          gh release upload v0.3.14 output/sender.json --clobber
          gh release download v0.3.14 --pattern sender.json --dir verify
          cmp output/sender.json verify/sender.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.14
          gh release view v0.3.14 --json assets --jq '.assets[].name'
          echo 'Sender 0.2.20 OTA is offered to installed 0.2.19; Receiver unchanged.'
