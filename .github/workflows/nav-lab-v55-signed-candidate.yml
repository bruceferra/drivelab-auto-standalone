name: DriveLab NAV LAB 55 — ORIGINAL signed APK candidate (NO OTA)
on:
  push:
    branches: [fix/nav-lab55-no-pause-four-slot-transfer-20261122]
    paths:
      - '.github/workflows/nav-lab-v55-signed-candidate.yml'
      - 'nav-release-v42/apps/**'
      - 'nav-release-v42/tools/**'
      - 'nav-release-v42/SOURCE_SNAPSHOT.json'

permissions:
  contents: read

concurrency:
  group: drivelab-nav-v46-jetour-mosaic-original-sign-20261122
  cancel-in-progress: true

jobs:
