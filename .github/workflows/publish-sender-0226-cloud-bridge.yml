name: DriveLab Sender 0.2.26 original-signed Cloud OTA bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-sender-0226-cloud-bridge.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  sign-sender:
    if: github.repository == 'bruceferra/drivelab-auto-standalone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SENDER_STORE_PASSWORD: ${{ secrets.SENDER_STORE_PASSWORD }}
      SENDER_KEY_ALIAS: ${{ secrets.SENDER_KEY_ALIAS }}
      SENDER_KEY_PASSWORD: ${{ secrets.SENDER_KEY_PASSWORD }}
      TAG: sender-v0.2.26
      STABLE: v0.3.99
      APK: DriveLab-Auto-Sender-v0.2.26.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK and original Sender key
        env:
          SENDER_KEYSTORE_B64: ${{ secrets.SENDER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
          test -n "$SENDER_KEYSTORE_B64"
          test -n "$SENDER_STORE_PASSWORD" && test -n "$SENDER_KEY_ALIAS" && test -n "$SENDER_KEY_PASSWORD"
          printf %s "$SENDER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sender.p12"
          chmod 600 "$RUNNER_TEMP/sender.p12"
          echo "SENDER_KEYSTORE=$RUNNER_TEMP/sender.p12" >> "$GITHUB_ENV"
      - name: Verify canonical mirrored Sender files and pure Java Cloud OTA tests
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$STABLE"
          ! gh release view "$TAG" >/dev/null 2>&1
          test "$(git hash-object common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java)" = b090dc5deb366ed799f915c69b40249cea91a169
          test "$(git hash-object common/src/main/java/ar/com/rango5gps/drivelabauto/common/SenderCloudOta.java)" = 784963f2a01d490ed8380677d57f57025a4eda22
          test "$(git hash-object common/src/main/java/ar/com/rango5gps/drivelabauto/common/SenderCloudOtaPolicy.java)" = 0f0c3c6b9869d7bd285b45093d425db24ba36717
          test "$(git hash-object common/tests/SenderCloudOtaPolicyTest.java)" = e64e9cec126bf1f6a76799babffddba8e3fae2ee
          test "$(git hash-object sender/build.gradle)" = 790c1e9be65ed92914c54abf3908ac2ec066bb3d
          test "$(git hash-object sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/SenderActivity.java)" = dce4a3118f6bf6dc748b8d91c8605c2601118e3c
          test "$(git hash-object sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/RouteDispatchService.java)" = b61b095efc796fe0700457d134128db26a86806f
          test "$(git hash-object sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/SenderBridgeDiscovery.java)" = a103b019e56f9f19d4aaef8c6082b10f451dddf4
          test "$(git hash-object sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/SenderClient.java)" = e9c3edf009ea5bf539eecb8ea9759f12ddf0150f
          test "$(git hash-object sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/SenderRouteTarget.java)" = befe66f0478b6b3af376bd0863bb85610d0ba4f9
          mkdir -p "$RUNNER_TEMP/sender-cloud-tests"
          javac -encoding UTF-8 --release 17 -d "$RUNNER_TEMP/sender-cloud-tests" common/src/main/java/ar/com/rango5gps/drivelabauto/common/SenderCloudOtaPolicy.java common/tests/SenderCloudOtaPolicyTest.java
          java -cp "$RUNNER_TEMP/sender-cloud-tests" ar.com.rango5gps.drivelabauto.common.SenderCloudOtaPolicyTest
          python3 - <<'PY'
          from pathlib import Path
          root=Path('common/src/main/java/ar/com/rango5gps/drivelabauto/common')
          updater=(root/'Updater.java').read_text()
          client=(root/'SenderCloudOta.java').read_text()
          activity=Path('sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/SenderActivity.java').read_text()
          gradle=Path('sender/build.gradle').read_text()
          assert 'SenderCloudOta.lookup(a)' in updater and 'ReceiverCloudOta.lookup(a)' in updater
          assert 'latestFromManifest(a,app)' in updater
          assert 'certificateHashes(candidate).contains(offer.signerSha256)' in updater
          assert 'requestInstaller(a,apk,offer,reporter)' in updater
          assert 'SenderCloudOta.isEnrolled(this)' in activity
          assert 'AndroidKeyStore' in client and 'AES/GCM/NoPadding' in client
          assert "versionCode 31" in gradle and "versionName '0.2.26'" in gradle
          print('PASS SENDER_026_CLOUD_OTA_SOURCE')
          PY
      - name: Build signed Sender only, compare original certificate and preserve AUTO
        run: |
          set -euo pipefail
          mkdir -p old dist before
          gh release download sender-v0.2.25 --pattern DriveLab-Auto-Sender-v0.2.25.apk --dir old
          gh release download "$STABLE" --pattern receiver.json --dir before
          gh release download "$STABLE" --pattern sender.json --dir before
          gradle --no-daemon :sender:assembleRelease
          apk=sender/build/outputs/apk/release/sender-release.apk
          test -s "$apk"
          sig="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$sig" verify --print-certs "$apk"
          "$sig" verify --print-certs old/DriveLab-Auto-Sender-v0.2.25.apk
          "$aapt" dump badging "$apk" | grep -F "package: name='ar.com.rango5gps.drivelabauto.sender' versionCode='31' versionName='0.2.26'"
          oldcert=$("$sig" verify --print-certs old/DriveLab-Auto-Sender-v0.2.25.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          newcert=$("$sig" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$oldcert" && test "$newcert" = "$oldcert"
          test "$newcert" = 19e86fcc66d8912d8d175958fccf86326e9bf262b7dec3b238169d4ca4ce5d41
          cp "$apk" "dist/$APK"
          export SENDER_SHA=$(sha256sum "dist/$APK" | awk '{print $1}')
          python3 - <<'PY'
          import json,os
          obj={'packageName':'ar.com.rango5gps.drivelabauto.sender',
            'versionName':'0.2.26','versionCode':31,'sha256':os.environ['SENDER_SHA'],
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/sender-v0.2.26/DriveLab-Auto-Sender-v0.2.26.apk'}
          with open('dist/sender.json','w') as f:json.dump(obj,f,indent=2)
          PY
          sha256sum "dist/$APK" > dist/SHA256SUMS
      - name: Publish only Sender, keep AUTO 0.3.99 latest and update Sender manifest
        run: |
          set -euo pipefail
          ! gh release view "$TAG" >/dev/null 2>&1
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$STABLE"
          gh release create "$TAG" "dist/$APK" dist/sender.json dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title 'DriveLab NAV Sender 0.2.26 · Jetour Cloud OTA bridge' \
            --notes 'Sender 0.2.26 code31 con firma original, UI Jetour, QR y rutas preservadas. OTA Cloud opcional pendiente de endpoint publico; actualizador firmado GitHub conservado. Instalar sobre Sender existente; no desinstalar. No se modifica Receiver 0.3.99 ni NAV en la T1.'
          mkdir -p verify after
          gh release download "$TAG" --pattern "$APK" --dir verify
          gh release download "$TAG" --pattern sender.json --dir verify
          cmp "dist/$APK" "verify/$APK"
          cmp dist/sender.json verify/sender.json
          gh release upload "$STABLE" dist/sender.json --clobber
          gh release download "$STABLE" --pattern sender.json --dir after
          gh release download "$STABLE" --pattern receiver.json --dir after
          cmp dist/sender.json after/sender.json
          cmp before/receiver.json after/receiver.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$STABLE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE" --jq '.assets | map(select(.name=="DriveLab-Auto-Receiver-v0.3.99.apk")) | length')" = 1
          echo 'SIGNED_SENDER_026_OK AUTO_099_UNCHANGED' >> "$GITHUB_STEP_SUMMARY"
