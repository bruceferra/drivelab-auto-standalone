name: Publish DriveLab NAV LAB43 OTA from approved original-signed CI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nav-lab43-ota-publisher.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: drivelab-nav43-recover-main-publisher
  cancel-in-progress: false

jobs:
  publish-nav:
    if: github.repository == 'bruceferra/drivelab-auto-standalone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '45055033460'
      SOURCE_SHA: '83aa30f7c44e4644659b3559bfd1d3b19c9a3e67'
      TAG_SOURCE_SHA: '3242c9efd001f60a11d14fcdc295208482025d73'
      TAG: 'bridge-lab-v43'
      APK: 'DriveLab-Bridge-LAB-v0.1.45-lab.43.apk'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 64
          persist-credentials: false
      - name: Require owner approval, signed build success and exact source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data=json.load(open('nav-ota-provenance/lab43.json',encoding='utf-8'))
          assert data['kind']=='drivelab-nav-ota-provenance'
          assert data['sourceRunId']==45055033460
          assert data['sourceCommit']=='83aa30f7c44e4644659b3559bfd1d3b19c9a3e67'
          assert data['sourceBranch']=='fix/nav-lab43-waze-public-launch-safe-relocation-20261122'
          assert data['applicationId']=='ar.com.rango5gps.drivelabauto.boot.lab'
          assert data['versionName']=='0.1.45-lab.43'
          assert data['versionCode']==47 and data['releaseTag']=='bridge-lab-v43'
          assert data['previousOtaVersion']=='0.1.44-lab.42'
          assert data['previousOtaSha256']=='ba675fc5458a3fd7524456bd22e58e747f5c65b071e5b6baf05d68eb8415645f'
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success || {
            echo 'BLOCKED: signed candidate CI not successful';exit 21;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_branch)" = fix/nav-lab43-waze-public-launch-safe-relocation-20261122
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA" || {
            echo 'BLOCKED: signed candidate head SHA mismatch';exit 22;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97 || {
            echo 'BLOCKED: stable release pointer changed';exit 23;
          }
          ! gh release view "$TAG" >/dev/null 2>&1 || {
            echo 'BLOCKED: LAB43 release already exists';exit 24;
          }
      - name: Retrieve signed candidate, verify exact legacy OTA filename/hash/size and original certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nav43 original
          gh run download "$SOURCE_RUN" --name DriveLab-NAV-LAB43-SIGNED-CANDIDATE-NO-OTA --dir dist/nav43
          (cd dist/nav43; sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          d=pathlib.Path('dist/nav43')
          apk=d/'DriveLab-Bridge-LAB-v0.1.45-lab.43.apk'
          m=json.loads((d/'bridge-lab.json').read_text(encoding='utf8'))
          assert apk.is_file() and apk.stat().st_size>1024
          expected={
            'channel':'bridge-lab',
            'packageName':'ar.com.rango5gps.drivelabauto.boot.lab',
            'versionName':'0.1.45-lab.43',
            'versionCode':47,
            'tag':'bridge-lab-v43',
            'size':apk.stat().st_size,
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/bridge-lab-v43/'+apk.name
          }
          assert m==expected,'BLOCKED: invalid metadata or unexpected apk name'
          assert apk.name=='DriveLab-Bridge-LAB-v'+m['versionName']+'.apk','BLOCKED: legacy updater APK naming regression'
          assert re.fullmatch(r'0\.(?:1|2)\.[0-9]+-lab\.[0-9]+',m['versionName'])
          PY
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$sdk" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apk="dist/nav43/$APK"
          "$aapt" dump badging "$apk" | grep -F "package: name='ar.com.rango5gps.drivelabauto.boot.lab' versionCode='47' versionName='0.1.45-lab.43'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'DriveLab NAV'"
          "$signer" verify --print-certs "$apk" >/dev/null
          gh release download bridge-lab-v27 --pattern DriveLab-Bridge-LAB-v0.1.29-lab.27.apk --dir original
          printf '%s  %s\n' '7e051f6efa3089bbd06e632ca91229352b0d70fd8b3048d9ec99876a163fe3bc' 'original/DriveLab-Bridge-LAB-v0.1.29-lab.27.apk' | sha256sum -c -
          cert(){ "$signer" verify --print-certs "$1" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF;exit}'; }
          test -n "$(cert "$apk")"
          test "$(cert "$apk")" = "$(cert original/DriveLab-Bridge-LAB-v0.1.29-lab.27.apk)" || {
            echo 'BLOCKED: Android package certificate differs from installed NAV LAB27';exit 25;
          }
          gh api "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json?ref=bridge-lab-ota" > old-pointer-response.json
          jq -r .content old-pointer-response.json | base64 -d > old-pointer.json
          python3 - <<'PY'
          import json
          before=json.load(open('old-pointer.json'))
          assert before=={
            'channel':'bridge-lab',
            'packageName':'ar.com.rango5gps.drivelabauto.boot.lab',
            'versionName':'0.1.44-lab.42',
            'versionCode':46,
            'tag':'bridge-lab-v42',
            'size':5076833,
            'sha256':'ba675fc5458a3fd7524456bd22e58e747f5c65b071e5b6baf05d68eb8415645f',
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/bridge-lab-v42/DriveLab-Bridge-LAB-v0.1.44-lab.42.apk'
          }, 'BLOCKED: LAB42 OTA pointer changed'
          PY
          gh release download v0.3.97 --pattern sender.json --dir original
          gh release download v0.3.97 --pattern receiver.json --dir original
          echo 'PASS original Android signer + LAB42 pointer + legacy BootUpdater LAB43 APK filename, Sender untouched' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish ONLY signed Jetour NAV LAB43 prerelease, verify downloaded file
        shell: bash
        run: |
          set -euo pipefail
          # Split the tag and release steps to isolate GitHub's 403 during
          # implicit tag creation. Match ONLY the pinned signed SHA.
          # Tag only a provenance commit with zero workflow changes.
          # GitHub explicitly rejected tagging the signed-candidate commit
          # because it added a workflow file; the APK provenance remains
          # cryptographically verified above using SOURCE_RUN + SOURCE_SHA.
          git cat-file -e "$TAG_SOURCE_SHA^{commit}"
          test "$(git show --format= --name-only "$TAG_SOURCE_SHA" | grep -c '^nav-ota-provenance/lab43.json$')" = 1 || {
            echo 'BLOCKED: provenance tag must target non-workflow LAB43 metadata commit'; exit 32;
          }
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
              push "https://github.com/$GITHUB_REPOSITORY.git" \
              "$TAG_SOURCE_SHA:refs/tags/$TAG"
            unset auth_header
          fi
          actual_tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          test "$actual_tag_sha" = "$TAG_SOURCE_SHA" || {
            echo 'BLOCKED: tag does not point to immutable LAB43 provenance';exit 31;
          }
          gh release create "$TAG" "dist/nav43/$APK" dist/nav43/bridge-lab.json \
            --target "$TAG_SOURCE_SHA" --prerelease \
            --title 'DriveLab NAV LAB 43 · Waze exportado y tarea exclusiva al display NAV' \
            --notes 'LAB43: Waze se inicia por la actividad LAUNCHER exportada; una tarea nueva y exclusiva de com.waze.MainActivity en display 0 puede trasladarse mediante am display move-stack al display virtual propio NAV solo si dos inventarios confirman identidad. No se accede directamente a MainActivity privada. Control de regresión de Maps y Spotify y cierre de tareas NAV sin detener globalmente otras apps. Sin T1Launcher, Sender ni Receiver modificados. Compilación y firma original verificadas; visualización física del mapa en cluster aun no confirmada. LAB42 queda como respaldo.'
          mkdir -p verify
          gh release download "$TAG" --pattern "$APK" --dir verify
          cmp "dist/nav43/$APK" "verify/$APK"
          gh release download "$TAG" --pattern bridge-lab.json --dir verify
          cmp dist/nav43/bridge-lab.json verify/bridge-lab.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97
      - name: Switch ONLY NAV LAB OTA pointer and verify Sender, Receiver unchanged
        shell: bash
        run: |
          set -euo pipefail
          old_sha=$(jq -r .sha old-pointer-response.json)
          test -n "$old_sha"
          content=$(base64 -w0 dist/nav43/bridge-lab.json)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json" \
            -f branch=bridge-lab-ota -f sha="$old_sha" \
            -f message='ota(nav): original-signed NAV LAB43 code47 direct Waze exported launcher and guarded own-stack relocation trial' \
            -f content="$content" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json?ref=bridge-lab-ota" --jq .content | base64 -d > current-bridge.json
          cmp current-bridge.json dist/nav43/bridge-lab.json
          mkdir -p current
          gh release download v0.3.97 --pattern sender.json --dir current
          gh release download v0.3.97 --pattern receiver.json --dir current
          cmp original/sender.json current/sender.json
          cmp original/receiver.json current/receiver.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97
          echo 'PUBLISHED NAV LAB43 only: original signer/Android identity, correct OTA filename, separate Sender/Receiver unchanged. User must approve install.' >> "$GITHUB_STEP_SUMMARY"
