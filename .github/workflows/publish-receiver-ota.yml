name: DriveLab Auto Receiver OTA signed update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-receiver-ota.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  receiver-ota:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    env:
      RECEIVER_STORE_PASSWORD: ${{ secrets.RECEIVER_STORE_PASSWORD }}
      RECEIVER_KEY_ALIAS: ${{ secrets.RECEIVER_KEY_ALIAS }}
      RECEIVER_KEY_PASSWORD: ${{ secrets.RECEIVER_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore existing RECEIVER signing certificate
        shell: bash
        env:
          RECEIVER_KEYSTORE_B64: ${{ secrets.RECEIVER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$RECEIVER_KEYSTORE_B64"
          test -n "$RECEIVER_STORE_PASSWORD"
          test -n "$RECEIVER_KEY_ALIAS"
          test -n "$RECEIVER_KEY_PASSWORD"
          printf %s "$RECEIVER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/receiver.p12"
          chmod 600 "$RUNNER_TEMP/receiver.p12"
          echo "RECEIVER_KEYSTORE=$RUNNER_TEMP/receiver.p12" >> "$GITHUB_ENV"
      - name: Build receiver update and verify installed signing continuity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'bruceferra/drivelab-auto-standalone'
          test "$GITHUB_REF_NAME" = 'main'
          if gh release view 'v0.2.11' >/dev/null 2>&1; then
            echo 'Release v0.2.11 already exists: no APK overwrite'
            exit 1
          fi
          mkdir -p /tmp/previous output
          gh release download v0.2.10 --pattern 'DriveLab-Auto-Receiver-v0.2.10.apk' --dir /tmp/previous
          gh release download v0.2.10 --pattern 'sender.json' --dir output
          gradle --no-daemon :receiver:assembleRelease
          apk='receiver/build/outputs/apk/release/receiver-release.apk'
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          sig="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$sig" verify --print-certs "$apk"
          "$sig" verify --print-certs /tmp/previous/DriveLab-Auto-Receiver-v0.2.10.apk
          oldcert=$("$sig" verify --print-certs /tmp/previous/DriveLab-Auto-Receiver-v0.2.10.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          newcert=$("$sig" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$oldcert" && test "$oldcert" = "$newcert"
          badge=$("$aapt" dump badging "$apk" | head -1)
          echo "$badge"
          echo "$badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.receiver'"
          echo "$badge" | grep -F "versionCode='12'"
          echo "$badge" | grep -F "versionName='0.2.11'"
          name='DriveLab-Auto-Receiver-v0.2.11.apk'
          cp "$apk" "output/$name"
          sha=$(sha256sum "output/$name" | awk '{print $1}')
          export RECEIVER_SHA="$sha"
          python3 - <<'PY'
          import json, os
          repo=os.environ['GITHUB_REPOSITORY']
          manifest={
            'packageName':'ar.com.rango5gps.drivelabauto.receiver',
            'versionName':'0.2.11',
            'versionCode':12,
            'sha256':os.environ['RECEIVER_SHA'],
            'apkUrl':f'https://github.com/{repo}/releases/download/v0.2.11/DriveLab-Auto-Receiver-v0.2.11.apk',
          }
          with open('output/receiver.json','w',encoding='utf-8') as f:
            json.dump(manifest,f,indent=2)
          with open('output/sender.json',encoding='utf-8') as f:
            sender=json.load(f)
          assert sender['packageName']=='ar.com.rango5gps.drivelabauto.sender'
          assert sender['versionName']=='0.2.10' and sender['versionCode']==11
          assert sender['apkUrl']==f'https://github.com/{repo}/releases/download/v0.2.10/DriveLab-Auto-Sender-v0.2.10.apk'
          PY
          cat output/receiver.json
          sha256sum output/*.apk > output/receiver.sha256
      - name: Publish update channel used by installed Receiver
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.2.11 \
            output/DriveLab-Auto-Receiver-v0.2.11.apk \
            output/receiver.json output/sender.json output/receiver.sha256 \
            --target "$GITHUB_SHA" --latest \
            --title 'DriveLab Auto Receiver 0.2.11 - espejo manual experimental OTA' \
            --notes 'Receiver SOLO: actualización desde botón interno, mismo paquete y certificado que 0.2.10. Prueba manual de espejos ID 2069 exclusivamente en P y detenido; no se activa automáticamente. Sin cambios de Sender 0.2.10, mapas, bridge ni datos. Función física SIN VALIDAR. Android solicita confirmación de instalación.'
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$tag" = 'v0.2.11'
          gh release view v0.2.11 --json assets --jq '.assets[].name'
          echo 'OTA v0.2.11 published as latest with receiver.json and preserved sender.json'
