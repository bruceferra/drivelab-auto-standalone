name: Recover DriveLab NAV LAB42 OTA from default-branch publisher
on:
  push:
    branches: [main]
    paths: ['nav-ota-recovery/APPROVE_LAB42_FROM_MAIN.json', 'nav-ota-recovery/RETRY_TAG_VIA_GIT.json', 'nav-ota-recovery/RETRY_FULL_FETCH.json']

permissions:
  contents: write
  actions: read

concurrency:
  group: drivelab-nav42-recover-main-publisher
  cancel-in-progress: false

jobs:
  publish-nav:
    if: github.repository == 'bruceferra/drivelab-auto-standalone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '45050428917'
      SOURCE_SHA: 'b1204f6b0b91753982b514c2e213ac4e90a3bd56'
      TAG: 'bridge-lab-v42'
      APK: 'DriveLab-Bridge-LAB-v0.1.44-lab.42.apk'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/nav-lab-v42-direct-waze-main-ota-20261122
          fetch-depth: 64
          persist-credentials: false
      - name: Require owner approval, signed build success and exact source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data=json.load(open('nav-release-v42/APPROVE_OTA_LAB42.json',encoding='utf-8'))
          assert data=={
            'approval':'PUBLICAR_NAV_LAB42_SOLO_JETOUR_POR_OTA',
            'sourceRunId':45050428917,
            'sourceCommit':'b1204f6b0b91753982b514c2e213ac4e90a3bd56',
            'tag':'bridge-lab-v42',
            'versionName':'0.1.44-lab.42',
            'versionCode':46,
            'senderUnchanged':True,
            'publishLabChannel':True
          }, 'BLOCKED: expected exact owner-specified NAV LAB42 only'
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success || {
            echo 'BLOCKED: signed candidate CI not successful';exit 21;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA" || {
            echo 'BLOCKED: signed candidate head SHA mismatch';exit 22;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97 || {
            echo 'BLOCKED: stable release pointer changed';exit 23;
          }
          ! gh release view "$TAG" >/dev/null 2>&1 || {
            echo 'BLOCKED: LAB42 release already exists';exit 24;
          }
      - name: Retrieve signed candidate, verify exact legacy OTA filename/hash/size and original certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nav42 original
          gh run download "$SOURCE_RUN" --name DriveLab-NAV-LAB42-SIGNED-CANDIDATE-NO-OTA --dir dist/nav42
          (cd dist/nav42; sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          d=pathlib.Path('dist/nav42')
          apk=d/'DriveLab-Bridge-LAB-v0.1.44-lab.42.apk'
          m=json.loads((d/'bridge-lab.json').read_text(encoding='utf8'))
          assert apk.is_file() and apk.stat().st_size>1024
          expected={
            'channel':'bridge-lab',
            'packageName':'ar.com.rango5gps.drivelabauto.boot.lab',
            'versionName':'0.1.44-lab.42',
            'versionCode':46,
            'tag':'bridge-lab-v42',
            'size':apk.stat().st_size,
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/bridge-lab-v42/'+apk.name
          }
          assert m==expected,'BLOCKED: invalid metadata or unexpected apk name'
          assert apk.name=='DriveLab-Bridge-LAB-v'+m['versionName']+'.apk','BLOCKED: legacy updater APK naming regression'
          assert re.fullmatch(r'0\.(?:1|2)\.[0-9]+-lab\.[0-9]+',m['versionName'])
          PY
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$sdk" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apk="dist/nav42/$APK"
          "$aapt" dump badging "$apk" | grep -F "package: name='ar.com.rango5gps.drivelabauto.boot.lab' versionCode='46' versionName='0.1.44-lab.42'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'DriveLab NAV'"
          "$signer" verify --print-certs "$apk" >/dev/null
          gh release download bridge-lab-v27 --pattern DriveLab-Bridge-LAB-v0.1.29-lab.27.apk --dir original
          printf '%s  %s\n' '7e051f6efa3089bbd06e632ca91229352b0d70fd8b3048d9ec99876a163fe3bc' 'original/DriveLab-Bridge-LAB-v0.1.29-lab.27.apk' | sha256sum -c -
          cert(){ "$signer" verify --print-certs "$1" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF;exit}'; }
          test -n "$(cert "$apk")"
          test "$(cert "$apk")" = "$(cert original/DriveLab-Bridge-LAB-v0.1.29-lab.27.apk)" || {
            echo 'BLOCKED: Android package certificate differs from installed NAV LAB27';exit 25;
          }
          gh api "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json?ref=bridge-lab-ota" > old-pointer-response.json
          jq -r .content old-pointer-response.json | base64 -d > old-pointer.json
          python3 - <<'PY'
          import json
          before=json.load(open('old-pointer.json'))
          assert before=={
            'channel':'bridge-lab',
            'packageName':'ar.com.rango5gps.drivelabauto.boot.lab',
            'versionName':'0.1.43-lab.41',
            'versionCode':45,
            'tag':'bridge-lab-v41',
            'size':5076717,
            'sha256':'25f35dbacb35b2eda6d90b54109dcdf39c66237b36690e696f952c4961bc816f',
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/bridge-lab-v41/DriveLab-Bridge-LAB-v0.1.43-lab.41.apk'
          }, 'BLOCKED: previous OTA pointer changed'
          PY
          gh release download v0.3.97 --pattern sender.json --dir original
          gh release download v0.3.97 --pattern receiver.json --dir original
          echo 'PASS original Android signer + LAB41 pointer + legacy BootUpdater LAB42 APK filename, Sender untouched' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish ONLY signed Jetour NAV LAB42 prerelease, verify downloaded file
        shell: bash
        run: |
          set -euo pipefail
          # Split the tag and release steps to isolate GitHub's 403 during
          # implicit tag creation. Match ONLY the pinned signed SHA.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            # Git smart-HTTP uses Contents:write directly. The REST
            # git/refs endpoint returned 403 under this integration.
            # Do not echo or persist credentials.
            auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
              push "https://github.com/$GITHUB_REPOSITORY.git" \
              "$SOURCE_SHA:refs/tags/$TAG"
            unset auth_header
          fi
          actual_tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          test "$actual_tag_sha" = "$SOURCE_SHA" || {
            echo 'BLOCKED: tag does not point to the original-signed candidate';exit 31;
          }
          gh release create "$TAG" "dist/nav42/$APK" dist/nav42/bridge-lab.json \
            --target "$SOURCE_SHA" --prerelease \
            --title 'DriveLab NAV LAB 42 · MainActivity Waze directamente en display propio, sin splash' \
            --notes 'LAB42: prueba controlada de iniciar DIRECTAMENTE com.waze.MainActivity en el VirtualDisplay propio de NAV para evitar el salto comprobado en LAB41: FreeMapAppActivity aparece en display5 del clúster, pero MainActivity se abre luego como otra tarea en display físico 0. Nueva prueba: comprobar con PackageManager que Waze MainActivity está instalada y exportada; si es privada Android impide el lanzamiento, NAV informa el rechazo sin abrir otra tarea. Allowlist ADB restringida al comando literal am start --display PROPIO -n com.waze/com.waze.MainActivity. Conserva traza ANTES/INMEDIATO/400ms/1200ms/3000ms/6500ms/CIERRE, visibilidad del mosaico Maps+Spotify con tacto, cierre limitado a tareas propias y protección del ciclo de vida LAB41. Sin T1Launcher/T1Mapa, Sender/Receiver intactos, sin mover ni detener Waze globalmente. Funcionamiento físico todavía NO validado; LAB41 conservada como versión anterior.'
          mkdir -p verify
          gh release download "$TAG" --pattern "$APK" --dir verify
          cmp "dist/nav42/$APK" "verify/$APK"
          gh release download "$TAG" --pattern bridge-lab.json --dir verify
          cmp dist/nav42/bridge-lab.json verify/bridge-lab.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97
      - name: Switch ONLY NAV LAB OTA pointer and verify Sender, Receiver unchanged
        shell: bash
        run: |
          set -euo pipefail
          old_sha=$(jq -r .sha old-pointer-response.json)
          test -n "$old_sha"
          content=$(base64 -w0 dist/nav42/bridge-lab.json)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json" \
            -f branch=bridge-lab-ota -f sha="$old_sha" \
            -f message='ota(nav): original-signed NAV LAB42 code46 direct Waze MainActivity own-display trial' \
            -f content="$content" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json?ref=bridge-lab-ota" --jq .content | base64 -d > current-bridge.json
          cmp current-bridge.json dist/nav42/bridge-lab.json
          mkdir -p current
          gh release download v0.3.97 --pattern sender.json --dir current
          gh release download v0.3.97 --pattern receiver.json --dir current
          cmp original/sender.json current/sender.json
          cmp original/receiver.json current/receiver.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97
          echo 'PUBLISHED NAV LAB42 only: original signer/Android identity, correct OTA filename, separate Sender/Receiver unchanged. User must approve install.' >> "$GITHUB_STEP_SUMMARY"
