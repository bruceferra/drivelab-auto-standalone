name: Repair Receiver 0.3.24 OTA manifest code125
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-receiver-0324-ota.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  repair-manifest:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install APK inspection tool
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'build-tools;35.0.0'
      - name: Verify released APK and reconstruct correct OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'bruceferra/drivelab-auto-standalone'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = 'v0.3.24'
          mkdir -p source output
          gh release download v0.3.24 --pattern 'DriveLab-Auto-Receiver-v0.3.24.apk' --dir source
          gh release download v0.3.24 --pattern 'receiver.sha256' --dir source
          gh release download v0.3.24 --pattern 'sender.json' --dir source
          apk=source/DriveLab-Auto-Receiver-v0.3.24.apk
          test -s "$apk"
          expected=$(awk '{print $1}' source/receiver.sha256)
          actual=$(sha256sum "$apk" | awk '{print $1}')
          test -n "$expected" && test "$expected" = "$actual"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          badge=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -1)
          echo "$badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.receiver'"
          echo "$badge" | grep -F "versionCode='125'"
          echo "$badge" | grep -F "versionName='0.3.24'"
          export RECEIVER_SHA="$actual"
          python3 - <<'PY'
          import json,os
          manifest={
            'packageName':'ar.com.rango5gps.drivelabauto.receiver',
            'versionName':'0.3.24',
            'versionCode':125,
            'sha256':os.environ['RECEIVER_SHA'],
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.3.24/DriveLab-Auto-Receiver-v0.3.24.apk',
          }
          assert len(manifest['sha256'])==64
          with open('output/receiver.json','w') as f:json.dump(manifest,f,indent=2)
          with open('source/sender.json') as f: sender=json.load(f)
          assert sender['versionCode']==22 and sender['versionName']=='0.2.21'
          PY
      - name: Replace only receiver.json in existing GitHub release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = 'v0.3.24'
          gh release upload v0.3.24 output/receiver.json --clobber
          mkdir -p verify
          gh release download v0.3.24 --pattern 'receiver.json' --dir verify
          cmp output/receiver.json verify/receiver.json
          python3 - <<'PY'
          import json
          j=json.load(open('verify/receiver.json'))
          assert j['versionCode']==125 and j['versionName']=='0.3.24'
          print('Receiver v0.3.24 OTA manifest repaired: code125 matches signed APK')
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = 'v0.3.24'
