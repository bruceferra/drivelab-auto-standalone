name: Signed Receiver 0.2.75 - direct private SOC OEM diagnostic uploads
# UI-only palette aligned with original Jetour T1 ADB screenshots.
# Green, red, amber, cyan and all dropdown controls retain readable text.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-receiver-0275.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  receiver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      RECEIVER_STORE_PASSWORD: ${{ secrets.RECEIVER_STORE_PASSWORD }}
      RECEIVER_KEY_ALIAS: ${{ secrets.RECEIVER_KEY_ALIAS }}
      RECEIVER_KEY_PASSWORD: ${{ secrets.RECEIVER_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore original Receiver signing certificate
        shell: bash
        env:
          RECEIVER_KEYSTORE_B64: ${{ secrets.RECEIVER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$RECEIVER_KEYSTORE_B64"
          test -n "$RECEIVER_STORE_PASSWORD" && test -n "$RECEIVER_KEY_ALIAS" && test -n "$RECEIVER_KEY_PASSWORD"
          printf %s "$RECEIVER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/receiver.p12"
          chmod 600 "$RUNNER_TEMP/receiver.p12"
          echo "RECEIVER_KEYSTORE=$RUNNER_TEMP/receiver.p12" >> "$GITHUB_ENV"
      - name: Pure JVM daily-session rollup regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rollup-classes
          javac -d /tmp/rollup-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1DailyTripSummary.java \
            receiver/tests/T1DailyTripSummaryTest.java
          java -cp /tmp/rollup-classes ar.com.rango5gps.drivelabauto.receiver.T1DailyTripSummaryTest
      - name: Verify manual drive-mode gate with pure JVM test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/modegate-classes
          javac -d /tmp/modegate-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1DriveModeGate.java \
            receiver/tests/T1DriveModeGateTest.java
          java -cp /tmp/modegate-classes ar.com.rango5gps.drivelabauto.receiver.T1DriveModeGateTest
      - name: Test four-road optimized profiles (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/optimized-classes
          javac -d /tmp/optimized-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/tests/T1OptimizedModePolicyTest.java
          java -cp /tmp/optimized-classes ar.com.rango5gps.drivelabauto.receiver.T1OptimizedModePolicyTest
      - name: Test road-entry banners and debounce (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/road-popup-classes
          javac -d /tmp/road-popup-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1RoadTransitionGate.java \
            receiver/tests/T1RoadTransitionGateTest.java
          java -cp /tmp/road-popup-classes ar.com.rango5gps.drivelabauto.receiver.T1RoadTransitionGateTest
      - name: Verify historical energy-balance simulator and CSV compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/whatif-classes
          javac -d /tmp/whatif-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1WhatIfEnergyModel.java \
            receiver/tests/T1WhatIfEnergyModelTest.java
          java -cp /tmp/whatif-classes ar.com.rango5gps.drivelabauto.receiver.T1WhatIfEnergyModelTest
      - name: Verify OEM-first trip distance and no-GPS-doublecount regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/distance-classes
          javac -d /tmp/distance-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripDistancePolicy.java \
            receiver/tests/T1TripDistancePolicyTest.java
          java -cp /tmp/distance-classes ar.com.rango5gps.drivelabauto.receiver.T1TripDistancePolicyTest
      - name: Verify OEM 1004 recirculation polarity (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recirc-classes
          javac -d /tmp/recirc-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/RecirculationPolicy.java \
            receiver/tests/RecirculationPolicyTest.java
          java -cp /tmp/recirc-classes RecirculationPolicyTest
          grep -q 'RecirculationGuardService.activateOnAppOpen(this)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveActivity.java
          grep -q 'MirrorAutomationService.activateOnAppOpen(this)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveActivity.java
          grep -q 'ACTION_RESTORE' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/BootReceiver.java

      - name: Verify OSM city avenue maxspeed rules (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/osm-classes
          javac -d /tmp/osm-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1RoadSpeedClassifier.java \
            receiver/tests/T1RoadSpeedClassifierTest.java
          java -cp /tmp/osm-classes ar.com.rango5gps.drivelabauto.receiver.T1RoadSpeedClassifierTest

      - name: Verify automatic road-to-OEM 1043 gate (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/optimized-auto-classes
          javac -d /tmp/optimized-auto-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1DriveModeGate.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAutoGate.java \
            receiver/tests/T1OptimizedAutoGateTest.java
          java -cp /tmp/optimized-auto-classes ar.com.rango5gps.drivelabauto.receiver.T1OptimizedAutoGateTest
          grep -q 'T1OptimizedAutoService.activate(this)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'T1OptimizedAutoService.activate(this)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeActivity.java
          grep -q 'T1OptimizedAutoService' receiver/src/main/AndroidManifest.xml

      - name: Verify audited closed-trip and full-Jornada OEM reconstruction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/master-history-classes
          javac -d /tmp/master-history-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripDistancePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1MasterTripHistory.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1HistoricalDistanceRepair.java \
            receiver/tests/T1HistoricalMasterRebuildTest.java
          java -cp /tmp/master-history-classes ar.com.rango5gps.drivelabauto.receiver.T1HistoricalMasterRebuildTest
          grep -q 'VIAJES · 1 Y 2' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'JORNADAS · TOTAL' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'requestLocationUpdates(provider,2500,0f' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAutoService.java

      - name: Verify HAL body diagnostic stays strictly read-only
        shell: bash
        run: |
          set -euo pipefail
          probe=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/WiperParkingProbe.java
          wizard=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ValidationWizardActivity.java
          grep -Fq 'WIPER_MODE_READ=557843863' "$probe"
          grep -Fq 'REAR_WIPER_READ=557843559' "$probe"
          grep -Fq 'LIGHT_STATUS_IDS' "$probe"
          grep -Fq 'lights_exterior_hal' "$wizard"
          test "$(grep -c 'b.transact(' "$probe")" -eq 2
          grep -Fq 'b.transact(2' "$probe"
          grep -Fq 'b.transact(5' "$probe"
          ! grep -Eq 'b.transact\((3|4|6|7|8|9|1[0-9]|2[0-9])' "$probe"
          ! grep -Eq 'data.writeInt\((557843862|557843558|557843861)' "$probe"
      - name: Eco trip speed bins, OSM coverage and live 500m autonomy (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-eco-rating
          javac -encoding UTF-8 -d /tmp/t1-eco-rating \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1EcoTripMetrics.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TrafficFlowPolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1LiveConsumption.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripMath.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ExperimentalRange.java \
            receiver/tests/T1EcoTripMetricsTest.java \
            receiver/tests/T1TrafficFlowPolicyTest.java \
            receiver/tests/T1LiveConsumptionTest.java
          java -cp /tmp/t1-eco-rating ar.com.rango5gps.drivelabauto.receiver.T1EcoTripMetricsTest
          java -cp /tmp/t1-eco-rating ar.com.rango5gps.drivelabauto.receiver.T1TrafficFlowPolicyTest
          java -cp /tmp/t1-eco-rating ar.com.rango5gps.drivelabauto.receiver.T1LiveConsumptionTest
          grep -Fq 'eco.sample(s.timestamp,measure.km,dt' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripRecorderService.java
          grep -Fq 'historyEcoStatus.setText' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'T1EcoTripMonitor.live(this,ecoScope)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
      - name: SOC regen guarded write policy regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/soc-regen-guard
          javac -encoding UTF-8 -d /tmp/soc-regen-guard \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenWritePolicy.java \
            receiver/tests/T1SocRegenWritePolicyTest.java
          java -cp /tmp/soc-regen-guard ar.com.rango5gps.drivelabauto.receiver.T1SocRegenWritePolicyTest
          src=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenPilot.java
          grep -Fq 'regenDriveEligible(gear,speed)' "$src"
          grep -Fq 'verify(b,id,target,active)' "$src"
          grep -Fq 'BUSY.compareAndSet(false,true)' "$src"
          grep -Fq 'set(b,id,previous,null)' "$src"
          ! grep -Fq 'boolean test(' "$src"
      - name: Verify 500m live OEM callbacks work without recording trip
        shell: bash
        run: |
          set -euo pipefail
          callback=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OemConsumptionCallbacks.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'boolean startForCockpit()' "$callback"
          grep -Fq 'logFile=cockpitMode?null:file' "$callback"
          grep -Fq '.putString("source",tripMode?"TRIP":"COCKPIT")' "$callback"
          grep -Fq 'if(tripFeeding)' "$cockpit"
          grep -Fq 'if(passive.startForCockpit())dashboardConsumption=passive;' "$cockpit"
          grep -Fq 'dashboardConsumption.stop();' "$cockpit"
      - name: Verify Cockpit navigation remains independent of history scroll
        shell: bash
        run: |
          set -euo pipefail
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'cockpitNavRow=null;' "$cockpit"
          grep -Fq 'setContentView(scroll);' "$cockpit"
          grep -Fq 'shell.addView(globalToolbar.view()' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveActivity.java
          grep -Fq 'historyEcoStatus.setTextIsSelectable(false);' "$cockpit"
          grep -Fq 'historyUiBusy.compareAndSet(false,true)' "$cockpit"
          grep -Fq 'snapshot=loadHistorySnapshot();' "$cockpit"
          grep -Fq 'if(!snapshot.signature.equals(renderedHistorySignature))' "$cockpit"
          grep -Fq 'button.setFocusable(false);' "$cockpit"
      - name: Verify full-system telemetry and navigational touch recovery
        shell: bash
        run: |
          set -euo pipefail
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          monitor=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SystemLoadMonitor.java
          grep -Fq 'manager.getMemoryInfo(mem)' "$monitor"
          grep -Fq 'mem.totalMem,mem.availMem' "$monitor"
          grep -Fq 'new FileReader("/proc/stat")' "$monitor"
          grep -Fq 'dispatchTouchEvent(MotionEvent event)' "$cockpit"
          grep -Fq 'navTouchDowns++' "$cockpit"
          grep -Fq 'modeTouchDowns++' "$cockpit"
          grep -Fq 'cockpitModeRow=null;' "$cockpit"
          grep -Fq 'commentaryRight.addView(systemMonitorLine,' "$cockpit"
          grep -Fq 'T1WazeWheelService' receiver/src/main/AndroidManifest.xml
          grep -Fq 'roadTransitionPopup=null;' "$cockpit"
          grep -Fq 'SISTEMA RAM/CPU' "$cockpit"
          ! grep -Fq 'cockpitFrame.addView(roadTransitionPopup' "$cockpit"
      - name: Check SOC target settings and preserve write pipeline
        shell: bash
        run: |
          set -euo pipefail
          soc=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenWritePolicy.java
          pilot=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenPilot.java
          auto=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAutoService.java
          grep -Fq 'SOC_PRESETS={20,30,40,50,60,70}' "$soc"
          grep -Fq 'socRegenPilot.apply(targets,' "$auto"
          grep -Fq 'private static double readSocTargetFloat' "$pilot"
          grep -Fq 'if(id==1041){' "$pilot"
          grep -Fq '1041 SIN ROLLBACK' "$pilot"
          ! grep -Fq 'current==56?64:56' "$soc"
      - name: Check global read-only road mode, mirrors and pedestrian AVAS status
        shell: bash
        run: |
          set -euo pipefail
          global=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1GlobalToolbar.java
          map=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAutoService.java
          mirrors=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/MirrorPulsePilot.java
          pedestrian=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/PedestrianAlertControl.java
          grep -Fq 'roadModeButton.setOnClickListener(null);' "$global"
          grep -Fq 'T1OptimizedAutoService.verifiedAppliedRoad(owner)' "$global"
          grep -Fq 'roadModeButton.setText("MODO "+road);' "$global"
          grep -Fq 'T1OptimizedModeStore.markReading(this,' "$map"
          grep -Fq '!T1OptimizedModeStore.isEnabled(this,road)' "$map"
          grep -Fq 'socProfileGate.reset();' "$map"
          grep -Fq 'PERFIL DESACTIVADO' "$map"
          grep -Fq 'setEnabled(Context c,T1OptimizedModePolicy.Road r,boolean enabled)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeStore.java
          grep -Fq 'p.blockEnabled.setOnCheckedChangeListener' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeActivity.java
          grep -Fq 'mirrorState==0?"DESPLEGAR ESPEJOS"' "$global"
          grep -Fq 'mirrorState==1?"PLEGAR ESPEJOS"' "$global"
          grep -Fq 'button(actions,"VENTILACIÓN TOTAL",T1JetourTheme.PANEL_HI' "$global"
          grep -Fq 'button(actions,"CIERRE TOTAL",T1JetourTheme.PANEL_HI' "$global"
          grep -Fq 'private void readAvasState()' "$global"
          grep -Fq 'avsButton.setText(pedestrianState==1?"PEATÓN ON"' "$global"
          grep -Fq 'pedestrianState==0?"PEATÓN OFF"' "$global"
          grep -Fq 'T1JetourTheme.RED_BUTTON:T1JetourTheme.PANEL_HI' "$global"
          grep -Fq 'public boolean readState(Callback callback)' "$pedestrian"
          grep -Fq 'int value=readInt(c.binder,2003);' "$mirrors"
      - name: Regression stable road gate, SOC transition and 3-stage diagnosis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/soc-profile-0273
          javac -encoding UTF-8 -d /tmp/soc-profile-0273 \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenWritePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenTransitionGate.java \
            receiver/tests/T1SocRegenTransitionGateTest.java
          java -cp /tmp/soc-profile-0273 ar.com.rango5gps.drivelabauto.receiver.T1SocRegenTransitionGateTest
          pilot=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenPilot.java
          auto=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAutoService.java
          editor=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeActivity.java
          gate=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAutoGate.java
          grep -Fq '1041_SIN_SOC_PREVIO' "$pilot"
          grep -Fq 'ETAPA_1_PRECHECK' "$pilot"
          grep -Fq 'ETAPA_2_WRITE_REQ' "$pilot"
          grep -Fq 'ETAPA_3_READBACK' "$pilot"
          grep -Fq 'ETAPA_3_INCIERTA' "$pilot"
          grep -Fq 'socProfileGate.recordConfirmed(targets);' "$auto"
          grep -Fq 'VER / SUBIR DIAGNÓSTICO SOC' "$editor"
          ! grep -Fq 'auxVotes=' "$auto"
          ! grep -Fq 'votes=0;' <(sed -n '/void recordCommand(/,$p' "$gate")
      - name: Reject premature road label (13pct SOC < 15pct CITY) - JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/road-chip-0274
          javac -encoding UTF-8 -d /tmp/road-chip-0274 \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAppliedRoadPolicy.java \
            receiver/tests/T1OptimizedAppliedRoadPolicyTest.java
          java -cp /tmp/road-chip-0274 ar.com.rango5gps.drivelabauto.receiver.T1OptimizedAppliedRoadPolicyTest
          toolbar=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1GlobalToolbar.java
          service=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAutoService.java
          grep -Fq 'T1OptimizedAutoService.verifiedAppliedRoad(owner)' "$toolbar"
          grep -Fq 'T1JetourTheme.GREEN_BUTTON' "$toolbar"
          ! grep -Fq 'T1OptimizedModeStore.lastRoad(owner)' "$toolbar"
          grep -Fq 'conditions.conditionSatisfied' "$service"
          grep -Fq 'verifiedRoad(road,rule);' "$service"
          grep -Fq 'VERIFIED_TTL_MS=25000L' "$service"
          grep -Fq 'clearVerified(off,"OPTIMIZADO OFF")' "$service"
      - name: Verify fuel usable liters CI186 minus 5.3 in both dashboards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuel-usable-0274
          javac -encoding UTF-8 -d /tmp/fuel-usable-0274 \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1FuelDisplay.java \
            receiver/tests/T1FuelDisplayTest.java
          java -cp /tmp/fuel-usable-0274 T1FuelDisplayTest
          tank=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TankDashboardActivity.java
          simple=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1InstrumentView.java
          premium=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumInstrumentView.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'T1FuelDisplay.usableLitersText(lastFuel)' "$tank"
          grep -Fq 'T1FuelDisplay.usableLiters(' "$simple"
          grep -Fq 'T1FuelDisplay.usableLiters(' "$premium"
          grep -Fq 'T1FuelDisplay.usableLitersText(lastSample.fuel)' "$cockpit"
      - name: Check direct SOC report cloud transport and CSV contract, no share chooser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/soc-cloud-0275
          javac -encoding UTF-8 -d /tmp/soc-cloud-0275 \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OemReportCsv.java \
            receiver/tests/T1OemReportCsvTest.java
          java -cp /tmp/soc-cloud-0275 ar.com.rango5gps.drivelabauto.receiver.T1OemReportCsvTest
          editor=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeActivity.java
