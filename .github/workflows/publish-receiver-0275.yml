          mkdir -p verify
          gh release download v0.2.75 --pattern 'sender.json' --dir verify
          gh release download v0.2.75 --pattern 'receiver.json' --dir verify
          cmp output/sender.json verify/sender.json
          cmp output/receiver.json verify/receiver.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.2.75
          gh release view v0.2.75 --json assets --jq '.assets[].name'
