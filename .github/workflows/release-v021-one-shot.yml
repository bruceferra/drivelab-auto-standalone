name: Lanzar publicación firmada v0.2.1 una sola vez
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v021-one-shot.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch-release:
    if: github.repository == 'bruceferra/drivelab-auto-standalone'
    runs-on: ubuntu-24.04
    steps:
      - name: Solicitar compilación y publicación firmada 0.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-release.yml --ref main --repo "$GITHUB_REPOSITORY" -f tag=v0.2.1
          echo 'Publicación v0.2.1 solicitada sin generar nuevas claves.'
