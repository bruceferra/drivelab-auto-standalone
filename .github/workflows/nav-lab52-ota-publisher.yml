name: Publish DriveLab NAV LAB52 OTA from approved original-signed CI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nav-lab52-ota-publisher.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: drivelab-nav52-recover-main-publisher
  cancel-in-progress: false

jobs:
  publish-nav:
    if: github.repository == 'bruceferra/drivelab-auto-standalone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '45081792234'
      SOURCE_SHA: '373471371a78d233ac11e0b121ba47b957c68e35'
      TAG_SOURCE_SHA: '6c4bc2c6d729f5569013f8d81364e302224d093b'
      TAG: 'bridge-lab-v52'
      APK: 'DriveLab-Bridge-LAB-v0.1.54-lab.52.apk'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 64
          persist-credentials: false
      - name: Require owner approval, signed build success and exact source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data=json.load(open('nav-ota-provenance/lab52.json',encoding='utf-8'))
          assert data['kind']=='drivelab-nav-ota-provenance'
          assert data['sourceRunId']==45081792234
          assert data['sourceCommit']=='373471371a78d233ac11e0b121ba47b957c68e35'
          assert data['sourceBranch']=='fix/nav-lab52-waze-session-reclaim-ota-20261122'
          assert data['applicationId']=='ar.com.rango5gps.drivelabauto.boot.lab'
          assert data['versionName']=='0.1.54-lab.52'
          assert data['versionCode']==56 and data['releaseTag']=='bridge-lab-v52'
          assert data['previousOtaVersion']=='0.1.53-lab.51'
          assert data['previousOtaSha256']=='d63f98f203f0a40fe5b338b87aeeb6b60109ccbfd63e5fb2150b11f51d9885e1'
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success || {
            echo 'BLOCKED: signed candidate CI not successful';exit 21;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_branch)" = fix/nav-lab52-waze-session-reclaim-ota-20261122
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA" || {
            echo 'BLOCKED: signed candidate head SHA mismatch';exit 22;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97 || {
            echo 'BLOCKED: stable release pointer changed';exit 23;
          }
          ! gh release view "$TAG" >/dev/null 2>&1 || {
            echo 'BLOCKED: LAB52 release already exists';exit 24;
          }
      - name: Retrieve signed candidate, verify exact legacy OTA filename/hash/size and original certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nav52 original
          gh run download "$SOURCE_RUN" --name DriveLab-NAV-LAB52-SIGNED-CANDIDATE-NO-OTA --dir dist/nav52
          (cd dist/nav52; sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          d=pathlib.Path('dist/nav52')
          apk=d/'DriveLab-Bridge-LAB-v0.1.54-lab.52.apk'
          m=json.loads((d/'bridge-lab.json').read_text(encoding='utf8'))
          assert apk.is_file() and apk.stat().st_size>1024
          expected={
            'channel':'bridge-lab',
            'packageName':'ar.com.rango5gps.drivelabauto.boot.lab',
            'versionName':'0.1.54-lab.52',
            'versionCode':56,
            'tag':'bridge-lab-v52',
            'size':apk.stat().st_size,
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/bridge-lab-v52/'+apk.name
          }
          assert m==expected,'BLOCKED: invalid metadata or unexpected apk name'
          assert apk.name=='DriveLab-Bridge-LAB-v'+m['versionName']+'.apk','BLOCKED: legacy updater APK naming regression'
          assert re.fullmatch(r'0\.(?:1|2)\.[0-9]+-lab\.[0-9]+',m['versionName'])
          PY
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$sdk" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apk="dist/nav52/$APK"
          "$aapt" dump badging "$apk" | grep -F "package: name='ar.com.rango5gps.drivelabauto.boot.lab' versionCode='56' versionName='0.1.54-lab.52'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'DriveLab NAV'"
          "$signer" verify --print-certs "$apk" >/dev/null
          gh release download bridge-lab-v27 --pattern DriveLab-Bridge-LAB-v0.1.29-lab.27.apk --dir original
          printf '%s  %s\n' '7e051f6efa3089bbd06e632ca91229352b0d70fd8b3048d9ec99876a163fe3bc' 'original/DriveLab-Bridge-LAB-v0.1.29-lab.27.apk' | sha256sum -c -
          cert(){ "$signer" verify --print-certs "$1" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF;exit}'; }
          test -n "$(cert "$apk")"
          test "$(cert "$apk")" = "$(cert original/DriveLab-Bridge-LAB-v0.1.29-lab.27.apk)" || {
            echo 'BLOCKED: Android package certificate differs from installed NAV LAB27';exit 25;
          }
          gh api "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json?ref=bridge-lab-ota" > old-pointer-response.json
          jq -r .content old-pointer-response.json | base64 -d > old-pointer.json
          python3 - <<'PY'
          import json
          before=json.load(open('old-pointer.json'))
          assert before=={
            'channel':'bridge-lab',
            'packageName':'ar.com.rango5gps.drivelabauto.boot.lab',
            'versionName':'0.1.53-lab.51',
            'versionCode':55,
            'tag':'bridge-lab-v51',
            'size':5102733,
            'sha256':'d63f98f203f0a40fe5b338b87aeeb6b60109ccbfd63e5fb2150b11f51d9885e1',
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/bridge-lab-v51/DriveLab-Bridge-LAB-v0.1.53-lab.51.apk'
          }, 'BLOCKED: LAB51 OTA pointer changed'
          PY
          gh release download v0.3.97 --pattern sender.json --dir original
          gh release download v0.3.97 --pattern receiver.json --dir original
          echo 'PASS original Android signer + LAB51 pointer + legacy BootUpdater LAB52 APK filename, Sender untouched' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish ONLY signed Jetour NAV LAB52 prerelease, verify downloaded file
        shell: bash
        run: |
          set -euo pipefail
          # Split the tag and release steps to isolate GitHub's 403 during
          # implicit tag creation. Match ONLY the pinned signed SHA.
          # Tag only a provenance commit with zero workflow changes.
          # GitHub explicitly rejected tagging the signed-candidate commit
          # because it added a workflow file; the APK provenance remains
          # cryptographically verified above using SOURCE_RUN + SOURCE_SHA.
          git cat-file -e "$TAG_SOURCE_SHA^{commit}"
          test "$(git show --format= --name-only "$TAG_SOURCE_SHA" | grep -c '^nav-ota-provenance/lab52.json$')" = 1 || {
            echo 'BLOCKED: provenance tag must target non-workflow LAB52 metadata commit'; exit 32;
          }
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
              push "https://github.com/$GITHUB_REPOSITORY.git" \
              "$TAG_SOURCE_SHA:refs/tags/$TAG"
            unset auth_header
          fi
          actual_tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          test "$actual_tag_sha" = "$TAG_SOURCE_SHA" || {
            echo 'BLOCKED: tag does not point to immutable LAB52 provenance';exit 31;
          }
          gh release create "$TAG" "dist/nav52/$APK" dist/nav52/bridge-lab.json \
            --target "$TAG_SOURCE_SHA" --prerelease \
            --title 'DriveLab NAV LAB52 · Waze clúster se recupera tras actualizar sin cerrar app' \
            --notes 'LAB52 incorpora recuperación de la tarea Waze existente cuando Android mata NAV durante OTA o al apagar el clúster. Se comprueban dos veces identidad de stack/tarea, display y app antes de mover únicamente una tarea Waze MainActivity aislada desde display físico 0 al display virtual NAV recién creado. Se guarda el identificador de tarea previamente confirmado, no un ID de display transitorio. En la primera recuperación desde LAB51, cuando falta registro anterior, se requiere confirmar REUTILIZAR WAZE una vez. No se usa force-stop de paquete ni se afectan OEM, T1Launcher, Maps, Spotify o pantallas de terceros. La nueva tarea se registra para que Sender vuelva a mandar rutas a Waze además de Maps. Mantiene todas las mejoras y curvaturas de LAB51, persistencia QR y firma original. IMPORTANTE: intercambios reales Central A/B y Tablero A/B están en un prototipo aparte y NO incluidos en LAB52 porque todavía carecen de integración verificada con tareas y displays físicos. LAB51 sigue disponible para rollback. Comprobado Java regression tests, Android build y firma original; conducción y entrega real por Sender requieren confirmación física estacionada.'
          mkdir -p verify
          gh release download "$TAG" --pattern "$APK" --dir verify
          cmp "dist/nav52/$APK" "verify/$APK"
          gh release download "$TAG" --pattern bridge-lab.json --dir verify
          cmp dist/nav52/bridge-lab.json verify/bridge-lab.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97
      - name: Switch ONLY NAV LAB OTA pointer and verify Sender, Receiver unchanged
        shell: bash
        run: |
          set -euo pipefail
          old_sha=$(jq -r .sha old-pointer-response.json)
          test -n "$old_sha"
          content=$(base64 -w0 dist/nav52/bridge-lab.json)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json" \
            -f branch=bridge-lab-ota -f sha="$old_sha" \
            -f message='ota(nav): original-signed NAV LAB52 code56 direct Waze exported launcher and guarded own-stack relocation trial' \
            -f content="$content" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json?ref=bridge-lab-ota" --jq .content | base64 -d > current-bridge.json
          cmp current-bridge.json dist/nav52/bridge-lab.json
          mkdir -p current
          gh release download v0.3.97 --pattern sender.json --dir current
          gh release download v0.3.97 --pattern receiver.json --dir current
          cmp original/sender.json current/sender.json
          cmp original/receiver.json current/receiver.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97
          echo 'PUBLISHED NAV LAB52 only: original signer/Android identity, correct OTA filename, separate Sender/Receiver unchanged. User must approve install.' >> "$GITHUB_STEP_SUMMARY"
