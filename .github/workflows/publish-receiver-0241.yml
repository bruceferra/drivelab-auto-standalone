name: Signed Receiver 0.2.41 - corrected EV HEV diagnostics and battery voltage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-receiver-0241.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  receiver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      RECEIVER_STORE_PASSWORD: ${{ secrets.RECEIVER_STORE_PASSWORD }}
      RECEIVER_KEY_ALIAS: ${{ secrets.RECEIVER_KEY_ALIAS }}
      RECEIVER_KEY_PASSWORD: ${{ secrets.RECEIVER_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore original Receiver signing certificate
        shell: bash
        env:
          RECEIVER_KEYSTORE_B64: ${{ secrets.RECEIVER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$RECEIVER_KEYSTORE_B64"
          test -n "$RECEIVER_STORE_PASSWORD" && test -n "$RECEIVER_KEY_ALIAS" && test -n "$RECEIVER_KEY_PASSWORD"
          printf %s "$RECEIVER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/receiver.p12"
          chmod 600 "$RUNNER_TEMP/receiver.p12"
          echo "RECEIVER_KEYSTORE=$RUNNER_TEMP/receiver.p12" >> "$GITHUB_ENV"
      - name: Build Receiver and verify unchanged signing identity / Sender OTA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'bruceferra/drivelab-auto-standalone'
          test "$GITHUB_REF_NAME" = main
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.2.40
          ! gh release view v0.2.41 >/dev/null 2>&1
          mkdir -p /tmp/prior output
          gh release download v0.2.40 --pattern 'DriveLab-Auto-Receiver-v0.2.40.apk' --dir /tmp/prior
          gh release download v0.2.40 --pattern 'sender.json' --dir /tmp/prior
          cp /tmp/prior/sender.json output/sender.json
          python3 - <<'PY'
          import json
          m=json.load(open('output/sender.json'))
          assert m['packageName']=='ar.com.rango5gps.drivelabauto.sender'
          assert m['versionCode']==17 and m['versionName']=='0.2.16'
          assert m['apkUrl']=='https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.2.16/DriveLab-Auto-Sender-v0.2.16.apk'
          PY
          gradle --no-daemon :receiver:assembleRelease
          apk='receiver/build/outputs/apk/release/receiver-release.apk'
          test -s "$apk"
          sig="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$sig" verify --print-certs "$apk"
          "$sig" verify --print-certs /tmp/prior/DriveLab-Auto-Receiver-v0.2.40.apk
          oldcert=$("$sig" verify --print-certs /tmp/prior/DriveLab-Auto-Receiver-v0.2.40.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          newcert=$("$sig" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$oldcert" && test "$oldcert" = "$newcert"
          badge=$("$aapt" dump badging "$apk" | head -1)
          echo "$badge"
          echo "$badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.receiver'"
          echo "$badge" | grep -F "versionCode='42'"
          echo "$badge" | grep -F "versionName='0.2.41'"
          name='DriveLab-Auto-Receiver-v0.2.41.apk'
          cp "$apk" "output/$name"
          export RECEIVER_SHA=$(sha256sum "output/$name" | awk '{print $1}')
          python3 - <<'PY'
          import json,os
          m={'packageName':'ar.com.rango5gps.drivelabauto.receiver',
             'versionName':'0.2.41','versionCode':42,
             'sha256':os.environ['RECEIVER_SHA'],
             'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.2.41/DriveLab-Auto-Receiver-v0.2.41.apk'}
          with open('output/receiver.json','w') as f:json.dump(m,f,indent=2)
          PY
          sha256sum "output/$name" > output/receiver.sha256
      - name: Publish Receiver 0.2.41 as latest, preserve Sender 0.2.16
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.2.40
          gh release create v0.2.41 \
            output/DriveLab-Auto-Receiver-v0.2.41.apk \
            output/receiver.json output/sender.json output/receiver.sha256 \
            --target "$GITHUB_SHA" --latest \
            --title 'DriveLab Auto Receiver 0.2.41 - LED horizonte en P y N' \
            --notes 'Receiver 0.2.41: fotos del usuario confirmaron 1043=2 ya HEV, 1033=1 P y velocidad=0; el boton EV a HEV no habia enviado comando porque el destino ya estaba activo. El cockpit ahora informa YA ESTAS EN HEV, muestra modo OEM actual y precondiciones precisas, y agrega al DIAGNOSTICAR SIN ESCRIBIR el contraste HAL 557867211 frente a Vehicle 1043, sin usar candidato de escritura 557843642. Conserva informe de errores para una prueba real partiendo de EV=1 o EV MAX=3. No se incorporan escrituras adicionales ni automatismos GPS: setter 1043 aun NO validado fisicamente. Corrige diagnostico 12V: IBS=0 no es lectura valida y EXT BATT=315 es compatible con alta tension HV, no bateria auxiliar. El Receiver muestra su version REAL desde PackageManager y el popup de actualizacion usa alto contraste y salto de linea real. Mantiene la temperatura motor experimental 559940105 que en foto dio 56.25 RAW, pruebas LED P/N y viaje/cliente, luces, cinturones, EV/HEV anteriores. Sender 0.2.16 intacto; mismo certificado firmado.'
          mkdir -p verify
          gh release download v0.2.41 --pattern 'sender.json' --dir verify
          gh release download v0.2.41 --pattern 'receiver.json' --dir verify
          cmp output/sender.json verify/sender.json
          cmp output/receiver.json verify/receiver.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.2.41
          gh release view v0.2.41 --json assets --jq '.assets[].name'
