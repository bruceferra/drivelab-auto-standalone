name: Publish DriveLab NAV LAB47 OTA from approved original-signed CI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nav-lab47-ota-publisher.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: drivelab-nav47-recover-main-publisher
  cancel-in-progress: false

jobs:
  publish-nav:
    if: github.repository == 'bruceferra/drivelab-auto-standalone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '45063261310'
      SOURCE_SHA: 'f27909612ad0ff9e1814b39c4fed868f2569faf2'
      TAG_SOURCE_SHA: 'cafb08b4a9a3adcdcbfee0d0b65382d1f4842afe'
      TAG: 'bridge-lab-v47'
      APK: 'DriveLab-Bridge-LAB-v0.1.49-lab.47.apk'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 64
          persist-credentials: false
      - name: Require owner approval, signed build success and exact source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data=json.load(open('nav-ota-provenance/lab47.json',encoding='utf-8'))
          assert data['kind']=='drivelab-nav-ota-provenance'
          assert data['sourceRunId']==45063261310
          assert data['sourceCommit']=='f27909612ad0ff9e1814b39c4fed868f2569faf2'
          assert data['sourceBranch']=='fix/nav-lab47-transparent-toolbar-fullbleed-20261122'
          assert data['applicationId']=='ar.com.rango5gps.drivelabauto.boot.lab'
          assert data['versionName']=='0.1.49-lab.47'
          assert data['versionCode']==51 and data['releaseTag']=='bridge-lab-v47'
          assert data['previousOtaVersion']=='0.1.48-lab.46'
          assert data['previousOtaSha256']=='69eb97fa08971a5464564f6d5c6b2d6e4319b6d7338ddff3b2c85951dcda39ae'
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success || {
            echo 'BLOCKED: signed candidate CI not successful';exit 21;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_branch)" = fix/nav-lab47-transparent-toolbar-fullbleed-20261122
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA" || {
            echo 'BLOCKED: signed candidate head SHA mismatch';exit 22;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97 || {
            echo 'BLOCKED: stable release pointer changed';exit 23;
          }
          ! gh release view "$TAG" >/dev/null 2>&1 || {
            echo 'BLOCKED: LAB47 release already exists';exit 24;
          }
      - name: Retrieve signed candidate, verify exact legacy OTA filename/hash/size and original certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nav47 original
          gh run download "$SOURCE_RUN" --name DriveLab-NAV-LAB47-SIGNED-CANDIDATE-NO-OTA --dir dist/nav47
          (cd dist/nav47; sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          d=pathlib.Path('dist/nav47')
          apk=d/'DriveLab-Bridge-LAB-v0.1.49-lab.47.apk'
          m=json.loads((d/'bridge-lab.json').read_text(encoding='utf8'))
          assert apk.is_file() and apk.stat().st_size>1024
          expected={
            'channel':'bridge-lab',
            'packageName':'ar.com.rango5gps.drivelabauto.boot.lab',
            'versionName':'0.1.49-lab.47',
            'versionCode':51,
            'tag':'bridge-lab-v47',
            'size':apk.stat().st_size,
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/bridge-lab-v47/'+apk.name
          }
          assert m==expected,'BLOCKED: invalid metadata or unexpected apk name'
          assert apk.name=='DriveLab-Bridge-LAB-v'+m['versionName']+'.apk','BLOCKED: legacy updater APK naming regression'
          assert re.fullmatch(r'0\.(?:1|2)\.[0-9]+-lab\.[0-9]+',m['versionName'])
          PY
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$sdk" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apk="dist/nav47/$APK"
          "$aapt" dump badging "$apk" | grep -F "package: name='ar.com.rango5gps.drivelabauto.boot.lab' versionCode='51' versionName='0.1.49-lab.47'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'DriveLab NAV'"
          "$signer" verify --print-certs "$apk" >/dev/null
          gh release download bridge-lab-v27 --pattern DriveLab-Bridge-LAB-v0.1.29-lab.27.apk --dir original
          printf '%s  %s\n' '7e051f6efa3089bbd06e632ca91229352b0d70fd8b3048d9ec99876a163fe3bc' 'original/DriveLab-Bridge-LAB-v0.1.29-lab.27.apk' | sha256sum -c -
          cert(){ "$signer" verify --print-certs "$1" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF;exit}'; }
          test -n "$(cert "$apk")"
          test "$(cert "$apk")" = "$(cert original/DriveLab-Bridge-LAB-v0.1.29-lab.27.apk)" || {
            echo 'BLOCKED: Android package certificate differs from installed NAV LAB27';exit 25;
          }
          gh api "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json?ref=bridge-lab-ota" > old-pointer-response.json
          jq -r .content old-pointer-response.json | base64 -d > old-pointer.json
          python3 - <<'PY'
          import json
          before=json.load(open('old-pointer.json'))
          assert before=={
            'channel':'bridge-lab',
            'packageName':'ar.com.rango5gps.drivelabauto.boot.lab',
            'versionName':'0.1.48-lab.46',
            'versionCode':50,
            'tag':'bridge-lab-v46',
            'size':5099737,
            'sha256':'69eb97fa08971a5464564f6d5c6b2d6e4319b6d7338ddff3b2c85951dcda39ae',
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/bridge-lab-v46/DriveLab-Bridge-LAB-v0.1.48-lab.46.apk'
          }, 'BLOCKED: LAB46 OTA pointer changed'
          PY
          gh release download v0.3.97 --pattern sender.json --dir original
          gh release download v0.3.97 --pattern receiver.json --dir original
          echo 'PASS original Android signer + LAB46 pointer + legacy BootUpdater LAB47 APK filename, Sender untouched' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish ONLY signed Jetour NAV LAB47 prerelease, verify downloaded file
        shell: bash
        run: |
          set -euo pipefail
          # Split the tag and release steps to isolate GitHub's 403 during
          # implicit tag creation. Match ONLY the pinned signed SHA.
          # Tag only a provenance commit with zero workflow changes.
          # GitHub explicitly rejected tagging the signed-candidate commit
          # because it added a workflow file; the APK provenance remains
          # cryptographically verified above using SOURCE_RUN + SOURCE_SHA.
          git cat-file -e "$TAG_SOURCE_SHA^{commit}"
          test "$(git show --format= --name-only "$TAG_SOURCE_SHA" | grep -c '^nav-ota-provenance/lab47.json$')" = 1 || {
            echo 'BLOCKED: provenance tag must target non-workflow LAB47 metadata commit'; exit 32;
          }
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
              push "https://github.com/$GITHUB_REPOSITORY.git" \
              "$TAG_SOURCE_SHA:refs/tags/$TAG"
            unset auth_header
          fi
          actual_tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          test "$actual_tag_sha" = "$TAG_SOURCE_SHA" || {
            echo 'BLOCKED: tag does not point to immutable LAB47 provenance';exit 31;
          }
          gh release create "$TAG" "dist/nav47/$APK" dist/nav47/bridge-lab.json \
            --target "$TAG_SOURCE_SHA" --prerelease \
            --title 'DriveLab NAV LAB47 · barra Jetour transparente y mosaico al borde' \
            --notes 'LAB47: acabado visual de NAV sobre LAB46 sin modificar su funcionamiento. Barra superior con botones transparentes y respuesta táctil sutil estilo Jetour, estado de clúster en turquesa, altura compacta. Maps y Spotify ocupan todo el ancho disponible, sin relleno alrededor de sus paneles ni línea divisoria artificial; conserva esquinas redondeadas, recorte de aspecto y transformación inversa del tacto. Mosaico abre automáticamente, Sender sigue entregando a Maps y Waze sin cambio de tareas, Spotify y clúster Waze completo conservados. El intercambio entre Central A/B y Tablero A/B NO forma parte de LAB47: está en desarrollo aislado sin OTA. Tampoco se modifica micrófono, ruedita, T1Launcher ni controles OEM. LAB46 disponible como respaldo. Verificación física con vehículo estacionado pendiente.'
          mkdir -p verify
          gh release download "$TAG" --pattern "$APK" --dir verify
          cmp "dist/nav47/$APK" "verify/$APK"
          gh release download "$TAG" --pattern bridge-lab.json --dir verify
          cmp dist/nav47/bridge-lab.json verify/bridge-lab.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97
      - name: Switch ONLY NAV LAB OTA pointer and verify Sender, Receiver unchanged
        shell: bash
        run: |
          set -euo pipefail
          old_sha=$(jq -r .sha old-pointer-response.json)
          test -n "$old_sha"
          content=$(base64 -w0 dist/nav47/bridge-lab.json)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json" \
            -f branch=bridge-lab-ota -f sha="$old_sha" \
            -f message='ota(nav): original-signed NAV LAB47 code51 direct Waze exported launcher and guarded own-stack relocation trial' \
            -f content="$content" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json?ref=bridge-lab-ota" --jq .content | base64 -d > current-bridge.json
          cmp current-bridge.json dist/nav47/bridge-lab.json
          mkdir -p current
          gh release download v0.3.97 --pattern sender.json --dir current
          gh release download v0.3.97 --pattern receiver.json --dir current
          cmp original/sender.json current/sender.json
          cmp original/receiver.json current/receiver.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97
          echo 'PUBLISHED NAV LAB47 only: original signer/Android identity, correct OTA filename, separate Sender/Receiver unchanged. User must approve install.' >> "$GITHUB_STEP_SUMMARY"
