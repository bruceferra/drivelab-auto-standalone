name: Lanzar Receiver Android installer 0.2.5 una sola vez
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v025-one-shot.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.repository == 'bruceferra/drivelab-auto-standalone'
    runs-on: ubuntu-24.04
    steps:
      - name: Publicación firmada 0.2.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-release.yml --ref main --repo "$GITHUB_REPOSITORY" -f tag=v0.2.5
