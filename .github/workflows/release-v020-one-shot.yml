name: Lanzar publicación firmada inicial v0.2.0 una sola vez
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v020-one-shot.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch-initial-release:
    if: github.repository == 'bruceferra/drivelab-auto-standalone'
    runs-on: ubuntu-24.04
    steps:
      - name: Solicitar compilación y publicación firmada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-release.yml --ref main --repo "$GITHUB_REPOSITORY" -f tag=v0.2.0
          echo 'Despacho de publicación v0.2.0 solicitado.'
