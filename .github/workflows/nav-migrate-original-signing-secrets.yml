name: Move ORIGINAL NAV + Sender secrets to private unified repo — OWNER TOKEN REQUIRED
# Does nothing unless owner provisions a tightly scoped token and commits
# the exact approval JSON. Only encrypted GitHub Actions secrets are written.
on:
  push:
    branches: [chore/nav-signed-transition-20261121]
    paths: ['nav-transition/APPROVE_SECRET_MOVE_TO_UNIFIED.json']

permissions:
  contents: read

concurrency:
  group: original-nav-key-transfer-to-unified
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'bruceferra/drivelab-auto-standalone' && github.ref == 'refs/heads/chore/nav-signed-transition-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.NAV_UNIFIED_SECRET_WRITE_TOKEN }}
      RECEIVER_KEYSTORE_B64: ${{ secrets.RECEIVER_KEYSTORE_B64 }}
      RECEIVER_STORE_PASSWORD: ${{ secrets.RECEIVER_STORE_PASSWORD }}
      RECEIVER_KEY_ALIAS: ${{ secrets.RECEIVER_KEY_ALIAS }}
      RECEIVER_KEY_PASSWORD: ${{ secrets.RECEIVER_KEY_PASSWORD }}
      SENDER_KEYSTORE_B64: ${{ secrets.SENDER_KEYSTORE_B64 }}
      SENDER_STORE_PASSWORD: ${{ secrets.SENDER_STORE_PASSWORD }}
      SENDER_KEY_ALIAS: ${{ secrets.SENDER_KEY_ALIAS }}
      SENDER_KEY_PASSWORD: ${{ secrets.SENDER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact owner approval and target repo is private
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import json
          data=json.load(open('nav-transition/APPROVE_SECRET_MOVE_TO_UNIFIED.json'))
          assert data=={
            'approval':'TRANSFERIR_FIRMAS_ORIGINALES_A_DRIVELAB_PRIVADO',
            'targetRepository':'bruceferra/drivelab',
            'preserveOriginalSecrets':True,
            'neverPublishApk':True,
            'neverPrintCredentials':True
          }, 'BLOCKED: owner approval mismatch'
          PY
          test -n "$GH_TOKEN" || { echo 'BLOCKED: add NAV_UNIFIED_SECRET_WRITE_TOKEN to ORIGINAL repo Actions secrets first'; exit 30; }
          gh api repos/bruceferra/drivelab --jq '.private' | grep -Fx true || { echo 'BLOCKED: target must be private'; exit 31; }
          for key in RECEIVER_KEYSTORE_B64 RECEIVER_STORE_PASSWORD RECEIVER_KEY_ALIAS RECEIVER_KEY_PASSWORD SENDER_KEYSTORE_B64 SENDER_STORE_PASSWORD SENDER_KEY_ALIAS SENDER_KEY_PASSWORD; do
            test -n "$(printenv "$key")" || { echo "BLOCKED: missing source secret $key"; exit 32; }
          done
      - name: Encrypt original keys directly as target Actions secrets without displaying values
        shell: bash
        run: |
          set -euo pipefail
          set +x
          for key in RECEIVER_KEYSTORE_B64 RECEIVER_STORE_PASSWORD RECEIVER_KEY_ALIAS RECEIVER_KEY_PASSWORD SENDER_KEYSTORE_B64 SENDER_STORE_PASSWORD SENDER_KEY_ALIAS SENDER_KEY_PASSWORD; do
            printenv "$key" | gh secret set "$key" -R bruceferra/drivelab
            echo "Encrypted on private destination: $key"
          done
          names=$(gh secret list -R bruceferra/drivelab --json name --jq '.[].name')
          for key in RECEIVER_KEYSTORE_B64 RECEIVER_STORE_PASSWORD RECEIVER_KEY_ALIAS RECEIVER_KEY_PASSWORD SENDER_KEYSTORE_B64 SENDER_STORE_PASSWORD SENDER_KEY_ALIAS SENDER_KEY_PASSWORD; do
            grep -Fx "$key" <<< "$names" >/dev/null || { echo "BLOCKED missing target secret name $key"; exit 33; }
          done
          echo 'PASS all eight ORIGINAL secrets encrypted in private unified repo; old keys retained; zero key value output; no APK/OTA/release modified.' >> "$GITHUB_STEP_SUMMARY"
