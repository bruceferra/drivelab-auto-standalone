name: Publish original-signed Sender 0.2.25 Jetour Xiaomi UI via in-app OTA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sender-jetour-ui-ota-publisher.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: sender025-jetour-ui-signature-ota
  cancel-in-progress: false
jobs:
  sender-publish:
    if: github.repository == 'bruceferra/drivelab-auto-standalone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '45063031614'
      SOURCE_SHA: '61993d1d3c1d14c53b123d191d7aa4a0f72ce1cc'
      TAG_SOURCE_SHA: 'e8826d7b3c2613efec55b4cdf06828e32c6d0cee'
      TAG: 'sender-v0.2.25'
      APK: 'DriveLab-Auto-Sender-v0.2.25.apk'
      STABLE: 'v0.3.97'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original candidate, provenance, old sender manifest and preserved receiver
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_branch)" = feature/sender-xiaomi-jetour-ui-20261122
          python3 - <<'PY'
          import json
          x=json.load(open('sender-ota-provenance/sender025-jetour-ui.json'))
          assert x['sourceRunId']==45063031614
          assert x['sourceCommit']=='61993d1d3c1d14c53b123d191d7aa4a0f72ce1cc'
          assert x['versionCode']==30 and x['versionName']=='0.2.25'
          assert x['previousVersion']=='0.2.0' and x['previousCode']==29
          assert x['previousStableReceiver']=='v0.3.97'
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'BLOCKED: release already published, never overwrite old signed APK';exit 21;
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$STABLE"
          mkdir -p old dist prior
          gh release download "$STABLE" --pattern sender.json --dir old
          gh release download "$STABLE" --pattern receiver.json --dir old
          printf '%s  %s\n' '509bb52dc5d8115cd5d196653b166ba731de994b8c259ccda0b6a410c6e81636' old/sender.json | sha256sum -c -
          python3 - <<'PY'
          import json
          m=json.load(open('old/sender.json'))
          assert m['versionName']=='0.2.0' and m['versionCode']==29
          assert m['packageName']=='ar.com.rango5gps.drivelabauto.sender'
          assert m['sha256']=='eab8e9c84911b67fd72fd9a3dfa118deabdb8974f63d868625de52139d7620ce'
          PY
          gh run download "$SOURCE_RUN" \
            --name Sender-JetourUI-v0.2.25-SIGNED-CANDIDATE-NO-OTA --dir dist
          (cd dist;sha256sum -c SHA256SUMS)
          gh release download sender-v0.2.0 \
            --pattern DriveLab-Auto-Sender-v0.2.0.apk --dir prior
          old=prior/DriveLab-Auto-Sender-v0.2.0.apk
          new=dist/$APK
          test -s "$old" && test -s "$new"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --print-certs "$old"
          "$apksigner" verify --print-certs "$new"
          oldcert=$("$apksigner" verify --print-certs "$old" |
            awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          newcert=$("$apksigner" verify --print-certs "$new" |
            awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$newcert" && test "$newcert" = "$oldcert"
          test "$newcert" = 19e86fcc66d8912d8d175958fccf86326e9bf262b7dec3b238169d4ca4ce5d41
          "$aapt" dump badging "$new" | grep -F "package: name='ar.com.rango5gps.drivelabauto.sender' versionCode='30' versionName='0.2.25'"
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('dist')
          apk=p/'DriveLab-Auto-Sender-v0.2.25.apk'
          m=json.loads((p/'sender.json').read_text())
          assert m['versionCode']==30 and m['versionName']=='0.2.25'
          assert m['packageName']=='ar.com.rango5gps.drivelabauto.sender'
          assert m['sha256']==hashlib.sha256(apk.read_bytes()).hexdigest()
          assert m['apkUrl']=='https://github.com/bruceferra/drivelab-auto-standalone/releases/download/sender-v0.2.25/DriveLab-Auto-Sender-v0.2.25.apk'
          PY
      - name: Publish only original-signed Sender prerelease (latest Receiver unchanged)
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$TAG_SOURCE_SHA^{commit}"
          test "$(git show --format= --name-only "$TAG_SOURCE_SHA" | grep -c '^sender-ota-provenance/sender025-jetour-ui.json$')" = 1
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
              push "https://github.com/$GITHUB_REPOSITORY.git" \
              "$TAG_SOURCE_SHA:refs/tags/$TAG"
            unset auth_header
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$TAG_SOURCE_SHA"
          gh release create "$TAG" "dist/$APK" dist/sender.json \
            --target "$TAG_SOURCE_SHA" --prerelease \
            --title 'DriveLab Sender Xiaomi 0.2.25 · estética Jetour' \
            --notes 'UI Sender estilo Jetour: botones de Waze/Maps/Ambos al toque, paneles compactos y oscuros, conexión T1, QR, audio y diagnósticos plegables. Misma identidad y certificado original Sender; sin cambios en envío de Uber, protocolo, vinculación, claves, Bluetooth, Receiver o NAV. Micrófono y ruedita del volante aún pendientes. Instalación sólo desde actualizador del Sender con confirmación Android; prueba visual física pendiente.'
          mkdir -p verify
          gh release download "$TAG" --pattern "$APK" --dir verify
          gh release download "$TAG" --pattern sender.json --dir verify
          cmp "dist/$APK" "verify/$APK"
          cmp dist/sender.json verify/sender.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$STABLE"
      - name: Update ONLY stable Sender OTA manifest, verify Receiver and NAV unchanged
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$STABLE" dist/sender.json --clobber
          mkdir -p final
          gh release download "$STABLE" --pattern sender.json --dir final
          gh release download "$STABLE" --pattern receiver.json --dir final
          cmp dist/sender.json final/sender.json
          cmp old/receiver.json final/receiver.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$STABLE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE" --jq '.assets | map(select(.name=="DriveLab-Auto-Receiver-v0.3.97.apk")) | length')" = 1
          echo 'PUBLISHED Sender 0.2.25 original-signed Jetour facelift, update manifest only; Receiver v0.3.97 and NAV OTA untouched. Android user confirmation required.' >> "$GITHUB_STEP_SUMMARY"
