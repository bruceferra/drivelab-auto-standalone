name: Signed Sender 0.2.22 - silent Uber and shared locations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-sender-0222-headless-sharing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  sender-updater:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SENDER_STORE_PASSWORD: ${{ secrets.SENDER_STORE_PASSWORD }}
      SENDER_KEY_ALIAS: ${{ secrets.SENDER_KEY_ALIAS }}
      SENDER_KEY_PASSWORD: ${{ secrets.SENDER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore existing Sender signing identity
        env:
          SENDER_KEYSTORE_B64: ${{ secrets.SENDER_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
          test -n "$SENDER_KEYSTORE_B64" && test -n "$SENDER_STORE_PASSWORD"
          test -n "$SENDER_KEY_ALIAS" && test -n "$SENDER_KEY_PASSWORD"
          printf %s "$SENDER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sender.p12"
          chmod 600 "$RUNNER_TEMP/sender.p12"
          echo "SENDER_KEYSTORE=$RUNNER_TEMP/sender.p12" >> "$GITHUB_ENV"
      # Rebuild after the updated v0.3.27 signature-verification regression contract.
      - name: Run share navigation regression and sign Sender 0.2.22 only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = bruceferra/drivelab-auto-standalone
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.27
          ! gh release view sender-v0.2.22 >/dev/null 2>&1
          mkdir -p /tmp/sender-old /tmp/updater-test output
          gh release download sender-v0.2.21 --pattern 'DriveLab-Auto-Sender-v0.2.21.apk' --dir /tmp/sender-old
          javac -encoding UTF-8 -d /tmp/updater-test \
            common/src/main/java/ar/com/rango5gps/drivelabauto/common/UpdaterManifestUrlPolicy.java \
            common/tests/UpdaterManifestUrlPolicyTest.java \
            sender/tests/SenderBluetoothPickerSourceContractTest.java \
            sender/tests/SenderAudioBootstrapSourceContractTest.java \
            sender/tests/SenderShareHeadlessSourceContractTest.java
          java -cp /tmp/updater-test ar.com.rango5gps.drivelabauto.common.UpdaterManifestUrlPolicyTest
          java -cp /tmp/updater-test ar.com.rango5gps.drivelabauto.sender.SenderBluetoothPickerSourceContractTest
          java -cp /tmp/updater-test ar.com.rango5gps.drivelabauto.sender.SenderAudioBootstrapSourceContractTest
          java -cp /tmp/updater-test ar.com.rango5gps.drivelabauto.sender.SenderShareHeadlessSourceContractTest
          gradle --no-daemon :sender:assembleRelease
          apk=sender/build/outputs/apk/release/sender-release.apk
          test -s "$apk"
          sig="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$sig" verify --print-certs "$apk"
          old=/tmp/sender-old/DriveLab-Auto-Sender-v0.2.21.apk
          "$sig" verify --print-certs "$old"
          oldcert=$("$sig" verify --print-certs "$old" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          newcert=$("$sig" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$oldcert" && test "$oldcert" = "$newcert"
          badge=$("$aapt" dump badging "$apk" | head -1)
          echo "$badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.sender'"
          echo "$badge" | grep -F "versionCode='23'"
          echo "$badge" | grep -F "versionName='0.2.22'"
          cp "$apk" output/DriveLab-Auto-Sender-v0.2.22.apk
          export SENDER_SHA=$(sha256sum output/DriveLab-Auto-Sender-v0.2.22.apk | awk '{print $1}')
          python3 - <<'PY'
          import json,os
          sha=os.environ['SENDER_SHA']
          assert len(sha)==64
          obj={'packageName':'ar.com.rango5gps.drivelabauto.sender',
               'versionName':'0.2.22','versionCode':23,
               'sha256':sha,
               'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/sender-v0.2.22/DriveLab-Auto-Sender-v0.2.22.apk'}
          with open('output/sender.json','w') as f: json.dump(obj,f,indent=2)
          PY
          # The deployed manifest's EXACT URL is accepted both by old
          # Sender 0.2.19 and new Sender 0.2.20.
          python3 - <<'PY'
          import json
          m=json.load(open('output/sender.json'))
          ver=m['versionName']
          expected=f'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/sender-v{ver}/DriveLab-Auto-Sender-v{ver}.apk'
          assert m['apkUrl']==expected and m['versionCode']==23
          PY
          sha256sum output/DriveLab-Auto-Sender-v0.2.22.apk > output/sender.sha256
      - name: Publish isolated Sender release and update only latest sender.json
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.27
          ! gh release view sender-v0.2.22 >/dev/null 2>&1
          mkdir -p verify before
          gh release download v0.3.27 --pattern 'receiver.json' --dir before
          gh release download v0.3.27 --pattern 'receiver.sha256' --dir before
          gh release create sender-v0.2.22 \
            output/DriveLab-Auto-Sender-v0.2.22.apk output/sender.sha256 \
            --target "$GITHUB_SHA" --latest=false \
            --title 'DriveLab Auto Sender 0.2.22 · Uber y Compartir sin abrir Sender' \
            --notes 'Sender 0.2.22 code23: La actividad transparente de compartir desde Uber, Maps o WhatsApp deja de reutilizar la tarea de configuración del Sender y elimina su tarea temporal tras iniciar el servicio cifrado de segundo plano. Conserva Waze Maps Ambos Bluetooth QR y OTA. Receiver 0.3.27 queda intacto. Validacion fisica pendiente en Xiaomi.'
          gh release download sender-v0.2.22 --pattern 'DriveLab-Auto-Sender-v0.2.22.apk' --dir verify
          cmp output/DriveLab-Auto-Sender-v0.2.22.apk verify/DriveLab-Auto-Sender-v0.2.22.apk
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.27
          gh release upload v0.3.27 output/sender.json --clobber
          gh release download v0.3.27 --pattern sender.json --dir verify
          cmp output/sender.json verify/sender.json
          gh release download v0.3.27 --pattern receiver.json --dir verify
          gh release download v0.3.27 --pattern receiver.sha256 --dir verify
          cmp before/receiver.json verify/receiver.json
          cmp before/receiver.sha256 verify/receiver.sha256
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.27
          echo 'Sender 0.2.22 OTA published on latest Receiver release. Receiver 0.3.27 unchanged.'
