name: Signed Receiver 0.2.51 - PBA CABA offline map, 6 metrics, OEM readbacks
# Rebuild after corrected Java cockpit syntax; release only on verified success.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-receiver-0251.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  receiver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      RECEIVER_STORE_PASSWORD: ${{ secrets.RECEIVER_STORE_PASSWORD }}
      RECEIVER_KEY_ALIAS: ${{ secrets.RECEIVER_KEY_ALIAS }}
      RECEIVER_KEY_PASSWORD: ${{ secrets.RECEIVER_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore original Receiver signing certificate
        shell: bash
        env:
          RECEIVER_KEYSTORE_B64: ${{ secrets.RECEIVER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$RECEIVER_KEYSTORE_B64"
          test -n "$RECEIVER_STORE_PASSWORD" && test -n "$RECEIVER_KEY_ALIAS" && test -n "$RECEIVER_KEY_PASSWORD"
          printf %s "$RECEIVER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/receiver.p12"
          chmod 600 "$RUNNER_TEMP/receiver.p12"
          echo "RECEIVER_KEYSTORE=$RUNNER_TEMP/receiver.p12" >> "$GITHUB_ENV"
      - name: Pure JVM daily-session rollup regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rollup-classes
          javac -d /tmp/rollup-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1DailyTripSummary.java \
            receiver/tests/T1DailyTripSummaryTest.java
          java -cp /tmp/rollup-classes ar.com.rango5gps.drivelabauto.receiver.T1DailyTripSummaryTest
      - name: Verify manual drive-mode gate with pure JVM test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/modegate-classes
          javac -d /tmp/modegate-classes \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1DriveModeGate.java \
            receiver/tests/T1DriveModeGateTest.java
          java -cp /tmp/modegate-classes ar.com.rango5gps.drivelabauto.receiver.T1DriveModeGateTest
      - name: Build Receiver and verify unchanged signing identity / Sender OTA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'bruceferra/drivelab-auto-standalone'
          test "$GITHUB_REF_NAME" = main
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.2.50
          ! gh release view v0.2.51 >/dev/null 2>&1
          mkdir -p /tmp/prior output
          gh release download v0.2.50 --pattern 'DriveLab-Auto-Receiver-v0.2.50.apk' --dir /tmp/prior
          gh release download v0.2.50 --pattern 'sender.json' --dir /tmp/prior
          cp /tmp/prior/sender.json output/sender.json
          python3 - <<'PY'
          import json
          m=json.load(open('output/sender.json'))
          assert m['packageName']=='ar.com.rango5gps.drivelabauto.sender'
          assert m['versionCode']==17 and m['versionName']=='0.2.16'
          assert m['apkUrl']=='https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.2.16/DriveLab-Auto-Sender-v0.2.16.apk'
          PY
          gradle --no-daemon :receiver:assembleRelease
          apk='receiver/build/outputs/apk/release/receiver-release.apk'
          test -s "$apk"
          sig="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$sig" verify --print-certs "$apk"
          "$sig" verify --print-certs /tmp/prior/DriveLab-Auto-Receiver-v0.2.50.apk
          oldcert=$("$sig" verify --print-certs /tmp/prior/DriveLab-Auto-Receiver-v0.2.50.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          newcert=$("$sig" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$oldcert" && test "$oldcert" = "$newcert"
          badge=$("$aapt" dump badging "$apk" | head -1)
          echo "$badge"
          echo "$badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.receiver'"
          echo "$badge" | grep -F "versionCode='52'"
          echo "$badge" | grep -F "versionName='0.2.51'"
          name='DriveLab-Auto-Receiver-v0.2.51.apk'
          cp "$apk" "output/$name"
          export RECEIVER_SHA=$(sha256sum "output/$name" | awk '{print $1}')
          python3 - <<'PY'
          import json,os
          m={'packageName':'ar.com.rango5gps.drivelabauto.receiver',
             'versionName':'0.2.51','versionCode':52,
             'sha256':os.environ['RECEIVER_SHA'],
             'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.2.51/DriveLab-Auto-Receiver-v0.2.51.apk'}
          with open('output/receiver.json','w') as f:json.dump(m,f,indent=2)
          PY
          # Prevent regression: manifest code must match the signed APK.
          python3 - <<'PY'
          import json
          m=json.load(open('output/receiver.json'))
          assert m['versionName']=='0.2.51'
          assert m['versionCode']==52, 'manifest code mismatch'
          assert m['packageName']=='ar.com.rango5gps.drivelabauto.receiver'
          assert m['apkUrl']=='https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.2.51/DriveLab-Auto-Receiver-v0.2.51.apk'
          assert len(m['sha256'])==64
          print('OK: APK code52 == OTA manifest code52')
          PY
          sha256sum "output/$name" > output/receiver.sha256
      - name: Publish Receiver 0.2.51 as latest, preserve Sender 0.2.16
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.2.50
          gh release create v0.2.51 \
            output/DriveLab-Auto-Receiver-v0.2.51.apk \
            output/receiver.json output/sender.json output/receiver.sha256 \
            --target "$GITHUB_SHA" --latest \
            --title 'DriveLab Auto Receiver 0.2.51 - mapa PBA CABA offline y seis bloques' \
            --notes 'Receiver v0.2.51 code52. ASESOR OSM OFFLINE: reutiliza la misma fuente privada de mapas de Buenos Aires Provincia y CABA que la app DriveLab Uber (manifest https://promanager.com.ar/drivelab/maps/pba-caba-roads-manifest.json y pba-caba-roads.sqlite.gz). Una descarga validada por bytes, SHA-256, esquema SQLite v3 e índice espacial por cada app; si falla conserva el mapa anterior. Revisa actualizaciones del mismo manifiesto cada 24h con el cockpit abierto por Wi-Fi y descarga si cambió; actualización manual desde Zonas/Diagnósticos. Sin Overpass ni envíos de GPS al servidor; solo sugerencias EV/HEV y ninguna escritura automática al vehículo. Cockpit con seis tarjetas al pie de Viaje1/ViajeTotal/Viaje2: Consumo experimental L/100 y km/L, KM eléctricos puros 1035, combustible consumido, electricidad consumida experimental, costo combustible experimental y autonomía total experimental. Nuevo visor compacto porcentaje nafta 1079 y modo conducción 2053 RAW, con informe COMPARTIR de 1031 alta tensión, 1063 voltaje pack sin lectura, 1064 corriente pack amperios, 2204 freno mano, 2073 Engine Status distinto de RPM, 1088 Speed Valid, 2014 atmósfera, 2170 puerta pasajero. El mapa numérico Eco/Sport/Snow todavía necesita validación OEM; no se inventan RPM del motor eléctrico. Mantiene demás funciones de Receiver 0.2.50, tres viajes independientes y sync QR. Sender v0.2.16 sin cambios, misma firma Receiver y OTA code52. Documentación docs/RECEIVER_0_2_51_MAPA_OFFLINE_6_METRICAS_SENALES.md.'
          mkdir -p verify
          gh release download v0.2.51 --pattern 'sender.json' --dir verify
          gh release download v0.2.51 --pattern 'receiver.json' --dir verify
          cmp output/sender.json verify/sender.json
          cmp output/receiver.json verify/receiver.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.2.51
          gh release view v0.2.51 --json assets --jq '.assets[].name'
