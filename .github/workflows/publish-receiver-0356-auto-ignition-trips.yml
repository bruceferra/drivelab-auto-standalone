# 2026-11-18: signed 0.3.56 independent ignition auto journeys and GPS points.
name: Signed Receiver 0.3.56 - ignition AUTO journeys with GPS and charge scopes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-receiver-0356-auto-ignition-trips.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      RECEIVER_STORE_PASSWORD: ${{ secrets.RECEIVER_STORE_PASSWORD }}
      RECEIVER_KEY_ALIAS: ${{ secrets.RECEIVER_KEY_ALIAS }}
      RECEIVER_KEY_PASSWORD: ${{ secrets.RECEIVER_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK and existing signing identity
        env:
          RECEIVER_KEYSTORE_B64: ${{ secrets.RECEIVER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
          test -n "$RECEIVER_KEYSTORE_B64" && test -n "$RECEIVER_STORE_PASSWORD"
          test -n "$RECEIVER_KEY_ALIAS" && test -n "$RECEIVER_KEY_PASSWORD"
          printf %s "$RECEIVER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/receiver.p12"
          chmod 600 "$RUNNER_TEMP/receiver.p12"
          echo "RECEIVER_KEYSTORE=$RUNNER_TEMP/receiver.p12" >> "$GITHUB_ENV"
      - name: Pure geometry and wheel behavior regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-tests
          javac -encoding UTF-8 -d /tmp/t1-tests \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ClusterLayoutMath.java \
            receiver/tests/T1ClusterLayoutMathTest.java \
            receiver/tests/T1ClusterInvertedPanelsAndWheelSourceTest.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1WheelAccessListPolicy.java \
            receiver/tests/T1WheelAccessListPolicyTest.java
          java -cp /tmp/t1-tests ar.com.rango5gps.drivelabauto.receiver.T1ClusterLayoutMathTest
          java -cp /tmp/t1-tests ar.com.rango5gps.drivelabauto.receiver.T1ClusterInvertedPanelsAndWheelSourceTest
          java -cp /tmp/t1-tests ar.com.rango5gps.drivelabauto.receiver.T1WheelAccessListPolicyTest
          for test in T1UpdaterFallbackSourceContractTest MirrorControlsVisibilitySourceContractTest T1GoogleMapsReplaceSourceContractTest T1AdbTaskResizeSourceContractTest T1WheelCalibrationSourceContractTest T1WheelOemBinderSourceContractTest T1WheelOemReconnectContractTest T1UnifiedWheelQuietVoiceSourceContractTest T1WheelPanelAndSpeedSourceTest T1WheelWazeFocusedBackTest T1WheelAutomaticBootResumeTest T1WheelBootDisplayInventoryTest T1ClusterRouteResumptionSourceTest T1WheelAccessibilityRecoverySourceTest T1ClusterPendingRecoverySourceTest T1WheelNov16RollbackSourceTest T1VoiceDualMapPendingSourceTest T1WheelNoAdbFallbackSourceTest; do
            javac -encoding UTF-8 -d /tmp/t1-tests "receiver/tests/$test.java"
            java -cp /tmp/t1-tests "ar.com.rango5gps.drivelabauto.receiver.$test"
          done
      - name: Verify cold boot now performs force-stop and real cluster OFF-ON
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-visible-boot
          javac -encoding UTF-8 -d /tmp/t1-visible-boot receiver/tests/T1ClusterBootVisibleThenForceStopContractTest.java
          java -cp /tmp/t1-visible-boot ar.com.rango5gps.drivelabauto.receiver.T1ClusterBootVisibleThenForceStopContractTest
      - name: Verify cold boot and manual R OFF-ON sequence
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-clean-boot
          javac -encoding UTF-8 -d /tmp/t1-clean-boot receiver/tests/T1ClusterColdBootAndManualRebootContractTest.java
          java -cp /tmp/t1-clean-boot ar.com.rango5gps.drivelabauto.receiver.T1ClusterColdBootAndManualRebootContractTest
      - name: Verify 0-120px touch-through cluster fade
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-fade
          javac -encoding UTF-8 -d /tmp/t1-fade receiver/tests/T1ClusterEdgeFadeContractTest.java
          java -cp /tmp/t1-fade ar.com.rango5gps.drivelabauto.receiver.T1ClusterEdgeFadeContractTest
      - name: Verify fixed header R and persisted reload diagnostics
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-cluster-header
          javac -encoding UTF-8 -d /tmp/t1-cluster-header receiver/tests/T1ClusterFixedToolbarAndFocusResultContractTest.java
          java -cp /tmp/t1-cluster-header ar.com.rango5gps.drivelabauto.receiver.T1ClusterFixedToolbarAndFocusResultContractTest
      - name: Verify TOMAR CONTROL retired and R requires confirmation
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-focus
          javac -encoding UTF-8 -d /tmp/t1-focus receiver/tests/T1ClusterForegroundRecoveryContractTest.java
          java -cp /tmp/t1-focus ar.com.rango5gps.drivelabauto.receiver.T1ClusterForegroundRecoveryContractTest
      - name: Verify persistent FREEFORM 50/50 without ADB dependency
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-freeform-boot
          javac -encoding UTF-8 -d /tmp/t1-freeform-boot receiver/tests/T1ClusterFreeformAutobootRegressionTest.java
          java -cp /tmp/t1-freeform-boot ar.com.rango5gps.drivelabauto.receiver.T1ClusterFreeformAutobootRegressionTest
      - name: Verify inclusive and strict SOC rules and no threshold overlap
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-soc-ops
          javac -encoding UTF-8 -d /tmp/t1-soc-ops \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedDualRulePolicy.java \
            receiver/tests/T1OptimizedModePolicyTest.java \
            receiver/tests/T1OptimizedDualRulePolicyTest.java
          java -cp /tmp/t1-soc-ops ar.com.rango5gps.drivelabauto.receiver.T1OptimizedModePolicyTest
          java -cp /tmp/t1-soc-ops ar.com.rango5gps.drivelabauto.receiver.T1OptimizedDualRulePolicyTest
          grep -Fq 'q.minOperator=lowerOperatorSelector(existing.minComparison)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeActivity.java
          grep -Fq 'q.maxOperator=upperOperatorSelector(existing.maxComparison)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeActivity.java
          grep -Fq 'min_comparison_v3' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeStore.java
          grep -Fq 'max_comparison_v3' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeStore.java
      - name: Assert minimal daily UI and all diagnostics still reachable
        run: |
          set -euo pipefail
          hub=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverActivity.java
          cluster=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ClusterWazeSettingsActivity.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          vehicle=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverVehicleActivity.java
          grep -q 'MENÚ TÉCNICO · PRUEBAS Y AJUSTES' "$hub"
          grep -q 'quickControls.attach(oldControls)' "$hub"
          grep -q 'CONFIGURAR PANELES A/B · APLICAR' "$cluster"
          grep -q 'if(showTechnical)' "$cluster"
          grep -q 'MENÚ TÉCNICO · PRUEBAS OEM' "$cockpit"
          grep -q 'advanced.addView(extra)' "$cockpit"
          grep -q 'renderWiperAndRadarDiagnostics(body)' "$vehicle"
          grep -q 'renderMirrorTechnical(body)' "$vehicle"
          grep -q 'showIndividualWindows' "$vehicle"
      - name: Verify read-only OEM 2053 driving-mode button alongside EV MAX
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-driving-2053
          javac -encoding UTF-8 -d /tmp/t1-driving-2053 \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1DrivingMode2053.java \
            receiver/tests/T1DrivingMode2053Test.java
          java -cp /tmp/t1-driving-2053 ar.com.rango5gps.drivelabauto.receiver.T1DrivingMode2053Test
      - name: Verify microphone sends both Waze and Google Maps via Sender routing
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-voice-both
          javac -encoding UTF-8 -d /tmp/t1-voice-both receiver/tests/T1VoiceDualMapPendingSourceTest.java
          java -cp /tmp/t1-voice-both ar.com.rango5gps.drivelabauto.receiver.T1VoiceDualMapPendingSourceTest
      - name: Verify historical HV energy and cost-weighted km/L calculations
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-trip-accounting
          javac -encoding UTF-8 -d /tmp/t1-trip-accounting \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripCostModel.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripEnergyAudit.java \
            receiver/tests/T1TripCostModelTest.java \
            receiver/tests/T1TripEnergyAuditTest.java
          java -cp /tmp/t1-trip-accounting ar.com.rango5gps.drivelabauto.receiver.T1TripCostModelTest
          java -cp /tmp/t1-trip-accounting ar.com.rango5gps.drivelabauto.receiver.T1TripEnergyAuditTest
      - name: Verify only logged plugged electricity enters trip costs
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-plug-grid
          javac -encoding UTF-8 -d /tmp/t1-plug-grid \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripCostModel.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PlugChargeLedger.java \
            receiver/tests/T1TripCostModelTest.java \
            receiver/tests/T1PlugChargeLedgerTest.java
          java -cp /tmp/t1-plug-grid ar.com.rango5gps.drivelabauto.receiver.T1TripCostModelTest
          java -cp /tmp/t1-plug-grid ar.com.rango5gps.drivelabauto.receiver.T1PlugChargeLedgerTest
          ! grep -Fq 'evCost=hvOut*kwhPrice' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripRecorderService.java
      - name: Verify ignition mirror recovery and orange warning
        run: |
          set -euo pipefail
          mkdir -p /tmp/mirror-ignition-recovery
          javac -encoding UTF-8 -d /tmp/mirror-ignition-recovery \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/MirrorParkingPolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/MirrorBootRecoveryPolicy.java \
            receiver/tests/MirrorBootRecoveryPolicyTest.java \
            receiver/tests/MirrorBootRecoverySourceContractTest.java \
            receiver/tests/T1IgnitionMirrorRecircAndWheelTest.java \
            receiver/tests/T1MirrorUncertainRecoverySourceContractTest.java \
            receiver/tests/T1MirrorAcknowledgeClusterToggleSourceContractTest.java
          java -cp /tmp/mirror-ignition-recovery ar.com.rango5gps.drivelabauto.receiver.MirrorBootRecoveryPolicyTest
          java -cp /tmp/mirror-ignition-recovery ar.com.rango5gps.drivelabauto.receiver.MirrorBootRecoverySourceContractTest
          java -cp /tmp/mirror-ignition-recovery ar.com.rango5gps.drivelabauto.receiver.T1IgnitionMirrorRecircAndWheelTest
          java -cp /tmp/mirror-ignition-recovery ar.com.rango5gps.drivelabauto.receiver.T1MirrorUncertainRecoverySourceContractTest
          java -cp /tmp/mirror-ignition-recovery ar.com.rango5gps.drivelabauto.receiver.T1MirrorAcknowledgeClusterToggleSourceContractTest
      - name: Verify independent external charge recorder and first load import
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-charge
          javac -encoding UTF-8 -d /tmp/t1-charge \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ChargeMath.java \
            receiver/tests/T1ChargeMathTest.java \
            receiver/tests/T1ChargeAutoModuleSourceContractTest.java
          java -cp /tmp/t1-charge ar.com.rango5gps.drivelabauto.receiver.T1ChargeMathTest
          java -cp /tmp/t1-charge ar.com.rango5gps.drivelabauto.receiver.T1ChargeAutoModuleSourceContractTest
      - name: Verify automatic ignition journeys, HV and exportable GPS
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-autotrip
          javac -encoding UTF-8 -d /tmp/t1-autotrip \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1AutoDrivePolicy.java \
            receiver/tests/T1AutoDrivePolicyTest.java \
            receiver/tests/T1AutoJourneySourceContractTest.java
          java -cp /tmp/t1-autotrip ar.com.rango5gps.drivelabauto.receiver.T1AutoDrivePolicyTest
          java -cp /tmp/t1-autotrip ar.com.rango5gps.drivelabauto.receiver.T1AutoJourneySourceContractTest
      - name: Build and verify signed Receiver 0.3.56
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'bruceferra/drivelab-auto-standalone'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.55
          ! gh release view v0.3.56 >/dev/null 2>&1
          gradle --no-daemon :receiver:assembleRelease
          apk=receiver/build/outputs/apk/release/receiver-release.apk
          test -s "$apk"
          sig="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$sig" verify --print-certs "$apk"
          mkdir -p /tmp/old output
          gh release download v0.3.55 --pattern 'DriveLab-Auto-Receiver-v0.3.55.apk' --dir /tmp/old
          gh release download v0.3.55 --pattern 'sender.json' --dir output
          "$sig" verify --print-certs /tmp/old/DriveLab-Auto-Receiver-v0.3.55.apk
          before=$("$sig" verify --print-certs /tmp/old/DriveLab-Auto-Receiver-v0.3.55.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          after=$("$sig" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$before" && test "$before" = "$after"
          badge=$("$aapt" dump badging "$apk" | head -1)
          echo "$badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.receiver'"
          echo "$badge" | grep -F "versionCode='157'"
          echo "$badge" | grep -F "versionName='0.3.56'"
          name=DriveLab-Auto-Receiver-v0.3.56.apk
          cp "$apk" "output/$name"
          export RECEIVER_SHA=$(sha256sum "output/$name" | awk '{print $1}')
          python3 - <<'PY'
          import os,json
          manifest={
            'packageName':'ar.com.rango5gps.drivelabauto.receiver',
            'versionName':'0.3.56','versionCode':157,
            'sha256':os.environ['RECEIVER_SHA'],
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.3.56/DriveLab-Auto-Receiver-v0.3.56.apk'}
          assert len(manifest['sha256'])==64
          with open('output/receiver.json','w') as f:
            json.dump(manifest,f,indent=2)
          with open('output/sender.json') as f:
            sender=json.load(f)
          assert sender['versionCode']==23 and sender['versionName']=='0.2.22'
          PY
          sha256sum "output/$name" > output/receiver.sha256
      - name: Publish Receiver only and preserve Sender 0.2.22 OTA
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.55
          ! gh release view v0.3.56 >/dev/null 2>&1
          gh release create v0.3.56 \
            output/DriveLab-Auto-Receiver-v0.3.56.apk \
            output/receiver.json output/sender.json output/receiver.sha256 \
            --target "$GITHUB_SHA" --latest \
            --title 'DriveLab Auto Receiver 0.3.56 · Viajes automáticos por encendido' \
            --notes 'Receiver 0.3.56/code157: agrega registro automático de TODOS los encendidos observados por OEM 1031 READY y movimiento (1033/2148), con exclusión de cargas por cable 1060. No hace falta iniciar Viaje 1, Viaje 2 ni Total. Guarda sesiones y muestras cronológicas de GPS, SOC 1062, voltaje/corriente HV 1063/1064, rpm 1035, velocidades y marcha en SQLite privado t1_ignition_journeys.db, con integración separada kWh SALIDA, ENTRADA (frenado + generador térmico, no separables) y NETO. No extrapola gaps de Android apagado; detecta reinicios/gaps y cierra la sesión anterior a la última muestra. Arranca por BOOT_COMPLETED y al entrar en DriveLab, servicio permanente con muestras 4s viajando y 15s cuando no hay vehículo READY, opt-out en pantalla. Nuevo Cockpit -> VIAJES AUTO · ENCENDIDOS / ÚLTIMA CARGA: HOY, ESTE MES y DESDE ÚLTIMA CARGA desde SQLite de cargas propio. Muestra estimación contable de consumo procedente del enchufe, acotada por kWh registrados, SIN afirmar que puede etiquetar origen físico. Exporta SESIONES y PUNTOS GPS a CSV mediante selector Android, para reconstrucción de trayectos. No importa ni modifica la SQLite privada de T1 Launcher; recorridos anteriores a esta versión necesitan exportación anterior. Mantiene las cargas automáticas 0.3.55, espejos 0.3.54 y funciones anteriores. No reemplaza HOME del sistema ni toca Sender 0.2.22. Señal 1031 y GPS en arranque OEM requieren confirmación física.'
          mkdir -p verify
          gh release download v0.3.56 --pattern receiver.json --dir verify
          gh release download v0.3.56 --pattern sender.json --dir verify
          cmp output/receiver.json verify/receiver.json
          cmp output/sender.json verify/sender.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.56
