name: Signed Receiver 0.3.22 + Sender 0.2.21 - ignition and Bluetooth media PLAY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-vehicle-0322-0221.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      RECEIVER_STORE_PASSWORD: ${{ secrets.RECEIVER_STORE_PASSWORD }}
      RECEIVER_KEY_ALIAS: ${{ secrets.RECEIVER_KEY_ALIAS }}
      RECEIVER_KEY_PASSWORD: ${{ secrets.RECEIVER_KEY_PASSWORD }}
      SENDER_STORE_PASSWORD: ${{ secrets.SENDER_STORE_PASSWORD }}
      SENDER_KEY_ALIAS: ${{ secrets.SENDER_KEY_ALIAS }}
      SENDER_KEY_PASSWORD: ${{ secrets.SENDER_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK and signing identity
        env:
          RECEIVER_KEYSTORE_B64: ${{ secrets.RECEIVER_KEYSTORE_B64 }}
          SENDER_KEYSTORE_B64: ${{ secrets.SENDER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
          test -n "$RECEIVER_KEYSTORE_B64" && test -n "$RECEIVER_STORE_PASSWORD"
          test -n "$RECEIVER_KEY_ALIAS" && test -n "$RECEIVER_KEY_PASSWORD"
          printf %s "$RECEIVER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/receiver.p12"
          chmod 600 "$RUNNER_TEMP/receiver.p12"
          echo "RECEIVER_KEYSTORE=$RUNNER_TEMP/receiver.p12" >> "$GITHUB_ENV"
          test -n "$SENDER_KEYSTORE_B64" && test -n "$SENDER_STORE_PASSWORD"
          test -n "$SENDER_KEY_ALIAS" && test -n "$SENDER_KEY_PASSWORD"
          printf %s "$SENDER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sender.p12"
          chmod 600 "$RUNNER_TEMP/sender.p12"
          echo "SENDER_KEYSTORE=$RUNNER_TEMP/sender.p12" >> "$GITHUB_ENV"
      # UI string-contract checks handle Java concatenation in both diagnostic and action captions.
      # Mirror uncertainty regression now checks source strings independently of UI concatenation.
      # Return pulses in D continue safely even if speed crosses back below 5 km/h.
      - name: Validate source and sign Receiver 0.3.22
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'bruceferra/drivelab-auto-standalone'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.21
          ! gh release view v0.3.22 >/dev/null 2>&1
          mkdir -p /tmp/old output /tmp/mirror-tests
          gh release download v0.3.21 --pattern 'DriveLab-Auto-Receiver-v0.3.21.apk' --dir /tmp/old
          gh release download v0.2.20 --pattern 'DriveLab-Auto-Sender-v0.2.20.apk' --dir /tmp/old
          ! gh release view sender-v0.2.21 >/dev/null 2>&1
          javac -encoding UTF-8 -d /tmp/mirror-tests sender/tests/SenderMediaResumeSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.sender.SenderMediaResumeSourceContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests sender/tests/SenderAudioBootstrapSourceContractTest.java sender/tests/SenderBluetoothPickerSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.sender.SenderAudioBootstrapSourceContractTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.sender.SenderBluetoothPickerSourceContractTest
          for contract in T1IgnitionMirrorRecircAndWheelTest T1BootRouteOrderSourceTest T1WheelAutomaticBootResumeTest T1WheelBootDisplayInventoryTest T1MapsYesAndFuelVoiceSourceTest; do
            javac -encoding UTF-8 -d /tmp/mirror-tests "receiver/tests/$contract.java"
            java -cp /tmp/mirror-tests "ar.com.rango5gps.drivelabauto.receiver.$contract"
          done
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/MirrorControlsVisibilitySourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.MirrorControlsVisibilitySourceContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripMath.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1StableAutonomy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PhevTotalRange.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1Fuel500mWindow.java \
            receiver/tests/T1StableAutonomyTest.java \
            receiver/tests/T1PhevTotalRangeTest.java \
            receiver/tests/T1Fuel500mWindowTest.java \
            receiver/tests/T1StableAutonomySourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1StableAutonomyTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1PhevTotalRangeTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1Fuel500mWindowTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1StableAutonomySourceContractTest
          # Validate all bundled changes before the signed APK is published.
          javac -encoding UTF-8 -d /tmp/mirror-tests \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenWritePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocTargetCodec.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TopRowEnergyStatus.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceMath.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceIntentPolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceNewsTopic.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceSmallTalk.java \
            receiver/tests/T1VoiceSmallTalkTest.java \
            receiver/tests/T1TopRowEnergyStatusTest.java \
            receiver/tests/T1ShadowMapsSourceContractTest.java \
            receiver/tests/T1VoiceMathTest.java \
            receiver/tests/T1VoiceNewsTopicTest.java \
            receiver/tests/T1VoiceIntentWeatherTest.java \
            receiver/tests/T1VoiceIntentPolicyTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1TopRowEnergyStatusTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1ShadowMapsSourceContractTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1VoiceMathTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1VoiceSmallTalkTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1VoiceNewsTopicTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1VoiceIntentWeatherTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1VoiceIntentPolicyTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1VoiceShortcutSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1VoiceShortcutSourceContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1MirrorUncertainRecoverySourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1MirrorUncertainRecoverySourceContractTest
          grep -Fq 'PULSE_MS=140L, PAUSE_MS=20L' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/MirrorAutomationService.java
          ! grep -Fq 'PULSE_MS=120L, PAUSE_MS=40L' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/MirrorAutomationService.java
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1BootOpenSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1BootOpenSourceContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/MirrorParkingPolicy.java \
            receiver/tests/MirrorParkingPolicyTest.java
          java -cp /tmp/mirror-tests MirrorParkingPolicyTest
          # Historical trip replayer: pure kilometer-weighted category tests.
          javac -encoding UTF-8 -d /tmp/mirror-tests \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripMapPercentages.java \
            receiver/tests/T1TripMapPercentagesTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1TripMapPercentagesTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1TripMapReplaySourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1TripMapReplaySourceContractTest
          # T1 owner-provided launcher APK: verified OEM HardKey Binder + Waze display 2.
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1WheelCalibrationSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1WheelCalibrationSourceContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1WheelOemBinderSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1WheelOemBinderSourceContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1WheelOemReconnectContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1WheelOemReconnectContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1MapExitMirrorMovingContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1MapExitMirrorMovingContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1GoogleMapsReplaceSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1GoogleMapsReplaceSourceContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1WheelPanelAndSpeedSourceTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1WheelPanelAndSpeedSourceTest
          # Display5 QA now protects against global BACK and permits diagnostic text.
          # On-display Waze real prompts and safe trip/HVAC background contracts.
          javac -encoding UTF-8 -d /tmp/mirror-tests \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1WazePromptPolicy.java \
            receiver/tests/T1WazePromptPolicyTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1WazePromptPolicyTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1WheelWazeFocusedBackTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1WheelWazeFocusedBackTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1ReplayAndHvacBackgroundSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1ReplayAndHvacBackgroundSourceContractTest
          python3 -m py_compile tools/build_shadow_maps.py
          # Priority T1 body-diagnostics are read-only; preserve existing OEM probing.
          wizard=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ValidationWizardActivity.java
          vehicle=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverVehicleActivity.java
          probe=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/WiperParkingProbe.java
          grep -Fq 'new Task("pdc_front_distance"' "$wizard"
          grep -Fq 'new Task("pdc_rear_distance"' "$wizard"
          grep -Fq 'new Task("lights_tailgate"' "$wizard"
          grep -Fq 'new Task("pdc"' "$wizard"
          grep -Fq 'new Task("lights_cabin"' "$wizard"
          grep -Fq 'getStringExtra("focus_task")' "$wizard"
          grep -Fq 'case "pdc_front_distance":' "$wizard"
          grep -Fq 'case "pdc_rear_distance":' "$wizard"
          grep -Fq 'openPriorityDiagnostic("pdc_front_distance")' "$vehicle"
          grep -Fq 'openPriorityDiagnostic("pdc_rear_distance")' "$vehicle"
          grep -Fq 'openPriorityDiagnostic("wiper_auto")' "$vehicle"
          grep -Fq 'openPriorityDiagnostic("lights_tailgate")' "$vehicle"
          ! grep -Eq 'transact\\(15|\.setIntProperty\\(' "$probe" "$wizard"
          voice=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          grep -Fq '🎤 HABLAR · WAZE, CLIMA, NOTICIAS Y CUENTAS' "$voice"
          grep -Fq '🔊 PROBAR / REPETIR AUDIO' "$voice"
          grep -Fq 'USAGE_MEDIA' "$voice"
          grep -Fq 'AudioFocusRequest.Builder(' "$voice"
          grep -Fq 'UtteranceProgressListener' "$voice"
          grep -Fq 'speechReadyAt=android.os.SystemClock.uptimeMillis()+550L' "$voice"
          grep -Fq 'T1VoiceSmallTalk.answer(phrase)' "$voice"
          ! grep -Fq 'MICRÓFONO GOOGLE · REPETIR RECONOCIMIENTO' "$voice"
          ! grep -Fq 'USAR CHATGPT PARA LAS CONSULTAS' "$voice"
          ! grep -Eq 'transact\\(15|setIntProperty' "$voice"
          # Native cluster: inspect only public non-default displays, opt-in,
          # no primary window, HOME claim, projection or OEM commands.
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1ClusterWazeSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1ClusterWazeSourceContractTest
          grep -Fq 'T1ClusterWazeSettingsActivity' receiver/src/main/AndroidManifest.xml
          grep -Fq 'setLaunchDisplayId(d.getDisplayId())' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ClusterWazeRouter.java
          # Exact original APK T1N134 microphone + freeform-windowing behavior,
          # geometry clamping and no OEM/CAN writes.
          mkdir -p /tmp/t1-window-publish
          javac -encoding UTF-8 -d /tmp/t1-window-publish \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ClusterLayoutMath.java \
            receiver/tests/T1ClusterLayoutMathTest.java \
            receiver/tests/T1ClusterWindowAndMicSourceContractTest.java
          java -cp /tmp/t1-window-publish ar.com.rango5gps.drivelabauto.receiver.T1ClusterLayoutMathTest
          java -cp /tmp/t1-window-publish ar.com.rango5gps.drivelabauto.receiver.T1ClusterWindowAndMicSourceContractTest
          # Verify the exactly extracted mic 1010 callback is present
          # alongside legacy wheel 1000..1003 before signing.
          grep -Fq '(key>=1000&&key<=1003)||key==1010' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OemHardKeyBridge.java
          grep -Fq 'KEY_MIC=1010' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OemMicrophoneService.java
          # One owner-verified IHardKeyCallback, physical 1010/100 voice
          # and Waze-only 1000..1003 wheel, internal SpeechRecognizer.
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1UnifiedWheelQuietVoiceSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1UnifiedWheelQuietVoiceSourceContractTest
          # Check localhost-only ADB and exact per-display app task IDs.
          javac -encoding UTF-8 -d /tmp/mirror-tests \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1AdbTaskParser.java \
            receiver/tests/T1AdbTaskParserTest.java \
            receiver/tests/T1AdbTaskResizeSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1AdbTaskParserTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1AdbTaskResizeSourceContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests \
            receiver/tests/T1MirrorAcknowledgeClusterToggleSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1MirrorAcknowledgeClusterToggleSourceContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1ClusterOffAutobootSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1ClusterOffAutobootSourceContractTest
          # Real RSA keypair recovery + signature verification + corrupted DER guards.
          javac -encoding UTF-8 -d /tmp/mirror-tests \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1RsaPkcs8PublicSpec.java \
            receiver/tests/T1RsaPkcs8PublicSpecTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1RsaPkcs8PublicSpecTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1AdbProbePersistentSourceContractTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1AdbProbePersistentSourceContractTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1AdbAndroid11CompatibilityTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1AdbAndroid11CompatibilityTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1AdbDualPortFallbackSourceContractTest.java receiver/tests/T1VoiceCompactOemSourceContractTest.java receiver/tests/T1ClusterOnRestoreSavedSplitTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1AdbDualPortFallbackSourceContractTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1VoiceCompactOemSourceContractTest
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1ClusterOnRestoreSavedSplitTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1HeaderClockFormat.java receiver/tests/T1HeaderClockFormatTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1HeaderClockFormatTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1ClusterNoSilentFullscreenFallbackTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1ClusterNoSilentFullscreenFallbackTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/WindowGroupPolicy.java receiver/tests/T1VentilationAllPositionsTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1VentilationAllPositionsTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1WheelVoiceVentSourceTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1WheelVoiceVentSourceTest
          javac -encoding UTF-8 -d /tmp/mirror-tests receiver/tests/T1ClusterRouteResumptionSourceTest.java
          java -cp /tmp/mirror-tests ar.com.rango5gps.drivelabauto.receiver.T1ClusterRouteResumptionSourceTest
          gradle --no-daemon :receiver:assembleRelease :sender:assembleRelease
          apk=receiver/build/outputs/apk/release/receiver-release.apk
          sender_apk=sender/build/outputs/apk/release/sender-release.apk
          test -s "$apk" && test -s "$sender_apk"
          sig="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$sig" verify --print-certs "$apk"
          "$sig" verify --print-certs "$sender_apk"
          "$sig" verify --print-certs /tmp/old/DriveLab-Auto-Sender-v0.2.20.apk
          old_sender_cert=$("$sig" verify --print-certs /tmp/old/DriveLab-Auto-Sender-v0.2.20.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          new_sender_cert=$("$sig" verify --print-certs "$sender_apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$old_sender_cert" && test "$old_sender_cert" = "$new_sender_cert"
          "$sig" verify --print-certs /tmp/old/DriveLab-Auto-Receiver-v0.3.21.apk
          oldcert=$("$sig" verify --print-certs /tmp/old/DriveLab-Auto-Receiver-v0.3.21.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          newcert=$("$sig" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$oldcert" && test "$oldcert" = "$newcert"
          badge=$("$aapt" dump badging "$apk" | head -1)
          echo "$badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.receiver'"
          echo "$badge" | grep -F "versionCode='123'"
          echo "$badge" | grep -F "versionName='0.3.22'"
          sender_badge=$("$aapt" dump badging "$sender_apk" | head -1)
          echo "$sender_badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.sender'"
          echo "$sender_badge" | grep -F "versionCode='22'"
          echo "$sender_badge" | grep -F "versionName='0.2.21'"
          cp "$sender_apk" output/DriveLab-Auto-Sender-v0.2.21.apk
          export SENDER_SHA=$(sha256sum output/DriveLab-Auto-Sender-v0.2.21.apk | awk '{print $1}')
          python3 - <<'PY'
          import json,os
          m={'packageName':'ar.com.rango5gps.drivelabauto.sender',
             'versionName':'0.2.21','versionCode':22,
             'sha256':os.environ['SENDER_SHA'],
             'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/sender-v0.2.21/DriveLab-Auto-Sender-v0.2.21.apk'}
          assert len(m['sha256'])==64
          with open('output/sender.json','w') as f:json.dump(m,f,indent=2)
          PY
          sha256sum output/DriveLab-Auto-Sender-v0.2.21.apk > output/sender.sha256
          name=DriveLab-Auto-Receiver-v0.3.22.apk
          cp "$apk" "output/$name"
          export RECEIVER_SHA=$(sha256sum "output/$name" | awk '{print $1}')
          python3 - <<'PY'
          import os,json
          m={'packageName':'ar.com.rango5gps.drivelabauto.receiver',
             'versionName':'0.3.22','versionCode':123,
             'sha256':os.environ['RECEIVER_SHA'],
             'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.3.22/DriveLab-Auto-Receiver-v0.3.22.apk'}
          assert len(m['sha256'])==64
          with open('output/receiver.json','w') as f:json.dump(m,f,indent=2)
          PY
          sha256sum "output/$name" > output/receiver.sha256
      - name: Publish verified OTA (both signed apps)
        run: |
          set -euo pipefail
          # First verify the PRIOR release before creating the new tag.
