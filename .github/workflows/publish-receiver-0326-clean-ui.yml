name: Signed Receiver 0.3.26 - clean daily interface and separated technical tools
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-receiver-0326-clean-ui.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      RECEIVER_STORE_PASSWORD: ${{ secrets.RECEIVER_STORE_PASSWORD }}
      RECEIVER_KEY_ALIAS: ${{ secrets.RECEIVER_KEY_ALIAS }}
      RECEIVER_KEY_PASSWORD: ${{ secrets.RECEIVER_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK and existing signing identity
        env:
          RECEIVER_KEYSTORE_B64: ${{ secrets.RECEIVER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
          test -n "$RECEIVER_KEYSTORE_B64" && test -n "$RECEIVER_STORE_PASSWORD"
          test -n "$RECEIVER_KEY_ALIAS" && test -n "$RECEIVER_KEY_PASSWORD"
          printf %s "$RECEIVER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/receiver.p12"
          chmod 600 "$RUNNER_TEMP/receiver.p12"
          echo "RECEIVER_KEYSTORE=$RUNNER_TEMP/receiver.p12" >> "$GITHUB_ENV"
      - name: Pure geometry and wheel behavior regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-tests
          javac -encoding UTF-8 -d /tmp/t1-tests \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ClusterLayoutMath.java \
            receiver/tests/T1ClusterLayoutMathTest.java \
            receiver/tests/T1ClusterInvertedPanelsAndWheelSourceTest.java
          java -cp /tmp/t1-tests ar.com.rango5gps.drivelabauto.receiver.T1ClusterLayoutMathTest
          java -cp /tmp/t1-tests ar.com.rango5gps.drivelabauto.receiver.T1ClusterInvertedPanelsAndWheelSourceTest
          for test in MirrorControlsVisibilitySourceContractTest T1GoogleMapsReplaceSourceContractTest T1AdbTaskResizeSourceContractTest T1WheelCalibrationSourceContractTest T1WheelOemBinderSourceContractTest T1WheelOemReconnectContractTest T1UnifiedWheelQuietVoiceSourceContractTest T1WheelPanelAndSpeedSourceTest T1WheelWazeFocusedBackTest T1WheelAutomaticBootResumeTest T1WheelBootDisplayInventoryTest T1ClusterRouteResumptionSourceTest; do
            javac -encoding UTF-8 -d /tmp/t1-tests "receiver/tests/$test.java"
            java -cp /tmp/t1-tests "ar.com.rango5gps.drivelabauto.receiver.$test"
          done
      - name: Assert minimal daily UI and all diagnostics still reachable
        run: |
          set -euo pipefail
          hub=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverActivity.java
          cluster=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ClusterWazeSettingsActivity.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          vehicle=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverVehicleActivity.java
          grep -q 'MENÚ TÉCNICO · PRUEBAS Y AJUSTES' "$hub"
          grep -q 'quickControls.attach(oldControls)' "$hub"
          grep -q 'CONFIGURAR PANELES A/B · APLICAR' "$cluster"
          grep -q 'if(showTechnical)' "$cluster"
          grep -q 'MENÚ TÉCNICO · PRUEBAS OEM' "$cockpit"
          grep -q 'advanced.addView(extra)' "$cockpit"
          grep -q 'renderWiperAndRadarDiagnostics(body)' "$vehicle"
          grep -q 'renderMirrorTechnical(body)' "$vehicle"
          grep -q 'showIndividualWindows' "$vehicle"
      - name: Build and verify signed Receiver 0.3.26
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'bruceferra/drivelab-auto-standalone'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.25
          ! gh release view v0.3.26 >/dev/null 2>&1
          gradle --no-daemon :receiver:assembleRelease
          apk=receiver/build/outputs/apk/release/receiver-release.apk
          test -s "$apk"
          sig="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$sig" verify --print-certs "$apk"
          mkdir -p /tmp/old output
          gh release download v0.3.25 --pattern 'DriveLab-Auto-Receiver-v0.3.25.apk' --dir /tmp/old
          gh release download v0.3.25 --pattern 'sender.json' --dir output
          "$sig" verify --print-certs /tmp/old/DriveLab-Auto-Receiver-v0.3.25.apk
          before=$("$sig" verify --print-certs /tmp/old/DriveLab-Auto-Receiver-v0.3.25.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          after=$("$sig" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$before" && test "$before" = "$after"
          badge=$("$aapt" dump badging "$apk" | head -1)
          echo "$badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.receiver'"
          echo "$badge" | grep -F "versionCode='127'"
          echo "$badge" | grep -F "versionName='0.3.26'"
          name=DriveLab-Auto-Receiver-v0.3.26.apk
          cp "$apk" "output/$name"
          export RECEIVER_SHA=$(sha256sum "output/$name" | awk '{print $1}')
          python3 - <<'PY'
          import os,json
          manifest={
            'packageName':'ar.com.rango5gps.drivelabauto.receiver',
            'versionName':'0.3.26','versionCode':127,
            'sha256':os.environ['RECEIVER_SHA'],
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.3.26/DriveLab-Auto-Receiver-v0.3.26.apk'}
          assert len(manifest['sha256'])==64
          with open('output/receiver.json','w') as f:
            json.dump(manifest,f,indent=2)
          with open('output/sender.json') as f:
            sender=json.load(f)
          assert sender['versionCode']==22 and sender['versionName']=='0.2.21'
          PY
          sha256sum "output/$name" > output/receiver.sha256
      - name: Publish Receiver only and preserve Sender 0.2.21 OTA
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.25
          ! gh release view v0.3.26 >/dev/null 2>&1
          gh release create v0.3.26 \
            output/DriveLab-Auto-Receiver-v0.3.26.apk \
            output/receiver.json output/sender.json output/receiver.sha256 \
            --target "$GITHUB_SHA" --latest \
            --title 'DriveLab Auto Receiver 0.3.26 · interfaz simple y menú técnico separado' \
            --notes 'Receiver 0.3.26 / code127: Pantalla diaria con Cockpit, Cluster Paneles A/B y Vehiculo. Menus repetidos del toolbar y el cockpit ocultos; diagnósticos y pruebas OEM en un unico Menu Tecnico; pruebas de limpiaparabrisas, radares, HAL, grabacion de marchas y control espejo avanzado retiradas de la pagina Vehiculo diaria pero conservadas en Tecnico. Ventanillas individuales plegadas hasta solicitarlas. Cluster viejo de pruebas oculto bajo menu tecnico sin perder su funcionalidad. Se mantienen preferencias, datos, viajes y configuraciones existentes. Sender: corrige rutas Waze/Maps para que no se rechacen solo por ADB sin bounds confirmados; deteccion de boton Iniciar en Google Maps unicamente bajo solicitud nueva y botones accesibles verificados, sin toque global. Compilacion y tests no garantizan comportamiento OEM de Jetour, se requiere prueba fisica en P. Sender 0.2.21 sin cambios.'
          mkdir -p verify
          gh release download v0.3.26 --pattern receiver.json --dir verify
          gh release download v0.3.26 --pattern sender.json --dir verify
          cmp output/receiver.json verify/receiver.json
          cmp output/sender.json verify/sender.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.26
