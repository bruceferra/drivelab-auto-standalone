name: Receiver voice assistant · Gemini ChatGPT Waze routing
on:
  push:
    branches: [main]
    paths:
      - 'receiver/**'
      - '.github/workflows/receiver-voice-ci.yml'
  pull_request:
    paths:
      - 'receiver/**'
      - '.github/workflows/receiver-voice-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM tests of Waze-vs-AI natural speech routing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-voice-route
          javac -encoding UTF-8 -d /tmp/t1-voice-route \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceMath.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceIntentPolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceNewsTopic.java \
            receiver/tests/T1VoiceMathTest.java \
            receiver/tests/T1VoiceNewsTopicTest.java \
            receiver/tests/T1VoiceIntentWeatherTest.java \
            receiver/tests/T1VoiceIntentPolicyTest.java
          java -cp /tmp/t1-voice-route ar.com.rango5gps.drivelabauto.receiver.T1VoiceMathTest
          java -cp /tmp/t1-voice-route ar.com.rango5gps.drivelabauto.receiver.T1VoiceNewsTopicTest
          java -cp /tmp/t1-voice-route ar.com.rango5gps.drivelabauto.receiver.T1VoiceIntentWeatherTest
          java -cp /tmp/t1-voice-route ar.com.rango5gps.drivelabauto.receiver.T1VoiceIntentPolicyTest
          javac -encoding UTF-8 -d /tmp/t1-voice-route receiver/tests/T1VoiceShortcutSourceContractTest.java
          java -cp /tmp/t1-voice-route ar.com.rango5gps.drivelabauto.receiver.T1VoiceShortcutSourceContractTest
      - name: Compile Receiver with integrated microphone
        run: gradle --no-daemon :receiver:assembleDebug
      - name: Verify voice integration is packaged and safe
        shell: bash
        run: |
          set -euo pipefail
          test -s receiver/build/outputs/apk/debug/receiver-debug.apk
          test -f receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          grep -Fq 'android:name=".T1VoiceRouteActivity"' receiver/src/main/AndroidManifest.xml
          grep -Fq 'RecognizerIntent.ACTION_RECOGNIZE_SPEECH' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          grep -Fq 'T1VoiceMath.calculate(phrase)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          grep -Fq 'T1VoiceWeather.now(' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          grep -Fq 'T1VoiceFootball.latestSanLorenzo()' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          grep -Fq 'T1VoiceNews.headlines(' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          grep -Fq 'speaker.speak(' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          grep -Fq 'T1VoiceIntentPolicy.routeDestination(phrase)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          grep -Fq 'setPackage("com.waze")' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          grep -Fq 'android.permission.RECORD_AUDIO' receiver/src/main/AndroidManifest.xml
          grep -Fq 'com.google.android.apps.bard' receiver/src/main/AndroidManifest.xml
          grep -Fq 'com.openai.chatgpt' receiver/src/main/AndroidManifest.xml
          grep -Fq 'T1PremiumCockpitActivity.class' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverQuickControls.java
          ! grep -E 'transact\(15|setIntData|setCarProperty|1040,|1041,' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging receiver/build/outputs/apk/debug/receiver-debug.apk | grep "ar.com.rango5gps.drivelabauto.receiver"
