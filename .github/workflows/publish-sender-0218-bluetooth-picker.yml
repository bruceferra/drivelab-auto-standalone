name: Signed Sender 0.2.18 - visible paired Jetour Bluetooth picker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-sender-0218-bluetooth-picker.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-drivelabauto-publication
  cancel-in-progress: false
jobs:
  sender-picker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SENDER_STORE_PASSWORD: ${{ secrets.SENDER_STORE_PASSWORD }}
      SENDER_KEY_ALIAS: ${{ secrets.SENDER_KEY_ALIAS }}
      SENDER_KEY_PASSWORD: ${{ secrets.SENDER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK 35 and permanent Sender signing certificate
        shell: bash
        env:
          SENDER_KEYSTORE_B64: ${{ secrets.SENDER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
          test -n "$SENDER_KEYSTORE_B64" && test -n "$SENDER_STORE_PASSWORD"
          test -n "$SENDER_KEY_ALIAS" && test -n "$SENDER_KEY_PASSWORD"
          printf %s "$SENDER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sender.p12"
          chmod 600 "$RUNNER_TEMP/sender.p12"
          echo "SENDER_KEYSTORE=$RUNNER_TEMP/sender.p12" >> "$GITHUB_ENV"
      - name: Compile source tests and sign Sender only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = bruceferra/drivelab-auto-standalone
          echo 'Verificando release histórico v0.2.18…'
          gh release view v0.2.18 --json tagName --jq .tagName
          test "$(gh release view v0.2.18 --json tagName --jq .tagName)" = "v0.2.18"
          if gh release view v0.2.18 --json assets --jq '.assets[].name' | grep -Fxq 'DriveLab-Auto-Sender-v0.2.18.apk'; then
            echo 'Error: ya está publicado Sender 0.2.18; no sobrescribir APK firmada'
            exit 1
          fi
          echo 'Histórico OK; descargando firma Sender previa…'
          mkdir -p /tmp/sender-old /tmp/sender-tests output
          gh release download v0.2.17 --pattern 'DriveLab-Auto-Sender-v0.2.17.apk' --dir /tmp/sender-old
          echo 'Firma anterior descargada; ejecutando contrato de selector…'
          javac -encoding UTF-8 -d /tmp/sender-tests \
            sender/tests/SenderAudioBootstrapSourceContractTest.java \
            sender/tests/SenderBluetoothPickerSourceContractTest.java
          java -cp /tmp/sender-tests ar.com.rango5gps.drivelabauto.sender.SenderAudioBootstrapSourceContractTest
          java -cp /tmp/sender-tests ar.com.rango5gps.drivelabauto.sender.SenderBluetoothPickerSourceContractTest
          echo 'Contratos Sender pasados; compilando APK firmada…'
          gradle --no-daemon :sender:assembleRelease
          apk=sender/build/outputs/apk/release/sender-release.apk
          test -s "$apk"
          sig="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$sig" verify --print-certs "$apk"
          previous=/tmp/sender-old/DriveLab-Auto-Sender-v0.2.17.apk
          "$sig" verify --print-certs "$previous"
          oldcert=$("$sig" verify --print-certs "$previous" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          newcert=$("$sig" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$oldcert" && test "$oldcert" = "$newcert"
          badge=$("$aapt" dump badging "$apk" | head -1)
          echo "$badge" | grep -F "package: name='ar.com.rango5gps.drivelabauto.sender'"
          echo "$badge" | grep -F "versionCode='19'"
          echo "$badge" | grep -F "versionName='0.2.18'"
          "$aapt" dump permissions "$apk" | grep -F 'android.permission.BLUETOOTH_CONNECT'
          cp "$apk" output/DriveLab-Auto-Sender-v0.2.18.apk
          export SENDER_SHA=$(sha256sum output/DriveLab-Auto-Sender-v0.2.18.apk | awk '{print $1}')
          python3 - <<'PY'
          import json,os
          sha=os.environ['SENDER_SHA']
          assert len(sha)==64
          m={"packageName":"ar.com.rango5gps.drivelabauto.sender",
             "versionName":"0.2.18","versionCode":19,"sha256":sha,
             "apkUrl":"https://github.com/bruceferra/drivelab-auto-standalone/releases/download/v0.2.18/DriveLab-Auto-Sender-v0.2.18.apk"}
          with open("output/sender.json","w") as f:json.dump(m,f,indent=2)
          PY
          sha256sum output/DriveLab-Auto-Sender-v0.2.18.apk > output/sender.sha256
      - name: Publish historical Sender asset and promote current OTA sender manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = bruceferra/drivelab-auto-standalone
          # Historical v0.2.18 is a Receiver release; keep its original metadata,
          # original receiver assets and latest-release selection untouched.
          ! gh release view v0.2.18 --json assets --jq '.assets[].name' | grep -Fxq 'DriveLab-Auto-Sender-v0.2.18.apk'
          gh release upload v0.2.18 output/DriveLab-Auto-Sender-v0.2.18.apk
          mkdir -p verify
          gh release download v0.2.18 --pattern 'DriveLab-Auto-Sender-v0.2.18.apk' --dir verify
          cmp output/DriveLab-Auto-Sender-v0.2.18.apk verify/DriveLab-Auto-Sender-v0.2.18.apk
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          case "$latest" in v0.3.*) ;; *) echo "Unexpected latest Receiver tag: $latest"; exit 1 ;; esac
          # Updater reads sender.json from CURRENT latest Receiver release;
          # update ONLY this one asset, preserve receiver.json and APK.
          gh release upload "$latest" output/sender.json --clobber
          gh release download "$latest" --pattern sender.json --dir verify --clobber
          cmp output/sender.json verify/sender.json
          python3 - <<'PY'
          import json
          with open('verify/sender.json') as f: m=json.load(f)
          assert m['packageName']=='ar.com.rango5gps.drivelabauto.sender'
          assert m['versionCode']==19 and m['versionName']=='0.2.18'
          PY
          echo "Signed Sender 0.2.18 published; Receiver latest release kept as $latest"
