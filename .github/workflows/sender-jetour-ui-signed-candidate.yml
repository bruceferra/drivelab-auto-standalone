name: Sender Xiaomi Jetour UI 0.2.25 — signed candidate (NO OTA)
on:
  push:
    branches: [feature/sender-xiaomi-jetour-ui-20261122]
    paths:
      - 'sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/SenderActivity.java'
      - '.github/workflows/sender-jetour-ui-signed-candidate.yml'
permissions:
  contents: read
  actions: read
jobs:
  sender-signed:
    if: github.repository == 'bruceferra/drivelab-auto-standalone'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SENDER_STORE_PASSWORD: ${{ secrets.SENDER_STORE_PASSWORD }}
      SENDER_KEY_ALIAS: ${{ secrets.SENDER_KEY_ALIAS }}
      SENDER_KEY_PASSWORD: ${{ secrets.SENDER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify exact original Sender source and diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse sender-v0.2.0^{commit})" = ed1f8c62e309abe259eb0627e0330e12429e5814
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          changed=set(subprocess.check_output(
              ['git','diff','--name-only','sender-v0.2.0','HEAD'],
              text=True).splitlines())
          expected={
            '.github/workflows/sender-jetour-ui-preview.yml',
            '.github/workflows/sender-jetour-ui-signed-candidate.yml',
            'sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/SenderActivity.java'}
          assert changed==expected,('BLOCKED sender unrelated changes',changed^expected)
          ui=Path('sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/SenderActivity.java').read_text()
          for x in ['targetChip(','BridgeRouteTarget.BOTH',
                    'SenderRouteTarget.choose(this,target)',
                    'SenderClient.reconnect(this)',
                    'SenderAudioBootstrap.resumeLastMedia(',
                    'SenderClient.finishPairing(this,',
                    'this::scanPairQr', 'this::chooseNavigationTarget',
                    'this::chooseT1LauncherRouteTrial',
                    'SenderClient.send(this,']:
              assert x in ui,('BLOCKED required sender behavior lost',x)
          assert "versionName '0.2.24'" in Path('sender/build.gradle').read_text()
          assert "versionCode 25" in Path('sender/build.gradle').read_text()
          print('PASS original sender-v0.2.0 source baseline, ONLY cosmetic UI changed')
          PY
      - name: SDK 35 and Sender original signing key
        shell: bash
        env:
          SENDER_KEYSTORE_B64: ${{ secrets.SENDER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          sdkmanager=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          test -n "$SENDER_KEYSTORE_B64" && test -n "$SENDER_STORE_PASSWORD"
          test -n "$SENDER_KEY_ALIAS" && test -n "$SENDER_KEY_PASSWORD"
          printf %s "$SENDER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sender.p12"
          chmod 600 "$RUNNER_TEMP/sender.p12"
          echo "SENDER_KEYSTORE=$RUNNER_TEMP/sender.p12" >> "$GITHUB_ENV"
      - name: Compare live Sender APK identity and sign cosmetic update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sender25 prior
          gh release download sender-v0.2.0             --pattern 'DriveLab-Auto-Sender-v0.2.0.apk' --dir prior
          old=prior/DriveLab-Auto-Sender-v0.2.0.apk
          test -s "$old"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --print-certs "$old"
          baseline=$("$aapt" dump badging "$old" | head -1)
          echo "$baseline"
          echo "$baseline" | grep -F "package: name='ar.com.rango5gps.drivelabauto.sender'"
          echo "$baseline" | grep -F "versionName='0.2.0'"
          old_code=$(echo "$baseline" | sed -E "s/.*versionCode='([0-9]+)'.*/\1/")
          test "$old_code" -lt 26 || {
            echo "BLOCKED: new code26 is not greater than installed code $old_code" >&2; exit 1;
          }
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sender/build.gradle')
          s=p.read_text()
          assert s.count('versionCode 25')==1
          assert s.count("versionName '0.2.24'")==1
          p.write_text(s.replace('versionCode 25','versionCode 26')
              .replace("versionName '0.2.24'","versionName '0.2.25'"))
          PY
          javac -encoding UTF-8 -d /tmp             sender/tests/SenderShareHeadlessSourceContractTest.java
          java -cp /tmp             ar.com.rango5gps.drivelabauto.sender.SenderShareHeadlessSourceContractTest
          gradle --no-daemon :sender:assembleRelease
          signed=sender/build/outputs/apk/release/sender-release.apk
          test -s "$signed"
          "$apksigner" verify --print-certs "$signed"
          old_cert=$("$apksigner" verify --print-certs "$old" |
            awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          new_cert=$("$apksigner" verify --print-certs "$signed" |
            awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | head -1)
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          "$aapt" dump badging "$signed" | grep -F             "package: name='ar.com.rango5gps.drivelabauto.sender' versionCode='26' versionName='0.2.25'"
          cp "$signed" dist/sender25/DriveLab-Auto-Sender-v0.2.25.apk
          (cd dist/sender25; sha256sum DriveLab-Auto-Sender-v0.2.25.apk > SHA256SUMS)
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          d=Path('dist/sender25')
          apk=d/'DriveLab-Auto-Sender-v0.2.25.apk'
          m={
            'packageName':'ar.com.rango5gps.drivelabauto.sender',
            'versionName':'0.2.25','versionCode':26,
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/sender-v0.2.25/'+apk.name}
          (d/'sender.json').write_text(json.dumps(m,indent=2)+'\n',encoding='utf8')
          assert apk.is_file() and apk.stat().st_size>1000000
          print('PASS original Sender certificate and code26 identity; NO OTA released')
          PY
      - name: Upload original-signed candidate privately (NO RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: Sender-JetourUI-v0.2.25-SIGNED-CANDIDATE-NO-OTA
          path: dist/sender25/
          if-no-files-found: error
          retention-days: 14
