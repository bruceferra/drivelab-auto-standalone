name: DriveLab Bridge · Jetour MODE read-only forensic tests
on:
  pull_request:
    paths:
      - 'boot/src/main/java/ar/com/rango5gps/drivelabauto/boot/BridgeModeLayerDiff.java'
      - 'boot/src/main/java/ar/com/rango5gps/drivelabauto/boot/BridgeAdbReadOnly.java'
      - 'boot/src/main/java/ar/com/rango5gps/drivelabauto/boot/BridgeLayersActivity.java'
      - 'boot/tests/BridgeModeLayerDiffTest.java'
      - '.github/workflows/bridge-mode-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test A/B Jetour MODE overlay parser with fixture
        run: |
          set -euo pipefail
          mkdir -p /tmp/jetour-mode-layer-test
          javac -encoding UTF-8 -d /tmp/jetour-mode-layer-test \
            boot/src/main/java/ar/com/rango5gps/drivelabauto/boot/BridgeModeLayerDiff.java \
            boot/tests/BridgeModeLayerDiffTest.java
          java -cp /tmp/jetour-mode-layer-test \
            ar.com.rango5gps.drivelabauto.boot.BridgeModeLayerDiffTest
      - name: No map data wipe or OEM window mutation in diagnostic
        run: |
          set -euo pipefail
          if grep -nE 'pm clear|am force-stop|settings put|am task resize|input keyevent' \
            boot/src/main/java/ar/com/rango5gps/drivelabauto/boot/BridgeAdbReadOnly.java; then
            echo 'Destructive command in read-only diagnostic' >&2
            exit 1
          fi
          echo 'PASS: no mutating ADB command in Bridge diagnostic'
