name: DriveLab Auto Standalone · QA independiente
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Protocol security regression (no Android runtime needed)
        run: |
          mkdir -p /tmp/bridge-test
          javac -encoding UTF-8 -d /tmp/bridge-test \
            common/src/main/java/ar/com/rango5gps/drivelabauto/common/BridgeCrypto.java \
            common/tests/BridgeCryptoTest.java \
            common/tests/BridgeCryptoClockSkewTest.java
          java -cp /tmp/bridge-test BridgeCryptoTest
          java -cp /tmp/bridge-test ar.com.rango5gps.drivelabauto.common.BridgeCryptoClockSkewTest
          javac -encoding UTF-8 -d /tmp/bridge-test \
            common/tests/android/net/Uri.java \
            common/src/main/java/ar/com/rango5gps/drivelabauto/common/MapLinks.java \
            common/tests/MapLinksTest.java
          java -cp /tmp/bridge-test MapLinksTest
      - name: T1 tank two-cycle evidence regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tank-evidence-test
          javac -encoding UTF-8 -d /tmp/tank-evidence-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TankEvidence.java \
            receiver/tests/T1TankEvidenceTest.java
          java -cp /tmp/tank-evidence-test T1TankEvidenceTest
      - name: CI186 fuel display two decimals regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuel-display-test
          javac -encoding UTF-8 -d /tmp/fuel-display-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1FuelDisplay.java \
            receiver/tests/T1FuelDisplayTest.java
          java -cp /tmp/fuel-display-test T1FuelDisplayTest
      - name: Optimizer percentages are exclusively 5 to 100 touch dropdowns
        shell: bash
        run: |
          set -euo pipefail
          editor=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeActivity.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'private static final int PCT_MIN=5,PCT_STEP=5,PCT_COUNT=20' "$editor"
          grep -Fq 'p.targetMinimum=percentageSelector(existing.minBattery);' "$editor"
          grep -Fq 'p.forced=forcedSocSelector(existing.forcedSoc);' "$editor"
          grep -Fq 'int[] allowed=T1SocRegenWritePolicy.forcedSocPresets();' "$editor"
          grep -Fq 'power,strategy,forcedSocValue(p.forced)' "$editor"
          grep -Fq 'p.targetMinimum=percentageSelector(existing.minBattery);' "$editor"
          grep -Fq 'private int percentage(Spinner spinner)' "$editor"
          ! grep -Eq '(EditText|InputType|TYPE_CLASS_NUMBER)' "$editor"
          grep -Fq 'lastUiStats>=2400L' "$cockpit"
          grep -Fq 'if(!android.text.TextUtils.equals(' "$cockpit"
          grep -Fq 'T1-Cockpit-Continuity-Background' "$cockpit"
          grep -Fq 'private void maybeReconcileContinuity()' "$cockpit"
          grep -Fq 'private void updateStats(){' "$cockpit"
          grep -Fq '        maybeReconcileContinuity();' "$cockpit"
      - name: Cockpit full-system RAM/CPU and recovering NAV touch telemetry
        shell: bash
        run: |
          set -euo pipefail
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          monitor=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SystemLoadMonitor.java
          grep -Fq 'manager.getMemoryInfo(mem)' "$monitor"
          grep -Fq 'mem.totalMem,mem.availMem' "$monitor"
          grep -Fq 'Process.getElapsedCpuTime()' "$monitor"
          grep -Fq 'new FileReader("/proc/stat")' "$monitor"
          grep -Fq 'Debug.getPss()' "$monitor"
          grep -Fq 'uiLagNow=Math.max(0,now-monitorExpectedAt)' "$cockpit"
          grep -Fq 'dispatchTouchEvent(MotionEvent event)' "$cockpit"
          grep -Fq 'navTouchDowns++' "$cockpit"
          grep -Fq 'modeTouchDowns++' "$cockpit"
          grep -Fq 'navButtonClicks++' "$cockpit"
          grep -Fq 'root.removeView(modes);' "$cockpit"
          grep -Fq 'fixedBody.addView(modes,' "$cockpit"
          grep -Fq 'fixedBody.addView(top,' "$cockpit"
          grep -Fq 'roadTransitionPopup=null;' "$cockpit"
          grep -Fq 'SISTEMA RAM/CPU' "$cockpit"
          grep -Fq 'RESCATE OPT' "$cockpit"
          grep -Fq 'RESCATE INICIO' "$cockpit"
          ! grep -Fq 'cockpitFrame.addView(roadTransitionPopup' "$cockpit"
      - name: Cockpit touch guard - fixed header, stable history, background I/O
        shell: bash
        run: |
          set -euo pipefail
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'root.removeView(top);' "$cockpit"
          grep -Fq 'fixedBody.addView(top,' "$cockpit"
          grep -Fq 'fixedBody.addView(scroll,' "$cockpit"
          grep -Fq 'historyEcoStatus.setTextIsSelectable(false);' "$cockpit"
          grep -Fq 'historyEcoStatus.setFocusable(false);' "$cockpit"
          grep -Fq 'scroll.setDescendantFocusability(' "$cockpit"
          grep -Fq 'secondary.getVisibility()==android.view.View.VISIBLE' "$cockpit"
          grep -Fq 'historyUiBusy.compareAndSet(false,true)' "$cockpit"
          grep -Fq 'new Thread(()->{' "$cockpit"
          grep -Fq 'snapshot=loadHistorySnapshot();' "$cockpit"
          grep -Fq 'ui.post(()->{' "$cockpit"
          grep -Fq 'if(!snapshot.signature.equals(renderedHistorySignature))' "$cockpit"
          grep -Fq 'button.setFocusable(false);' "$cockpit"
          grep -Fq 'paintHistoryButtons();' "$cockpit"
      - name: Cockpit live consumption must NOT depend on recording a trip
        shell: bash
        run: |
          set -euo pipefail
          callbacks=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OemConsumptionCallbacks.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'boolean startForCockpit()' "$callbacks"
          grep -Fq 'logFile=cockpitMode?null:file' "$callbacks"
          grep -Fq 'if(tripMode||cockpitMode)' "$callbacks"
          grep -Fq '.putString("source",tripMode?"TRIP":"COCKPIT")' "$callbacks"
          grep -Fq 'if(tripFeeding)' "$cockpit"
          grep -Fq 'if(passive.startForCockpit())dashboardConsumption=passive;' "$cockpit"
          grep -Fq 'dashboardConsumption.stop();' "$cockpit"
          grep -Fq 'maintainFuelMonitor();' "$cockpit"
          grep -Fq 'new T1TripTelemetry(' "$cockpit"
      - name: OEM 500m paired fuel, energy and distance audit (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oem-segment-test
          javac -encoding UTF-8 -d /tmp/oem-segment-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SegmentConsumption.java \
            receiver/tests/T1SegmentConsumptionTest.java
          java -cp /tmp/oem-segment-test ar.com.rango5gps.drivelabauto.receiver.T1SegmentConsumptionTest
          grep -q 'MAX_BATCHES_PER_FILE=4' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripSync.java
          grep -q 'b.getName().compareTo(a.getName())' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripSync.java
      - name: T1 passenger checkpoint ledger and GPS advisory regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-journey-test
          javac -encoding UTF-8 -d /tmp/t1-journey-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1JourneyMetrics.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ZonePolicy.java \
            receiver/tests/T1JourneyMetricsTest.java \
            receiver/tests/T1ZonePolicyTest.java
          java -cp /tmp/t1-journey-test ar.com.rango5gps.drivelabauto.receiver.T1JourneyMetricsTest
          java -cp /tmp/t1-journey-test ar.com.rango5gps.drivelabauto.receiver.T1ZonePolicyTest
          # The new cockpit must NEVER issue arbitrary OEM setters or mode writes.
          ! grep -E 'transact\(15|setInt\(|setFloat\(' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ModeZoneStore.java
          grep -q 'T1PremiumCockpitActivity' receiver/src/main/AndroidManifest.xml
      - name: Eco trip speed bins, OSM coverage and live 500m autonomy (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-eco-rating
          javac -encoding UTF-8 -d /tmp/t1-eco-rating \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1EcoTripMetrics.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TrafficFlowPolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1LiveConsumption.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripMath.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ExperimentalRange.java \
            receiver/tests/T1EcoTripMetricsTest.java \
            receiver/tests/T1TrafficFlowPolicyTest.java \
            receiver/tests/T1LiveConsumptionTest.java
          java -cp /tmp/t1-eco-rating ar.com.rango5gps.drivelabauto.receiver.T1EcoTripMetricsTest
          java -cp /tmp/t1-eco-rating ar.com.rango5gps.drivelabauto.receiver.T1TrafficFlowPolicyTest
          java -cp /tmp/t1-eco-rating ar.com.rango5gps.drivelabauto.receiver.T1LiveConsumptionTest
          grep -Fq 'eco.sample(s.timestamp,measure.km,dt' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripRecorderService.java
          grep -Fq 'historyEcoStatus.setText' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'T1EcoTripMonitor.live(this,ecoScope)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
      - name: OEM SOC/regen verified-only auto-write policy (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/soc-regen-policy
          javac -encoding UTF-8 -d /tmp/soc-regen-policy \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenWritePolicy.java \
            receiver/tests/T1SocRegenWritePolicyTest.java
          java -cp /tmp/soc-regen-policy ar.com.rango5gps.drivelabauto.receiver.T1SocRegenWritePolicyTest
          code=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenPilot.java
          grep -Fq 'data.writeInt(target);' "$code"
          grep -Fq 'preflight(b,"SOC_REGEN_ANTES_"' "$code"
          grep -Fq 'regenDriveEligible(gear,speed)' "$code"
          grep -Fq 'verify(b,id,target,active)' "$code"
          grep -Fq 'set(b,id,previous,null)' "$code"
          ! grep -Fq 'boolean test(' "$code"
          grep -Fq 'boolean apply(' "$code"
      - name: T1 cockpit client reset, live autonomy, engine and SOC policy (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-cockpit-test
          javac -encoding UTF-8 -d /tmp/t1-cockpit-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripMath.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1JourneyMetrics.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ZonePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1CockpitScope.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PowerFlowPolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ExperimentalRange.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevPolicy.java \
            receiver/tests/T1CockpitLiveTest.java
          java -cp /tmp/t1-cockpit-test ar.com.rango5gps.drivelabauto.receiver.T1CockpitLiveTest
          # Exactly one manual EV→HEV mode target, no GPS or background write.
          grep -q 'POWER_MODE_ID=1043,HEV=2' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevPolicy.java
          grep -q 'checkStopped(b,confirmedMode,"CONTROL_2")' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevExperiment.java
          grep -q 'd.writeInt(T1ManualHevPolicy.HEV)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevExperiment.java
          ! grep -E 'transact\(15|setInt\(' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ModeZoneStore.java
          grep -q 'LAST_SAMPLE_TIME' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripRecorderService.java
          grep -q 'T1JourneyStore.fulfillPending' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripRecorderService.java
      - name: EV/HEV trace and cabin light read-only boundaries (static)
        shell: bash
        run: |
          set -euo pipefail
          # A new light probe must perform NO property setter or unsafe OEM write.
          ! grep -E 'transact\(15|writeHev|setProperty\(' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1CabinLightReadOnlyProbe.java
          grep -q 'b.transact(2,in,out,0)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1CabinLightReadOnlyProbe.java
          grep -q 'T1OemDiagnosticLog.add(app,"CONTROL_1"' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevExperiment.java || \
          grep -q 'checkStopped(b,mode,"CONTROL_1")' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevExperiment.java
          grep -q 'NO SE ENVIÓ COMANDO' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'DIAGNOSTICAR · NO ESCRIBE' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'CAPTURA A · ANTES' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'CAPTURA B · DESPUÉS' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          # The 12V probe only reads IALCar properties from our fixed catalog.
          ! grep -E 'transact\(15|setInt\(|writeProperty|setProperty' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1Aux12vReadOnlyProbe.java
          grep -q 'b.transact(2,data,reply,0)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1Aux12vReadOnlyProbe.java
          grep -q 'b.transact(9,data,reply,0)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1Aux12vReadOnlyProbe.java
          grep -q 'LEER 12 V' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
      - name: Jetour T1 immersive fullscreen and reversible navigation bars
        shell: bash
        run: |
          set -euo pipefail
          test -f receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          test -f receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveActivity.java
          for activity in ReceiverActivity ReceiverVehicleActivity T1PremiumCockpitActivity T1TankDashboardActivity; do
            grep -q "class $activity extends T1ImmersiveActivity" \
              "receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/$activity.java"
          done
          grep -q 'FLAG_FULLSCREEN' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          grep -q 'SYSTEM_UI_FLAG_IMMERSIVE_STICKY' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          grep -q 'setDecorFitsSystemWindows(false)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          grep -q 'WindowInsets.Type.navigationBars()' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          grep -q 'setDecorFitsSystemWindows(true)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          grep -q 'T1ImmersiveMode.setEnabled(this' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverActivity.java
          grep -q 'T1ImmersiveMode.setEnabled(this' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          ! grep -E 'CATEGORY_HOME|WRITE_SECURE_SETTINGS|SYSTEM_ALERT_WINDOW.*new' \
            receiver/src/main/AndroidManifest.xml
      - name: Mirror parking R/D policy regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mirror-parking-policy-test
          javac -encoding UTF-8 -d /tmp/mirror-parking-policy-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/MirrorParkingPolicy.java \
            receiver/tests/MirrorParkingPolicyTest.java
          java -cp /tmp/mirror-parking-policy-test MirrorParkingPolicyTest
      - name: T1 fuel autonomy and recirculation regressions (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-trip-test
          javac -encoding UTF-8 -d /tmp/t1-trip-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripMath.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/RecirculationPolicy.java \
            receiver/tests/T1TripMathTest.java \
            receiver/tests/RecirculationPolicyTest.java
          java -cp /tmp/t1-trip-test T1TripMathTest
          java -cp /tmp/t1-trip-test RecirculationPolicyTest
      - name: T1 voice-overlay safe area and immersive regression (static)
        shell: bash
        run: |
          set -euo pipefail
          base=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveActivity.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          hub=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverActivity.java
          grep -q 'DEFAULT_CLEAR_HEIGHT_DP=112' "$base"
          grep -q 'HEIGHTS_DP={0,80,112,144,176}' "$base"
          grep -q 'getSharedPreferences(CLEAR_PREFS' "$base"
          grep -q 'shell.addView(blank' "$base"
          grep -q 'shell.addView(content' "$base"
          grep -q 'super.setContentView(shell)' "$base"
          grep -q 'overlayClearBackgroundColor(){return BG;}' "$cockpit"
          grep -q 'cycleClearanceDp()' "$cockpit"
          grep -q 'cycleClearanceDp()' "$hub"
          grep -q 'T1ImmersiveMode.apply(this)' "$base"
          ! grep -E 'SYSTEM_ALERT_WINDOW|WRITE_SECURE_SETTINGS|policy_control|killBackgroundProcesses' "$base"
      - name: Rear seat light area read-only and cockpit thermal motor instrumentation
        shell: bash
        run: |
          set -euo pipefail
          seat=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1RearSeatLightsProbe.java
          thermal=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ThermalMotorProbe.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'AREAS={0,16,32,64}' "$seat"
          grep -q 'IDS={356519683,356519684}' "$seat"
          grep -q 'binder.transact(2,data,reply,0)' "$seat"
          grep -q 'new Candidate(291504897' "$thermal"
          grep -q 'new Candidate(557860127' "$thermal"
          grep -q 'new Candidate(557867145' "$thermal"
          grep -q 'binder.transact(9,d,r,0)' "$thermal"
          ! grep -E 'transact\(15|setInt\(|setFloat\(|setProperty\(' "$seat" "$thermal"
          grep -q 'ASIENTOS A · APAGADAS' "$cockpit"
          grep -q 'ASIENTOS B · ENCENDIDAS' "$cockpit"
          grep -q 'COMPARTIR LUCES ASIENTOS' "$cockpit"
          grep -q 'TEMPERATURAS / MOTOR · VER CÓDIGOS' "$cockpit"
          grep -q 'ESTADO SIN VALIDAR' "$cockpit"
          grep -q 'RPM: SIN LECTURA' "$cockpit"
          # Rear-seat warning, occupancy, volume and buzzer read-only.
          belt=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1RearSeatBeltProbe.java
          grep -q '557856516' "$belt"
          grep -q '557856533' "$belt"
          grep -q '557856534' "$belt"
          grep -q '354421634,16' "$belt"
          grep -q '356518832,64' "$belt"
          grep -q '557847073' "$belt"
          grep -q '557862921' "$belt"
          grep -q 'b.transact(2,data,reply,0)' "$belt"
          ! grep -E 'transact\(15|setInt\(|setFloat\(|setProperty\(' "$belt"
          grep -q 'CINTURONES A · SUELTOS' "$cockpit"
          grep -q 'CINTURONES B · ABROCHADO' "$cockpit"
      - name: Front horizon LED show/welcome status read only regression
        shell: bash
        run: |
          set -euo pipefail
          probe=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1HorizonLedReadOnlyProbe.java
          ui=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q '557843630' "$probe"
          grep -q '557843784' "$probe"
          grep -q '557867035' "$probe"
          grep -q '557867047' "$probe"
          grep -q 'b.transact(2,d,r,0)' "$probe"
          ! grep -E 'transact\(15|setInt\(|setFloat\(|setProperty\(' "$probe"
          grep -q 'REGISTRAR LED 30 S · NO ESCRIBE' "$ui"
          grep -q 'COMPARTIR LED' "$ui"
          grep -q 'reading.speed>0.5' "$ui"
          grep -q 'T1HorizonLedReadOnlyProbe.Snapshot.transitions' "$ui"
          thermal=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ThermalMotorProbe.java
          grep -q 'engineClusterTempRaw' "$thermal"
          grep -q 'if(i==2&&raw>0' "$thermal"
          grep -q 'engineTemperatureDisplay()' "$thermal"
          grep -q 'engineTempSource="CLUSTER ENGINE TEMP · 559940105 · RAW"' "$thermal"
          grep -q 'tempEngine.setText(result.engineTemperatureDisplay())' "$ui"
          grep -q '559940105 temperatura motor RAW' "$ui"

      - name: Photo evidence EV HEV mode and 12V voltage domain regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-mode-volt
          javac -encoding UTF-8 -d /tmp/t1-mode-volt \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ZonePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevPolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ElectricalEvidence.java \
            receiver/tests/T1ModeAndVoltageEvidenceTest.java
          java -cp /tmp/t1-mode-volt ar.com.rango5gps.drivelabauto.receiver.T1ModeAndVoltageEvidenceTest
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          probe=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1Aux12vReadOnlyProbe.java
          grep -q 'YA ESTÁS EN HEV' "$cockpit"
          grep -q 'preflightReason' "$cockpit"
          grep -q 'T1ElectricalEvidence.report(readings\[1\])' "$probe"
          # The new HAL side-channel is ONLY a getter. The candidate
          # 557843642 MUST NOT be transmitted as a write.
          hal=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PhevHalModeProbe.java
          grep -q 'HAL_PHEV_POWER_MODE_READ=557867211' "$hal"
          grep -q 'HAL_PHEV_POWER_MODE_WRITE_UNTESTED=557843642' "$hal"
          grep -q 'b.transact(2,d,r,0)' "$hal"
          ! grep -E 'transact\(15|setInt\(|setFloat\(|setProperty\(' "$hal"
          grep -q 'T1PhevHalModeProbe.inspect(app,mode)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevExperiment.java
          grep -q 'getPackageInfo(' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverActivity.java
          grep -q 'messageView.setTextColor(android.graphics.Color.BLACK)' \
            common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          # Physical EV/HEV test still manual & single shot, no new setters.
          grep -q 'checkStopped(b,confirmedMode,"CONTROL_2")' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevExperiment.java
      - name: Three compact modes and OSM advisor must preserve guarded Binder writes
        shell: bash
        run: |
          set -euo pipefail
          pilot=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualThreeModePilot.java
          osm=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OsmRoadAdvisor.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'T1DriveModeGate.allowed(gear,speed)' "$pilot"
          grep -q 'readFloat(b,2148)' "$pilot"
          grep -q 'SystemClock.sleep(420)' "$pilot"
          grep -q 'b.transact(15,data,reply,0)' "$pilot"
          grep -q 'T1OemDiagnosticLog.add(app,"READBACK_1043"' "$pilot"
          grep -q 'if(mode==target)' "$pilot"
          grep -q 'modeEvButton=topModeButton(modes,"EV",1)' "$cockpit"
          grep -q 'modeHevButton=topModeButton(modes,"HEV",2)' "$cockpit"
          grep -q 'modeMaxButton=topModeButton(modes,"EV MAX",3)' "$cockpit"
          grep -q 'threeModePilot.request(target' "$cockpit"
          grep -q 'OSM_ENABLED,false' "$cockpit"
          grep -q 'T1OfflineRoadMap.roadAt(getApplicationContext(),loc)' "$cockpit"
          grep -q 'loc.getAccuracy()>35' "$osm"
          grep -q 'overpass-api.de/api/interpreter' "$osm"
          grep -q '"motorway".equals(tag)' "$osm"
          grep -q '"residential".equals(tag)' "$osm"
          # OSM may never import or call a vehicle write interface.
          ! grep -E 'VehicleService|IVehicleControl|transact\(15|setProperty\(|1043.*write' "$osm"
          # No code path may invoke the triple mode pilot from a GPS callback:
          ! grep -E 'threeModePilot|T1ManualThreeModePilot' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OsmRoadAdvisor.java
      - name: Continuous OEM trip and passenger survival after boot, update or crash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-trip-resume
          javac -encoding UTF-8 -d /tmp/t1-trip-resume \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripRecoveryState.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1JourneyRecoveryFile.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1JourneyMetrics.java \
            receiver/tests/T1TripResumeContinuityTest.java
          java -cp /tmp/t1-trip-resume ar.com.rango5gps.drivelabauto.receiver.T1TripResumeContinuityTest
          svc=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripRecorderService.java
          client=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1JourneyStore.java
          ui=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          callbacks=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OemConsumptionCallbacks.java
          sync=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripSync.java
          boot=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/BootReceiver.java
          grep -q 'ACTION_RESTORE="t1.trip.RESTORE"' "$svc"
          grep -q 'START_STICKY' "$svc"
          grep -q 'new FileOutputStream(path,restoring)' "$svc"
          grep -q 'T1TripRecoveryState.read(currentFile(this))' "$svc"
          grep -q 'putBoolean(DESIRED,false)' "$svc"
          grep -q 'parkedMs' "$svc"
          grep -q 'offlineMs' "$svc"
          grep -q 'T1TripRecorderService.ACTION_RESTORE' "$boot"
          grep -q 'Intent.ACTION_MY_PACKAGE_REPLACED' "$boot"
          grep -q 'reconcileInterrupted(Context c)' "$client"
          grep -q 'putBoolean(CARRY_UNCERTAIN' "$client"
          grep -q 'putLong(ORIGINAL_TIME' "$client"
          grep -q 'withCarry(c,T1JourneyMetrics.between' "$client"
          ! grep -q '90000){clearPending' "$client"
          grep -q 'clientEndButton=compactButton(clientActions,"TERMINAR",RED' "$ui"
          grep -q 'VIAJE TOTAL GRABANDO' "$ui"
          grep -q 'VIAJE 1 GRABANDO' "$ui"
          grep -q 'ensureContinuousTrip()' "$ui"
          grep -q 'repairWithoutOldCsv' "$ui"
          grep -q 'boolean resume=tripMode&&file!=null&&file.isFile()' "$callbacks"
          grep -q 'count\[channel\]++' "$callbacks"
          grep -q 'int required=header.split' "$sync"
          # All passenger finish operations require explicit user action.
          grep -q 'this::finishClient' "$ui"
          ! grep -q 'T1JourneyStore.finish(this)' "$svc" "$boot"
      - name: Separate apps and Android APK builds
        run: gradle --no-daemon :sender:assembleDebug :receiver:assembleDebug
      - name: Verify independent identities, permissions and no telemetry
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          sender=sender/build/outputs/apk/debug/sender-debug.apk
          receiver=receiver/build/outputs/apk/debug/receiver-debug.apk
          test -s "$sender" && test -s "$receiver"
          "$aapt" dump badging "$sender" | grep "package: name='ar.com.rango5gps.drivelabauto.sender'"
          "$aapt" dump badging "$receiver" | grep "package: name='ar.com.rango5gps.drivelabauto.receiver'"
          ! "$aapt" dump permissions "$sender" | grep -E 'ACCESSIBILITY|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES|CAMERA'
          ! "$aapt" dump permissions "$receiver" | grep -E 'ACCESSIBILITY|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES|CAMERA'
          ! grep -R -E 'VehicleWindowPilot|VehicleReadOnly|transact\(15|AUTO_LINK_CAR' sender/src common/src
          ! grep -R -E 'VehicleWindowGroup|PedestrianAlertControl|transact\(15' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/BootReceiver.java receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverService.java
          grep -q 'ReceiverVehicleActivity' receiver/src/main/AndroidManifest.xml
          grep -q 'setForeground(true)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverVehicleActivity.java
          grep -q 'startOne' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/VehicleWindowGroup.java
          "$aapt" dump permissions "$sender" | grep REQUEST_INSTALL_PACKAGES
          "$aapt" dump permissions "$receiver" | grep REQUEST_INSTALL_PACKAGES
          "$aapt" dump xmltree "$sender" AndroidManifest.xml | grep 'updatefiles'
          "$aapt" dump xmltree "$receiver" AndroidManifest.xml | grep 'updatefiles'
          grep -q 'ACTION_INSTALL_PACKAGE' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'getPackageArchiveInfo' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'certificateHashes' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'SHA-256' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'FLAG_GRANT_READ_URI_PERMISSION' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'MODE_READ_ONLY' common/src/main/java/ar/com/rango5gps/drivelabauto/common/UpdateApkProvider.java
          grep -q 'getPackageManager().canRequestPackageInstalls()' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          ! grep -R 'openBrowser\|ABRIR DESCARGA' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          # T1 OEM Android 11 updater must not depend on a missing Settings screen.
          grep -q 'PackageInstaller.SessionParams.MODE_FULL_INSTALL' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'session.commit(callback.getIntentSender())' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'STATUS_PENDING_USER_ACTION' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverInstallResultReceiver.java
          grep -q 'REINTENTAR INSTALACIÓN YA DESCARGADA' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverActivity.java
          grep -q 'android:exported="false"' receiver/src/main/AndroidManifest.xml
          "$aapt" dump xmltree "$receiver" AndroidManifest.xml | grep 'ReceiverInstallResultReceiver'
          # Play Protect review: no broad notification listener or Bluetooth access in this corrective build.
          ! "$aapt" dump permissions "$sender" | grep BLUETOOTH_CONNECT
          # Android 14+ requires the matching dataSync foreground-service permission.
          "$aapt" dump permissions "$sender" | grep 'android.permission.FOREGROUND_SERVICE'
          "$aapt" dump permissions "$sender" | grep 'android.permission.FOREGROUND_SERVICE_DATA_SYNC'
          "$aapt" dump xmltree "$sender" AndroidManifest.xml | grep 'RouteDispatchService'
          grep -q 'startForeground(FOREGROUND_ID' sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/RouteDispatchService.java
          grep -q 'catch(RuntimeException error)' sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/RouteDispatchService.java
          ! "$aapt" dump xmltree "$sender" AndroidManifest.xml | grep SpotifySessionListener
          ! "$aapt" dump xmltree "$sender" AndroidManifest.xml | grep SpotifyBluetoothReceiver
          # Google Maps can share a place name or a short URL from T1.
          "$aapt" dump xmltree "$receiver" AndroidManifest.xml | grep 'ShareToClusterActivity'
          grep -q 'android.intent.action.SEND' receiver/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.VIEW' receiver/src/main/AndroidManifest.xml
          grep -q 'setPackage("com.waze")' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ShareToClusterActivity.java
          grep -q 'destination.wazeUri()' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ShareToClusterActivity.java
          grep -q 'fromShareLabel' common/src/main/java/ar/com/rango5gps/drivelabauto/common/MapLinks.java
          echo 'OK · Maps sharing inside T1 -> Waze navigate=yes without OEM access'
          echo 'OK · removed Spotify broad notification listener'
          echo 'OK · receiver session installer + actionable Jetour status'
          echo 'OK · sender/receiver native updater; no browser; verified APK'
          echo 'OK · two isolated apps; no vehicle control or monitoring'
      - uses: actions/upload-artifact@v4
        with:
          name: Sender-Debug-QA-Not-Install-Update
          path: sender/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Receiver-Debug-QA-Not-Install-Update
          path: receiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
