name: DriveLab Auto Standalone · QA independiente
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Protocol security regression (no Android runtime needed)
        run: |
          mkdir -p /tmp/bridge-test
          javac -encoding UTF-8 -d /tmp/bridge-test \
            common/src/main/java/ar/com/rango5gps/drivelabauto/common/BridgeCrypto.java \
            common/tests/BridgeCryptoTest.java \
            common/tests/BridgeCryptoClockSkewTest.java
          java -cp /tmp/bridge-test BridgeCryptoTest
          java -cp /tmp/bridge-test ar.com.rango5gps.drivelabauto.common.BridgeCryptoClockSkewTest
          javac -encoding UTF-8 -d /tmp/bridge-test \
            common/tests/android/net/Uri.java \
            common/src/main/java/ar/com/rango5gps/drivelabauto/common/MapLinks.java \
            common/tests/MapLinksTest.java
          java -cp /tmp/bridge-test MapLinksTest
      - name: T1 tank two-cycle evidence regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tank-evidence-test
          javac -encoding UTF-8 -d /tmp/tank-evidence-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TankEvidence.java \
            receiver/tests/T1TankEvidenceTest.java
          java -cp /tmp/tank-evidence-test T1TankEvidenceTest
      - name: CI186 fuel display two decimals regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuel-display-test
          javac -encoding UTF-8 -d /tmp/fuel-display-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1FuelDisplay.java \
            receiver/tests/T1FuelDisplayTest.java
          java -cp /tmp/fuel-display-test T1FuelDisplayTest
          testfile=receiver/tests/T1FuelDisplayTest.java
          tank=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TankDashboardActivity.java
          compact=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1InstrumentView.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumInstrumentView.java
          grep -Fq 'usableLitersText(30.10)' "$testfile"
          grep -Fq 'NAFTA UTILIZABLE' "$tank"
          grep -Fq 'T1FuelDisplay.usableLiters(' "$compact"
          grep -Fq 'T1FuelDisplay.usableLiters(' "$cockpit"
          grep -Fq 'T1FuelDisplay.usableLitersText(lastSample.fuel)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
      - name: Optimizer percentages are exclusively 5 to 100 touch dropdowns
        shell: bash
        run: |
          set -euo pipefail
          editor=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeActivity.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'private static final int PCT_MIN=5,PCT_STEP=5,PCT_COUNT=20' "$editor"
          grep -Fq 'p.minPct=percentageSelector(existing.minBattery);' "$editor"
          grep -Fq 'p.maxPct=percentageSelector(existing.maxBattery);' "$editor"
          grep -Fq 'p.forced=forcedSocSelector(existing.forcedSoc);' "$editor"
          grep -Fq 'int[] allowed=T1SocRegenWritePolicy.forcedSocPresets();' "$editor"
          grep -Fq 'power,strategy,forcedSocValue(p.forced)' "$editor"
          grep -Fq 'p.minPct=percentageSelector(existing.minBattery);' "$editor"
          grep -Fq 'p.maxPct=percentageSelector(existing.maxBattery);' "$editor"
          grep -Fq 'private int percentage(Spinner spinner)' "$editor"
          ! grep -Eq '(EditText|InputType|TYPE_CLASS_NUMBER)' "$editor"
          grep -Fq 'lastUiStats>=2400L' "$cockpit"
          grep -Fq 'if(!android.text.TextUtils.equals(' "$cockpit"
          grep -Fq 'T1-Cockpit-Continuity-Background' "$cockpit"
          grep -Fq 'private void maybeReconcileContinuity()' "$cockpit"
          grep -Fq 'private void updateStats(){' "$cockpit"
          grep -Fq '        maybeReconcileContinuity();' "$cockpit"
          grep -Fq 'p.minEnabled.setChecked(existing.minEnabled);' "$editor"
          grep -Fq 'p.maxEnabled.setChecked(existing.maxEnabled);' "$editor"
          grep -Fq 'minimumEnabled&&maximumEnabled&&lower>upper' "$editor"
          grep -Fq 'minOn,minimum,maxOn,maximum' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeStore.java
          grep -Fq 'k+"min_enabled_v2"' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeStore.java
          grep -Fq 'k+"max_enabled_v2"' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeStore.java
      - name: Cockpit full-system RAM/CPU and recovering NAV touch telemetry
        shell: bash
        run: |
          set -euo pipefail
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          monitor=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SystemLoadMonitor.java
          grep -Fq 'manager.getMemoryInfo(mem)' "$monitor"
          grep -Fq 'mem.totalMem,mem.availMem' "$monitor"
          grep -Fq 'Process.getElapsedCpuTime()' "$monitor"
          grep -Fq 'new FileReader("/proc/stat")' "$monitor"
          grep -Fq 'Debug.getPss()' "$monitor"
          grep -Fq 'uiLagNow=Math.max(0,now-monitorExpectedAt)' "$cockpit"
          grep -Fq 'dispatchTouchEvent(MotionEvent event)' "$cockpit"
          grep -Fq 'navTouchDowns++' "$cockpit"
          grep -Fq 'modeTouchDowns++' "$cockpit"
          grep -Fq 'navButtonClicks++' "$cockpit"
          grep -Fq 'cockpitModeRow=null;' "$cockpit"
          grep -Fq 'cockpitNavRow=null;' "$cockpit"
          grep -Fq 'globalToolbar=new T1GlobalToolbar(this);' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveActivity.java
          grep -Fq 'shell.addView(globalToolbar.view()' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveActivity.java
          grep -Fq 'roadTransitionPopup=null;' "$cockpit"
          grep -Fq 'SISTEMA RAM/CPU' "$cockpit"
          grep -Fq 'commentaryColumns=row();' "$cockpit"
          grep -Fq 'commentaryRight.addView(systemMonitorLine,' "$cockpit"
          ! grep -Fq 'RESCATE OPT' "$cockpit"
          grep -Fq 'this::confirmDeleteAllHistory' "$cockpit"
          grep -Fq 'this::confirmDeleteSelectedHistory' "$cockpit"
          grep -Fq '"ELIMINAR TODO".equals(typed.getText().toString().trim())' "$cockpit"
          grep -Fq 'inactive(c);' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripDeletion.java
          grep -Fq 'ACTION_VOICE_COMMAND' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1VoiceRouteActivity.java
          ! grep -Fq 'cockpitFrame.addView(roadTransitionPopup' "$cockpit"
      - name: Cockpit touch guard - fixed header, stable history, background I/O
        shell: bash
        run: |
          set -euo pipefail
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'globalToolbar.view()' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveActivity.java
          grep -Fq 'setContentView(scroll);' "$cockpit"
          grep -Fq 'T1WazeWheelService' receiver/src/main/AndroidManifest.xml
          grep -Fq 'collectAlternativeRoutes(root)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1WazeWheelService.java
          grep -Fq 'if(gear==Gear.D && speedKmh>RETURN_THRESHOLD_KMH)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/MirrorParkingPolicy.java
          grep -Fq 'historyEcoStatus.setTextIsSelectable(false);' "$cockpit"
          grep -Fq 'historyEcoStatus.setFocusable(false);' "$cockpit"
          grep -Fq 'scroll.setDescendantFocusability(' "$cockpit"
          grep -Fq 'secondary.getVisibility()==android.view.View.VISIBLE' "$cockpit"
          grep -Fq 'historyUiBusy.compareAndSet(false,true)' "$cockpit"
          grep -Fq 'new Thread(()->{' "$cockpit"
          grep -Fq 'snapshot=loadHistorySnapshot();' "$cockpit"
          grep -Fq 'ui.post(()->{' "$cockpit"
          grep -Fq 'if(!snapshot.signature.equals(renderedHistorySignature))' "$cockpit"
          grep -Fq 'button.setFocusable(false);' "$cockpit"
          grep -Fq 'paintHistoryButtons();' "$cockpit"
      - name: Cockpit live consumption must NOT depend on recording a trip
        shell: bash
        run: |
          set -euo pipefail
          callbacks=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OemConsumptionCallbacks.java
          cockpit=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'boolean startForCockpit()' "$callbacks"
          grep -Fq 'logFile=cockpitMode?null:file' "$callbacks"
          grep -Fq 'if(tripMode||cockpitMode)' "$callbacks"
          grep -Fq '.putString("source",tripMode?"TRIP":"COCKPIT")' "$callbacks"
          grep -Fq 'if(tripFeeding)' "$cockpit"
          grep -Fq 'if(passive.startForCockpit())dashboardConsumption=passive;' "$cockpit"
          grep -Fq 'dashboardConsumption.stop();' "$cockpit"
          grep -Fq 'maintainFuelMonitor();' "$cockpit"
          grep -Fq 'new T1TripTelemetry(' "$cockpit"
      - name: OEM 500m paired fuel, energy and distance audit (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oem-segment-test
          javac -encoding UTF-8 -d /tmp/oem-segment-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SegmentConsumption.java \
            receiver/tests/T1SegmentConsumptionTest.java
          java -cp /tmp/oem-segment-test ar.com.rango5gps.drivelabauto.receiver.T1SegmentConsumptionTest
          grep -q 'MAX_BATCHES_PER_FILE=4' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripSync.java
          grep -q 'b.getName().compareTo(a.getName())' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripSync.java
      - name: T1 passenger checkpoint ledger and GPS advisory regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-journey-test
          javac -encoding UTF-8 -d /tmp/t1-journey-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1JourneyMetrics.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ZonePolicy.java \
            receiver/tests/T1JourneyMetricsTest.java \
            receiver/tests/T1ZonePolicyTest.java
          java -cp /tmp/t1-journey-test ar.com.rango5gps.drivelabauto.receiver.T1JourneyMetricsTest
          java -cp /tmp/t1-journey-test ar.com.rango5gps.drivelabauto.receiver.T1ZonePolicyTest
          # The new cockpit must NEVER issue arbitrary OEM setters or mode writes.
          ! grep -E 'transact\(15|setInt\(|setFloat\(' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ModeZoneStore.java
          grep -q 'T1PremiumCockpitActivity' receiver/src/main/AndroidManifest.xml
      - name: Eco trip speed bins, OSM coverage and live 500m autonomy (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-eco-rating
          javac -encoding UTF-8 -d /tmp/t1-eco-rating \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1EcoTripMetrics.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TrafficFlowPolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1LiveConsumption.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripMath.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ExperimentalRange.java \
            receiver/tests/T1EcoTripMetricsTest.java \
            receiver/tests/T1TrafficFlowPolicyTest.java \
            receiver/tests/T1LiveConsumptionTest.java
          java -cp /tmp/t1-eco-rating ar.com.rango5gps.drivelabauto.receiver.T1EcoTripMetricsTest
          java -cp /tmp/t1-eco-rating ar.com.rango5gps.drivelabauto.receiver.T1TrafficFlowPolicyTest
          java -cp /tmp/t1-eco-rating ar.com.rango5gps.drivelabauto.receiver.T1LiveConsumptionTest
          grep -Fq 'eco.sample(s.timestamp,measure.km,dt' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripRecorderService.java
          grep -Fq 'historyEcoStatus.setText' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -Fq 'T1EcoTripMonitor.live(this,ecoScope)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
      - name: OEM SOC/regen verified-only auto-write policy (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/soc-regen-policy
          javac -encoding UTF-8 -d /tmp/soc-regen-policy \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenWritePolicy.java \
            receiver/tests/T1SocRegenWritePolicyTest.java
          java -cp /tmp/soc-regen-policy ar.com.rango5gps.drivelabauto.receiver.T1SocRegenWritePolicyTest
          code=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenPilot.java
          grep -Fq 'data.writeInt(target);' "$code"
          grep -Fq 'preflight(b,"SOC_REGEN_ANTES_"' "$code"
          grep -Fq 'regenDriveEligible(gear,speed)' "$code"
          grep -Fq 'verify(b,id,target,active)' "$code"
          grep -Fq 'set(b,id,previous,null)' "$code"
          ! grep -Fq 'boolean test(' "$code"
          grep -Fq 'boolean apply(' "$code"
      - name: EV from FORZADO disarms verified SMART first; EV MAX self-clears (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ev-smart-0276
          javac -encoding UTF-8 -d /tmp/ev-smart-0276 \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenWritePolicy.java \
            receiver/tests/T1SocRegenWritePolicyTest.java
          java -cp /tmp/ev-smart-0276 ar.com.rango5gps.drivelabauto.receiver.T1SocRegenWritePolicyTest
          python3 - <<'PY'
          from pathlib import Path
          base=Path('receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver')
          pilot=(base/'T1ManualThreeModePilot.java').read_text()
          policy=(base/'T1SocRegenWritePolicy.java').read_text()
          editor=(base/'T1OptimizedModeActivity.java').read_text()
          assert pilot.index('ensureSmartBeforeEv(b,target,visible);') < pilot.index('data.writeInt(1043);data.writeInt(target);'), 'SMART must be confirmed BEFORE EV setter'
          assert 'if(powerTarget!=1)return;' in pilot, 'EV MAX must skip extra SMART command'
          assert 'int before=readInt(b,1040);' in pilot
          assert 'data.writeInt(1040);data.writeInt(2); // SMART' in pilot
          assert 'EV_SMART_READBACK' in pilot and 'EV_POST_SMART_SEGURIDAD' in pilot
          assert 'oemSocWriteInProgress()' in pilot, 'never race another SOC writer'
          assert 'electricPowerRequiresSmart(rule.power)?SMART:' in policy, 'never restore FORZADO for EV/EV MAX'
          assert 'p.strategy.setEnabled(!electric);' in editor
          assert 'p.power.setOnItemSelectedListener' in editor
          print('PASS: HEV FORZADO -> read1040 -> single SMART write+readback -> EV1043; EV MAX no added SMART write')
          PY
      - name: SOC optimizer regression - new road/profile only; no prior 1041
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-soc-transition
          javac -encoding UTF-8 -d /tmp/t1-soc-transition \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenWritePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenTransitionGate.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1DriveModeGate.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAutoGate.java \
            receiver/tests/T1SocRegenTransitionGateTest.java
          java -cp /tmp/t1-soc-transition ar.com.rango5gps.drivelabauto.receiver.T1SocRegenTransitionGateTest
          pilot=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenPilot.java
          auto=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAutoService.java
          editor=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeActivity.java
          grep -Fq '1041_SIN_SOC_PREVIO' "$pilot"
          grep -Fq 'ETAPA_2_WRITE_REQ' "$pilot"
          grep -Fq 'ETAPA_3_READBACK' "$pilot"
          grep -Fq 'ETAPA_3_INCIERTA' "$pilot"
          grep -Fq 'socProfileGate.recordConfirmed(targets);' "$auto"
          grep -Fq 'OPT_SOC_TRAS_VIA_3_DE_3' "$auto"
          ! grep -Fq 'T1SocRegenTransitionGate.Reason.WAIT_STABLE' "$auto"
          ! grep -Fq 'OPT_SOC_TRANSICION_3_DE_3' "$auto"
          grep -Fq 'showSocDiagnostic()' "$editor"
          ! grep -Fq 'auxVotes=' "$auto"
      - name: Decode Jetour 1041 photographed raw values before confirming forced SOC (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-soc-1041
          javac -encoding UTF-8 -d /tmp/t1-soc-1041 \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenWritePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocTargetCodec.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocModePolicy.java \
            receiver/tests/T1SocTargetCodecTest.java
          java -cp /tmp/t1-soc-1041 ar.com.rango5gps.drivelabauto.receiver.T1SocTargetCodecTest
          pilot=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocRegenPilot.java
          auto=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedAutoService.java
          grep -Fq 'T1SocTargetCodec.confirmsRequested(' "$pilot"
          grep -Fq 'T1SocTargetCodec.confirmsRequested(' "$auto"
          ! grep -Fq 'snapshot.socTargetInt==targets.forcedSoc' "$auto"
      - name: Private cloud SOC diagnostic CSV and Android chooser removal (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-oem-report
          javac -encoding UTF-8 -d /tmp/t1-oem-report \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OemReportCsv.java \
            receiver/tests/T1OemReportCsvTest.java
          java -cp /tmp/t1-oem-report ar.com.rango5gps.drivelabauto.receiver.T1OemReportCsvTest
          activity=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModeActivity.java
          store=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OemDiagnosticLog.java
          server=server/supabase/drivelab-auto-diagnostics/index.ts
          client=receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1CloudDiagnostics.java
          grep -Fq 'T1CloudDiagnostics.upload(this,cloudCsv,' "$activity"
          grep -Fq 'SUBIR AL SERVIDOR' "$activity"
          grep -Fq 'new Intent(this,ReceiverVehicleActivity.class)' "$activity"
          ! grep -Fq 'Intent.createChooser(' "$activity"
          ! grep -Fq 'Intent.ACTION_SEND' "$activity"
          grep -Fq 'code_diag_' "$store"
          grep -Fq 'T1TripRecorderService.tripDir(app)' "$store"
          grep -Fq 'code_diag' "$server"
          grep -Fq 'code_diag' "$client"
      - name: Four road blocks with two independent sequential SOC rules (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-dual-soc-rules
          javac -encoding UTF-8 -d /tmp/t1-dual-soc-rules \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1OptimizedDualRulePolicy.java \
            receiver/tests/T1OptimizedDualRulePolicyTest.java
          java -cp /tmp/t1-dual-soc-rules ar.com.rango5gps.drivelabauto.receiver.T1OptimizedDualRulePolicyTest
          python3 - <<'PY'
          from pathlib import Path
          d=Path('receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver')
          auto=(d/'T1OptimizedAutoService.java').read_text()
          store=(d/'T1OptimizedModeStore.java').read_text()
          ui=(d/'T1OptimizedModeActivity.java').read_text()
          header=(d/'T1GlobalToolbar.java').read_text()
          assert 'selectWithHold(' in auto, 'last confirmed rule must be held in SOC gap'
          assert 'if(selected.held)' in auto and 'return;' in auto, 'no writes in threshold gap'
          assert 'heldRoad=road;' in auto and 'heldSlot=slot;' in auto, 'only confirmed OEM applied rule is held'
          assert 'if(!selected.matched())' in auto and 'SOC SIN REGLA' in auto, 'no implicit fallback'
          assert 'getSecond(Context c' not in store or 'getSecond(' in store, 'secondary rule storage'
          assert 'road_"+r.name()+"_b_enabled' in store
