name: DriveLab Auto Standalone · QA independiente
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          tool=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$tool" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Protocol security regression (no Android runtime needed)
        run: |
          mkdir -p /tmp/bridge-test
          javac -encoding UTF-8 -d /tmp/bridge-test \
            common/src/main/java/ar/com/rango5gps/drivelabauto/common/BridgeCrypto.java \
            common/tests/BridgeCryptoTest.java \
            common/tests/BridgeCryptoClockSkewTest.java
          java -cp /tmp/bridge-test BridgeCryptoTest
          java -cp /tmp/bridge-test ar.com.rango5gps.drivelabauto.common.BridgeCryptoClockSkewTest
          javac -encoding UTF-8 -d /tmp/bridge-test \
            common/tests/android/net/Uri.java \
            common/src/main/java/ar/com/rango5gps/drivelabauto/common/MapLinks.java \
            common/tests/MapLinksTest.java
          java -cp /tmp/bridge-test MapLinksTest
      - name: T1 tank two-cycle evidence regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tank-evidence-test
          javac -encoding UTF-8 -d /tmp/tank-evidence-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TankEvidence.java \
            receiver/tests/T1TankEvidenceTest.java
          java -cp /tmp/tank-evidence-test T1TankEvidenceTest
      - name: CI186 fuel display two decimals regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuel-display-test
          javac -encoding UTF-8 -d /tmp/fuel-display-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1FuelDisplay.java \
            receiver/tests/T1FuelDisplayTest.java
          java -cp /tmp/fuel-display-test T1FuelDisplayTest
      - name: OEM 500m paired fuel, energy and distance audit (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oem-segment-test
          javac -encoding UTF-8 -d /tmp/oem-segment-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SegmentConsumption.java \
            receiver/tests/T1SegmentConsumptionTest.java
          java -cp /tmp/oem-segment-test ar.com.rango5gps.drivelabauto.receiver.T1SegmentConsumptionTest
          grep -q 'MAX_BATCHES_PER_FILE=4' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripSync.java
          grep -q 'b.getName().compareTo(a.getName())' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripSync.java
      - name: T1 passenger checkpoint ledger and GPS advisory regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-journey-test
          javac -encoding UTF-8 -d /tmp/t1-journey-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1JourneyMetrics.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ZonePolicy.java \
            receiver/tests/T1JourneyMetricsTest.java \
            receiver/tests/T1ZonePolicyTest.java
          java -cp /tmp/t1-journey-test ar.com.rango5gps.drivelabauto.receiver.T1JourneyMetricsTest
          java -cp /tmp/t1-journey-test ar.com.rango5gps.drivelabauto.receiver.T1ZonePolicyTest
          # The new cockpit must NEVER issue arbitrary OEM setters or mode writes.
          ! grep -E 'transact\\(15|setInt\\(|setFloat\\(' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ModeZoneStore.java
          grep -q 'T1PremiumCockpitActivity' receiver/src/main/AndroidManifest.xml
      - name: T1 cockpit client reset, live autonomy, engine and SOC policy (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-cockpit-test
          javac -encoding UTF-8 -d /tmp/t1-cockpit-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripMath.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1JourneyMetrics.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ZonePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1CockpitScope.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PowerFlowPolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1SocModePolicy.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ExperimentalRange.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevPolicy.java \
            receiver/tests/T1CockpitLiveTest.java
          java -cp /tmp/t1-cockpit-test ar.com.rango5gps.drivelabauto.receiver.T1CockpitLiveTest
          # Exactly one manual EV→HEV mode target, no GPS or background write.
          grep -q 'POWER_MODE_ID=1043,HEV=2' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevPolicy.java
          grep -q 'checkStopped(b,confirmedMode,"CONTROL_2")' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevExperiment.java
          grep -q 'd.writeInt(T1ManualHevPolicy.HEV)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevExperiment.java
          ! grep -E 'transact\\(15|setInt\\(' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ModeZoneStore.java
          grep -q 'LAST_SAMPLE_TIME' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripRecorderService.java
          grep -q 'T1JourneyStore.fulfillPending' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripRecorderService.java
      - name: EV/HEV trace and cabin light read-only boundaries (static)
        shell: bash
        run: |
          set -euo pipefail
          # A new light probe must perform NO property setter or unsafe OEM write.
          ! grep -E 'transact\\(15|writeHev|setProperty\\(' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1CabinLightReadOnlyProbe.java
          grep -q 'b.transact(2,in,out,0)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1CabinLightReadOnlyProbe.java
          grep -q 'T1OemDiagnosticLog.add(app,"CONTROL_1"' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevExperiment.java || \
          grep -q 'checkStopped(b,mode,"CONTROL_1")' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ManualHevExperiment.java
          grep -q 'NO SE ENVIÓ COMANDO' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'DIAGNOSTICAR · NO ESCRIBE' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'CAPTURA A · ANTES' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          grep -q 'CAPTURA B · DESPUÉS' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          # The 12V probe only reads IALCar properties from our fixed catalog.
          ! grep -E 'transact\\(15|setInt\\(|writeProperty|setProperty' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1Aux12vReadOnlyProbe.java
          grep -q 'b.transact(2,data,reply,0)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1Aux12vReadOnlyProbe.java
          grep -q 'b.transact(9,data,reply,0)' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1Aux12vReadOnlyProbe.java
          grep -q 'LEER 12 V' \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
      - name: Jetour T1 immersive fullscreen and reversible navigation bars
        shell: bash
        run: |
          set -euo pipefail
          test -f receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          test -f receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveActivity.java
          for activity in ReceiverActivity ReceiverVehicleActivity T1PremiumCockpitActivity T1TankDashboardActivity; do
            grep -q "class $activity extends T1ImmersiveActivity" \
              "receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/$activity.java"
          done
          grep -q 'FLAG_FULLSCREEN' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          grep -q 'SYSTEM_UI_FLAG_IMMERSIVE_STICKY' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          grep -q 'setDecorFitsSystemWindows(false)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          grep -q 'WindowInsets.Type.navigationBars()' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          grep -q 'setDecorFitsSystemWindows(true)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1ImmersiveMode.java
          grep -q 'T1ImmersiveMode.setEnabled(this' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverActivity.java
          grep -q 'T1ImmersiveMode.setEnabled(this' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1PremiumCockpitActivity.java
          ! grep -E 'CATEGORY_HOME|WRITE_SECURE_SETTINGS|SYSTEM_ALERT_WINDOW.*new' \
            receiver/src/main/AndroidManifest.xml
      - name: Mirror parking R/D policy regression (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mirror-parking-policy-test
          javac -encoding UTF-8 -d /tmp/mirror-parking-policy-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/MirrorParkingPolicy.java \
            receiver/tests/MirrorParkingPolicyTest.java
          java -cp /tmp/mirror-parking-policy-test MirrorParkingPolicyTest
      - name: T1 fuel autonomy and recirculation regressions (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t1-trip-test
          javac -encoding UTF-8 -d /tmp/t1-trip-test \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/T1TripMath.java \
            receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/RecirculationPolicy.java \
            receiver/tests/T1TripMathTest.java \
            receiver/tests/RecirculationPolicyTest.java
          java -cp /tmp/t1-trip-test T1TripMathTest
          java -cp /tmp/t1-trip-test RecirculationPolicyTest
      - name: Separate apps and Android APK builds
        run: gradle --no-daemon :sender:assembleDebug :receiver:assembleDebug
      - name: Verify independent identities, permissions and no telemetry
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          sender=sender/build/outputs/apk/debug/sender-debug.apk
          receiver=receiver/build/outputs/apk/debug/receiver-debug.apk
          test -s "$sender" && test -s "$receiver"
          "$aapt" dump badging "$sender" | grep "package: name='ar.com.rango5gps.drivelabauto.sender'"
          "$aapt" dump badging "$receiver" | grep "package: name='ar.com.rango5gps.drivelabauto.receiver'"
          ! "$aapt" dump permissions "$sender" | grep -E 'ACCESSIBILITY|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES|CAMERA'
          ! "$aapt" dump permissions "$receiver" | grep -E 'ACCESSIBILITY|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES|CAMERA'
          ! grep -R -E 'VehicleWindowPilot|VehicleReadOnly|transact\(15|AUTO_LINK_CAR' sender/src common/src
          ! grep -R -E 'VehicleWindowGroup|PedestrianAlertControl|transact\(15' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/BootReceiver.java receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverService.java
          grep -q 'ReceiverVehicleActivity' receiver/src/main/AndroidManifest.xml
          grep -q 'setForeground(true)' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverVehicleActivity.java
          grep -q 'startOne' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/VehicleWindowGroup.java
          "$aapt" dump permissions "$sender" | grep REQUEST_INSTALL_PACKAGES
          "$aapt" dump permissions "$receiver" | grep REQUEST_INSTALL_PACKAGES
          "$aapt" dump xmltree "$sender" AndroidManifest.xml | grep 'updatefiles'
          "$aapt" dump xmltree "$receiver" AndroidManifest.xml | grep 'updatefiles'
          grep -q 'ACTION_INSTALL_PACKAGE' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'getPackageArchiveInfo' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'certificateHashes' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'SHA-256' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'FLAG_GRANT_READ_URI_PERMISSION' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'MODE_READ_ONLY' common/src/main/java/ar/com/rango5gps/drivelabauto/common/UpdateApkProvider.java
          grep -q 'getPackageManager().canRequestPackageInstalls()' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          ! grep -R 'openBrowser\|ABRIR DESCARGA' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          # T1 OEM Android 11 updater must not depend on a missing Settings screen.
          grep -q 'PackageInstaller.SessionParams.MODE_FULL_INSTALL' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'session.commit(callback.getIntentSender())' common/src/main/java/ar/com/rango5gps/drivelabauto/common/Updater.java
          grep -q 'STATUS_PENDING_USER_ACTION' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverInstallResultReceiver.java
          grep -q 'REINTENTAR INSTALACIÓN YA DESCARGADA' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ReceiverActivity.java
          grep -q 'android:exported="false"' receiver/src/main/AndroidManifest.xml
          "$aapt" dump xmltree "$receiver" AndroidManifest.xml | grep 'ReceiverInstallResultReceiver'
          # Play Protect review: no broad notification listener or Bluetooth access in this corrective build.
          ! "$aapt" dump permissions "$sender" | grep BLUETOOTH_CONNECT
          # Android 14+ requires the matching dataSync foreground-service permission.
          "$aapt" dump permissions "$sender" | grep 'android.permission.FOREGROUND_SERVICE'
          "$aapt" dump permissions "$sender" | grep 'android.permission.FOREGROUND_SERVICE_DATA_SYNC'
          "$aapt" dump xmltree "$sender" AndroidManifest.xml | grep 'RouteDispatchService'
          grep -q 'startForeground(FOREGROUND_ID' sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/RouteDispatchService.java
          grep -q 'catch(RuntimeException error)' sender/src/main/java/ar/com/rango5gps/drivelabauto/sender/RouteDispatchService.java
          ! "$aapt" dump xmltree "$sender" AndroidManifest.xml | grep SpotifySessionListener
          ! "$aapt" dump xmltree "$sender" AndroidManifest.xml | grep SpotifyBluetoothReceiver
          # Google Maps can share a place name or a short URL from T1.
          "$aapt" dump xmltree "$receiver" AndroidManifest.xml | grep 'ShareToClusterActivity'
          grep -q 'android.intent.action.SEND' receiver/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.VIEW' receiver/src/main/AndroidManifest.xml
          grep -q 'setPackage("com.waze")' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ShareToClusterActivity.java
          grep -q 'destination.wazeUri()' receiver/src/main/java/ar/com/rango5gps/drivelabauto/receiver/ShareToClusterActivity.java
          grep -q 'fromShareLabel' common/src/main/java/ar/com/rango5gps/drivelabauto/common/MapLinks.java
          echo 'OK · Maps sharing inside T1 -> Waze navigate=yes without OEM access'
          echo 'OK · removed Spotify broad notification listener'
          echo 'OK · receiver session installer + actionable Jetour status'
          echo 'OK · sender/receiver native updater; no browser; verified APK'
          echo 'OK · two isolated apps; no vehicle control or monitoring'
      - uses: actions/upload-artifact@v4
        with:
          name: Sender-Debug-QA-Not-Install-Update
          path: sender/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Receiver-Debug-QA-Not-Install-Update
          path: receiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
