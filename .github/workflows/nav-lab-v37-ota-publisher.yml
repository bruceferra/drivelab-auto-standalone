name: Publish DriveLab NAV LAB 37 OTA — owner-approved Jetour only
on:
  push:
    branches: [release/nav-lab-v37-own-waze-ota-20261121]
    paths: ['nav-release-v37/APPROVE_OTA_LAB37.json']

permissions:
  contents: write
  actions: read

concurrency:
  group: drivelab-nav-lab-v37-ota-release
  cancel-in-progress: false

jobs:
  publish-nav:
    if: github.repository == 'bruceferra/drivelab-auto-standalone' && github.ref == 'refs/heads/release/nav-lab-v37-own-waze-ota-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '44974368674'
      SOURCE_SHA: 'fb936333464610f80e843e5866c7dbff0bd4295d'
      TAG: 'bridge-lab-v37'
      APK: 'DriveLab-Bridge-LAB-v0.1.39-lab.37.apk'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require owner approval, signed build success and exact source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data=json.load(open('nav-release-v37/APPROVE_OTA_LAB37.json',encoding='utf-8'))
          assert data=={
            'approval':'PUBLICAR_NAV_LAB37_SOLO_JETOUR_POR_OTA',
            'sourceRunId':44974368674,
            'sourceCommit':'fb936333464610f80e843e5866c7dbff0bd4295d',
            'tag':'bridge-lab-v37',
            'versionName':'0.1.39-lab.37',
            'versionCode':41,
            'senderUnchanged':True,
            'publishLabChannel':True
          }, 'BLOCKED: expected exact owner-specified NAV LAB37 only'
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success || {
            echo 'BLOCKED: signed candidate CI not successful';exit 21;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA" || {
            echo 'BLOCKED: signed candidate head SHA mismatch';exit 22;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97 || {
            echo 'BLOCKED: stable release pointer changed';exit 23;
          }
          ! gh release view "$TAG" >/dev/null 2>&1 || {
            echo 'BLOCKED: LAB37 release already exists';exit 24;
          }
      - name: Retrieve signed candidate, verify exact legacy OTA filename/hash/size and original certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nav37 original
          gh run download "$SOURCE_RUN" --name DriveLab-NAV-LAB37-SIGNED-CANDIDATE-NO-OTA --dir dist/nav37
          (cd dist/nav37; sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          d=pathlib.Path('dist/nav37')
          apk=d/'DriveLab-Bridge-LAB-v0.1.39-lab.37.apk'
          m=json.loads((d/'bridge-lab.json').read_text(encoding='utf8'))
          assert apk.is_file() and apk.stat().st_size>1024
          expected={
            'channel':'bridge-lab',
            'packageName':'ar.com.rango5gps.drivelabauto.boot.lab',
            'versionName':'0.1.39-lab.37',
            'versionCode':41,
            'tag':'bridge-lab-v37',
            'size':apk.stat().st_size,
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/bridge-lab-v37/'+apk.name
          }
          assert m==expected,'BLOCKED: invalid metadata or unexpected apk name'
          assert apk.name=='DriveLab-Bridge-LAB-v'+m['versionName']+'.apk','BLOCKED: legacy updater APK naming regression'
          assert re.fullmatch(r'0\.(?:1|2)\.[0-9]+-lab\.[0-9]+',m['versionName'])
          PY
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$sdk" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apk="dist/nav37/$APK"
          "$aapt" dump badging "$apk" | grep -F "package: name='ar.com.rango5gps.drivelabauto.boot.lab' versionCode='41' versionName='0.1.39-lab.37'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'DriveLab NAV'"
          "$signer" verify --print-certs "$apk" >/dev/null
          gh release download bridge-lab-v27 --pattern DriveLab-Bridge-LAB-v0.1.29-lab.27.apk --dir original
          printf '%s  %s\n' '7e051f6efa3089bbd06e632ca91229352b0d70fd8b3048d9ec99876a163fe3bc' 'original/DriveLab-Bridge-LAB-v0.1.29-lab.27.apk' | sha256sum -c -
          cert(){ "$signer" verify --print-certs "$1" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF;exit}'; }
          test -n "$(cert "$apk")"
          test "$(cert "$apk")" = "$(cert original/DriveLab-Bridge-LAB-v0.1.29-lab.27.apk)" || {
            echo 'BLOCKED: Android package certificate differs from installed NAV LAB27';exit 25;
          }
          gh api "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json?ref=bridge-lab-ota" > old-pointer-response.json
          jq -r .content old-pointer-response.json | base64 -d > old-pointer.json
          python3 - <<'PY'
          import json
          before=json.load(open('old-pointer.json'))
          assert before=={
            'channel':'bridge-lab',
            'packageName':'ar.com.rango5gps.drivelabauto.boot.lab',
            'versionName':'0.1.38-lab.36',
            'versionCode':40,
            'tag':'bridge-lab-v36',
            'size':5048501,
            'sha256':'b97bc5bc2f4ac13b1225e7a5ca732b142cc3e9d2e86aa9ef61888d3225aea18f',
            'apkUrl':'https://github.com/bruceferra/drivelab-auto-standalone/releases/download/bridge-lab-v36/DriveLab-Bridge-LAB-v0.1.38-lab.36.apk'
          }, 'BLOCKED: previous OTA pointer changed'
          PY
          gh release download v0.3.97 --pattern sender.json --dir original
          gh release download v0.3.97 --pattern receiver.json --dir original
          echo 'PASS original Android signer + LAB36 pointer + legacy BootUpdater LAB37 APK filename, Sender untouched' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish ONLY signed Jetour NAV LAB37 prerelease, verify downloaded file
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/nav37/$APK" dist/nav37/bridge-lab.json \
            --target "$SOURCE_SHA" --prerelease \
            --title 'DriveLab NAV LAB 37 · Abrir Waze real en clúster propio de NAV · prueba 45 s' \
            --notes 'LAB37: Prueba EXCLUSIVA estacionado de Waze REAL en una pantalla virtual DriveLabNAVClusterOwn creada por NAV y mostrada en Display 1 mediante Presentation propia. No usa servicios ni superficies externas. Antes de abrir Waze verifica las tareas Maps y Spotify del mosaico central mediante doble lectura ADB, rechaza Waze existente fuera de NAV, impide abrir en displays 0/1 o mover tareas. Verifica la tarea Waze del clúster y la integridad central. Botón de 45 segundos y limpieza limitada a la tarea propia, sin detener aplicaciones globalmente. La visibilidad física y alertas OEM no han sido verificadas con Waze; volante NAV permanece deshabilitado. Sender/Receiver inalterados. LAB36 conservada como rollback.'
          mkdir -p verify
          gh release download "$TAG" --pattern "$APK" --dir verify
          cmp "dist/nav37/$APK" "verify/$APK"
          gh release download "$TAG" --pattern bridge-lab.json --dir verify
          cmp dist/nav37/bridge-lab.json verify/bridge-lab.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97
      - name: Switch ONLY NAV LAB OTA pointer and verify Sender, Receiver unchanged
        shell: bash
        run: |
          set -euo pipefail
          old_sha=$(jq -r .sha old-pointer-response.json)
          test -n "$old_sha"
          content=$(base64 -w0 dist/nav37/bridge-lab.json)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json" \
            -f branch=bridge-lab-ota -f sha="$old_sha" \
            -f message='ota(nav): original-signed NAV LAB37 code41 real Waze in own Cluster' \
            -f content="$content" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/contents/bridge-lab.json?ref=bridge-lab-ota" --jq .content | base64 -d > current-bridge.json
          cmp current-bridge.json dist/nav37/bridge-lab.json
          mkdir -p current
          gh release download v0.3.97 --pattern sender.json --dir current
          gh release download v0.3.97 --pattern receiver.json --dir current
          cmp original/sender.json current/sender.json
          cmp original/receiver.json current/receiver.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.3.97
          echo 'PUBLISHED NAV LAB37 only: original signer/Android identity, correct OTA filename, separate Sender/Receiver unchanged. User must approve install.' >> "$GITHUB_STEP_SUMMARY"
